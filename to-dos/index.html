    el.classList.toggle("hide-counts",
      localStorage.getItem(COUNTS_KEY) === "0");

    const today = dayStart(new Date());
    const sections = dateSections(data);
    const buckets = {};
    sections.forEach(sec => { buckets[sec.id] = []; });
    const overdue = [], toSchedule = [], done = [];

    // Each task goes in the first section that holds its date. Open,
    // undated subtasks follow the task they're indented under
    allLists(data).forEach(([src, list]) => {
      const stack = [];
      list.forEach(task => {
        if (task.text === "") return;
        const indent = task.indent || 0;
        while (stack.length && stack[stack.length - 1].indent >= indent) {
          stack.pop();
        }
        const parent = stack.length ? stack[stack.length - 1].item : null;
        const r = taskRange(task, src);
        if (parent && !task.done && !r) {
          (parent.children = parent.children || []).push({ src, task });
          stack.push({ indent, item: parent });
          return;
        }
        let item = null;
        if (task.done) {
          done.push({ src, task });
        } else if (!r) {
          if (src === "simple" || src === "_later") {
            item = { src, task };
            toSchedule.push(item);
          }
        } else if (r.end < today) {
          item = { src, task, r };
          overdue.push(item);
        } else {
          const sec = sections.find(
            s => r.start >= s.range.start && r.end <= s.range.end
          ) || sections.find(
            s => r.start <= s.range.end && r.end >= s.range.start
          );
          if (sec) {
            item = { src, task, r };
            buckets[sec.id].push(item);
          }
        }
        stack.push({ indent, item });
      });
    });
    // Dated to-dos in notes join the same sections
    noteTodos().forEach(item => {
      if (item.task.done) {
        done.push(item);
        return;
      }
      const r = item.r;
      if (r.end < today) {
        overdue.push(item);
        return;
      }
      const sec = sections.find(
        s => r.start >= s.range.start && r.end <= s.range.end
      ) || sections.find(
        s => r.start <= s.range.end && r.end >= s.range.start
      );
      if (sec) buckets[sec.id].push(item);
    });

    const byDate = (a, b) => a.r.start - b.r.start;
    const byOrder = (a, b) => (a.task.order ?? 1e9) - (b.task.order ?? 1e9)
      || (a.r && b.r ? a.r.start - b.r.start : 0);

    // Overdue shows only when it has tasks
    if (overdue.length) {
      buildSection(el, { id: "overdue", name: "Overdue" },
        overdue.sort(byDate), data, tState, { showDate: true });
    }
    sections.forEach(sec => {
      buildSection(el, sec, buckets[sec.id].sort(byOrder), data, tState,
        { addable: true, showDate: sec.range.start < sec.range.end });
    });
    buildAddRange(el, data);
    buildSection(el, { id: "to-schedule", name: "To schedule", token: "" },
      toSchedule.sort(byOrder), data, tState,
      { addable: true, cls: "toggle-muted" });
    buildSection(el, { id: "_done", name: "Done" },
      done.sort(byDoneAt), data, tState, { cls: "toggle-done" });

    // Keep typing beneath the task just added with Enter
    if (datesAfter) {
      const want = datesAfter;
      datesAfter = null;
      const host = el.querySelector('.toggle-tasks[data-section="'
        + want.section + '"]');
      const t = host && [...host.querySelectorAll(".task:not(.placeholder)")]
        .find(x => x._task && x._task.text === want.text);
      if (t) {
        const ta = t.querySelector("textarea");
        ta.focus();
        const at = want.then === "split" ? 0 : ta.value.length;
        ta.setSelectionRange(at, at);
        if (want.then === "row") {
          ta.dispatchEvent(new KeyboardEvent("keydown",
            { bubbles: true, key: "Enter" }));
        }
      }
    }

    // Return to the new-task row the user was typing in
    if (datesRefocus) {
      const row = el.querySelector(
        '.task.placeholder[data-section="' + datesRefocus + '"] textarea'
      );
      datesRefocus = null;
      if (row) row.focus();
    }
    saveData(data);
  }

  // ---- To-dos from notes ----

  const NOTES_KEY = "notes-data";

  function loadNotes() {
    let raw = null;
    try {
      raw = localStorage.getItem(NOTES_KEY);
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.notes)) return data;
    } catch {}
    if (raw !== null) ToolkitSidebar.preserveRecovery(NOTES_KEY, raw);
    return null;
  }

  function htmlText(html) {
    const t = document.createElement("template");
    t.innerHTML = String(html || "").replace(/<br>/g, " ");
    return t.content.textContent;
  }

  // Every dated to-do in a note that isn't in the trash
  function noteTodos() {
    const data = loadNotes();
    if (!data) return [];
    const out = [];
    data.notes.forEach(n => {
      if (n.trashed || !Array.isArray(n.blocks)) return;
      n.blocks.forEach(b => {
        if (b.type !== "todo") return;
        const text = htmlText(b.html).trim();
        if (!text) return;
        const anchor = dayStart(
          new Date(b.anchorAt || n.updated || Date.now())
        );
        const r = textRange(text, anchor);
        if (!r) return;
        out.push({
          block: b, note: n, r, src: "_note",
          task: { done: !!b.checked, doneAt: b.doneAt, text }
        });
      });
    });
    return out;
  }

  // Tick or untick a note's to-do from here
  function setNoteTodo(noteId, blockId, checked) {
    const data = loadNotes();
    const n = data && data.notes.find(x => x.id === noteId);
    const b = n && n.blocks.find(x => x.id === blockId);
    if (!b) return;
    b.checked = checked;
    if (checked) b.doneAt = Date.now();
    else delete b.doneAt;
    localStorage.setItem(NOTES_KEY, JSON.stringify(data));

    // Mark the notes as changed so their next sync sends this tick
    try {
      const key = "sync-meta-notes.json";
      const meta = JSON.parse(localStorage.getItem(key));
      if (meta) {
        meta.updated = Date.now();
        localStorage.setItem(key, JSON.stringify(meta));
      }
    } catch {}
  }

  function noteTaskEl(item) {
    const el = document.createElement("div");
    el.className = "task note-task" + (item.task.done ? " done" : "");
    el.title = "from the note " + (item.note.title || "untitled");

    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = item.task.done;
    box.addEventListener("change", () => {
      setNoteTodo(item.note.id, item.block.id, box.checked);
      renderDates();
    });

    const wrap = document.createElement("div");
    wrap.className = "task-text-wrap";
    const text = document.createElement("div");
    text.className = "task-highlight note-text";
    text.innerHTML = highlightDates(item.task.text);
    wrap.appendChild(text);

    const link = document.createElement("a");
    link.className = "task-source note-link";
    link.href = "../notes/index.html#" + encodeURIComponent(item.note.id);
    link.textContent = "↗ " + (item.note.title.trim() || "untitled");

    el.append(box, wrap, link, focusBtn(() => ToolkitFocus.go({
      blockId: item.block.id, kind: "note", noteId: item.note.id
    }, item.task.text)));
    return el;
  }

  // ---- Done ----

  // A ticked task with text
  function isDone(task) {
    return task.done && task.text !== "";
  }

  // Most recently ticked first; older ticks without a time last
  function byDoneAt(a, b) {
    return (b.task.doneAt || 0) - (a.task.doneAt || 0);
  }

  // Short name for the list a task lives in
  function sourceLabel(src) {
    if (src === "simple") return "simple";
    if (src === "_later") return "later";
    if (src.startsWith("toggle-")) {
      const sec = loadToggleSections()
        .find(s => "toggle-" + s.id === src);
      return sec ? sec.name : "toggle";
    }
    if (src.startsWith("_ym-")) {
      const [, y, m] = src.split("-");
      return MONTH_NAMES[+m].slice(0, 3).toLowerCase() + " " + y;
    }
    return fmtDay(keyToDate(src), false);
  }

  // Date as "wed 28 oct", optionally with the year
  function fmtDay(d, withYear) {
    const part = o => d.toLocaleDateString("en-AU", o);
    return part({ weekday: "short" }) + " " + d.getDate() + " "
      + MONTH_NAMES[d.getMonth()].slice(0, 3)
      + (withYear ? " " + d.getFullYear() : "");
  }

  // Add the source label before the delete button
  function addSource(tEl, label) {
    const span = document.createElement("span");
    span.className = "task-source";
    span.textContent = label;
    tEl.insertBefore(span, tEl.lastChild);
  }

  // Toggle title for the day a task was ticked
  function doneDayLabel(ts) {
    if (!ts) return "Earlier";
    const d = new Date(ts);
    return "@" + fmtDay(d, d.getFullYear() !== new Date().getFullYear());
  }

  const DONE_SEC_KEY = "todo-done-sections";

  function loadDoneState() {
    try {
      return JSON.parse(localStorage.getItem(DONE_SEC_KEY)) || {};
    } catch { return {}; }
  }

  function renderDone() {
    const data = loadData();
    const el = document.getElementById("done-view");
    el.innerHTML = "";

    const items = [];
    allLists(data).forEach(([src, list]) => {
      list.forEach(task => {
        if (isDone(task)) items.push({ src, task });
      });
    });
    items.sort(byDoneAt);

    if (!items.length) {
      const empty = document.createElement("div");
      empty.className = "done-empty";
      empty.textContent = "no completed tasks yet.";
      el.appendChild(empty);
      return;
    }

    // One toggle per day ticked, most recent first
    const dState = loadDoneState();
    let group = null, groupEl = null;
    items.forEach(({ src, task }) => {
      const label = doneDayLabel(task.doneAt);
      if (label !== group) {
        group = label;
        const open = dState[label] === true;
        const section = document.createElement("div");
        section.className = "toggle-section";

        const header = document.createElement("div");
        header.className = "toggle-header";
        const arrow = document.createElement("span");
        arrow.className = "toggle-arrow" + (open ? "" : " collapsed");
        arrow.textContent = "\u25BC";
        const title = document.createElement("span");
        title.className = "toggle-title";
        title.textContent = label;
        header.appendChild(arrow);
        header.appendChild(title);

        groupEl = document.createElement("div");
        groupEl.className = "toggle-tasks";
        const body = document.createElement("div");
        body.className = "toggle-body" + (open ? "" : " collapsed");
        body.appendChild(groupEl);

        // Open or close in place so the change animates
        const key = label;
        [arrow, title].forEach(btn => {
          btn.addEventListener("click", () => {
            const st = loadDoneState();
            st[key] = st[key] !== true;
            localStorage.setItem(DONE_SEC_KEY, JSON.stringify(st));
            arrow.classList.toggle("collapsed", !st[key]);
            body.classList.toggle("collapsed", !st[key]);
          });
        });

        section.appendChild(header);
        section.appendChild(body);
        el.appendChild(section);
      }
      const tEl = createTaskEl(
        task,
        () => saveData(data),
        t => {
          setList(data, src, getList(data, src).filter(x => x !== t));
          saveData(data);
          renderDone();
        },
        { mirror: true, noPlaceholder: true, onDoneChange: renderDone }
      );
      tEl.title = "from " + sourceLabel(src);
      groupEl.appendChild(tEl);
    });
  }

  // ---- Week ----

  function renderWeekly() {
    const data = loadData();
    const dated = collectDated(data);
    const el = document.getElementById("weekly-view");
    el.innerHTML = "";

    const monday = getMonday(weekOffset);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);

    navLabel.textContent =
      fmtMonth(monday) === fmtMonth(sunday)
        ? fmtMonth(monday)
        : fmtMonth(monday) + " \u2013 "
          + fmtMonth(sunday);

    for (let i = 0; i < 7; i++) {
      const date = new Date(monday);
      date.setDate(monday.getDate() + i);
      const key = dateKey(date);
      if (!data.weekly[key]) data.weekly[key] = [];

      let cls = "day-col";
      if (isToday(date))     cls += " today";
      else if (isPast(date)) cls += " past";
      else                   cls += " future";

      const col = document.createElement("div");
      col.className = cls;

      const header = document.createElement("div");
      header.className = "day-header";
      header.innerHTML =
        '<div class="day-name">'
        + DAY_NAMES[i] + " " + date.getDate() + (isToday(date)
          ? '<span class="today-tag">today</span>' : "") + '</div>';

      const tasks = document.createElement("div");
      tasks.className = "day-tasks drop-zone";
      tasks.dataset.list = key;

      addMirrors(tasks, data, dated.byDay[key], renderWeekly);
      prepList(data, key).forEach((task, ti) => {
        tasks.appendChild(createTaskEl(
          task,
          () => saveData(data),
          t => {
            data.weekly[key] =
              data.weekly[key].filter(x => x !== t);
            saveData(data);
            renderWeekly();
          },
          { noPlaceholder: true,
            listKey: key, index: ti }
        ));
      });

      setupDropZone(tasks, key);

      col.appendChild(header);
      col.appendChild(tasks);
      setupClickToAdd(col, key, renderWeekly);
      el.appendChild(col);
    }

    // To schedule: undated tasks from the simple list and this column
    const lk = "_later";
    if (!data.weekly[lk]) data.weekly[lk] = [];

    const laterCol = document.createElement("div");
    laterCol.className = "day-col later-col";

    const laterH = document.createElement("div");
    laterH.className = "day-header";
    laterH.innerHTML = '<div class="day-name">to schedule</div>';

    const laterT = document.createElement("div");
    laterT.className = "day-tasks drop-zone";
    laterT.dataset.list = lk;

    // Undated simple-list tasks show here too; dragging one to a day
    // gives it that date
    const undated = data.simple
      .filter(t => t.text && !t.done && !taskRange(t, "simple"))
      .map(task => ({ src: "simple", task }));
    addMirrors(laterT, data, undated, renderWeekly);

    // Ticked tasks leave this column, as in the dates view
    prepList(data, lk).forEach((task, ti) => {
      if (isDone(task)) return;
      laterT.appendChild(createTaskEl(
        task,
        () => saveData(data),
        t => {
          data.weekly[lk] =
            data.weekly[lk].filter(x => x !== t);
          saveData(data);
          renderWeekly();
        },
        { noPlaceholder: true, onDoneChange: renderWeekly,
          listKey: lk, index: ti }
      ));
    });

    setupDropZone(laterT, lk);

    laterCol.appendChild(laterH);
    laterCol.appendChild(laterT);
    setupClickToAdd(laterCol, lk, renderWeekly);
    el.appendChild(laterCol);

    saveData(data);

    // Opening the week brings today into view
    if (weekJump) {
      weekJump = false;
      const t = el.querySelector(".day-col.today");
      if (t) t.scrollIntoView({ block: "nearest" });
    }
  }
  let weekJump = true;

  // ---- Month ----

  function getMonthStart(offset) {
    const d = new Date();
    return new Date(
      d.getFullYear(), d.getMonth() + offset, 1
    );
  }

  // Rendered span of weeks, and whether to jump to the chosen month
  let monthFrom = null, monthWeeks = 0, monthJump = true;
  let monthBusy = false;

  // Move the month view to a month (or today's week) and show it
  function jumpToMonth() {
    monthJump = true;
    renderMonth();
  }

  // Trace each month's edge: along the top of its first days, down
  // beside its first day, and along the bottom of the previous month's
  // last days, rounding each turn
  function drawMonthLines() {
    const el = document.getElementById("month-view");
    const old = document.getElementById("month-lines");
    if (old) old.remove();
    const cells = [...el.querySelectorAll(".day-col[data-date]")];
    if (!cells.length) return;
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.id = "month-lines";
    svg.setAttribute("width", el.scrollWidth);
    svg.setAttribute("height", el.scrollHeight);
    const R = 6;
    const gridL = cells[0].offsetLeft;
    const last = cells[6];
    const gridR = last.offsetLeft + last.offsetWidth;
    const top = c => c.offsetTop + 0.5;
    cells.forEach((cell, i) => {
      if (!cell.classList.contains("month-start") || i < 7) return;
      const col = i % 7;
      const y1 = top(cell);
      let d;
      if (col === 0) {
        d = "M" + gridL + " " + y1 + "H" + gridR;
      } else {
        const below = cells[i + 7 - col];
        const y2 = below ? top(below) : cell.offsetTop + cell.offsetHeight;
        const x = cell.offsetLeft - 0.5;
        d = "M" + gridL + " " + y2 + "H" + (x - R)
          + "Q" + x + " " + y2 + " " + x + " " + (y2 - R)
          + "V" + (y1 + R)
          + "Q" + x + " " + y1 + " " + (x + R) + " " + y1
          + "H" + gridR;
      }
      const path = document.createElementNS(ns, "path");
      path.setAttribute("d", d);
      svg.appendChild(path);
    });
    el.appendChild(svg);
  }

  // Redraw the line when the grid changes size
  let linesFrame = 0;
  function redrawMonthLines(delay = 0) {
    if (currentView !== "month") return;
    clearTimeout(linesFrame);
    linesFrame = setTimeout(drawMonthLines, delay);
  }
  window.addEventListener("resize", () => redrawMonthLines(50));

  // Cells grow as tasks are typed, so watch them too
  const cellWatch = window.ResizeObserver
    ? new ResizeObserver(() => redrawMonthLines(30)) : null;

  function renderMonth() {
    const data = loadData();
    const dated = collectDated(data);
    const el = document.getElementById("month-view");
    const keepTop = el.scrollTop;

    // Start a fresh span around the chosen month
    const target = getMonthStart(monthOffset);
    if (monthJump || !monthFrom) {
      monthFrom = addDays(weekStart(target), -8 * 7);
      monthWeeks = 24;
    }
    el.innerHTML = "";
    el.style.gridTemplateRows = "";

    // Day names, kept at the top while scrolling
    DAY_NAMES.forEach(name => {
      const hdr = document.createElement("div");
      hdr.className = "day-col month-head";
      hdr.innerHTML = '<div class="day-header" style="border-bottom:none">'
        + '<div class="day-name">' + name + '</div></div>';
      el.appendChild(hdr);
    });

    // Day cells, a week per row; the 1st of each month is labelled
    for (let i = 0; i < monthWeeks * 7; i++) {
      const date = addDays(monthFrom, i);
      const key = dateKey(date);

      let cls = "day-col";
      if (isToday(date)) cls += " today";
      else if (isPast(date)) cls += " past";
      if (date.getDate() === 1) cls += " month-start";

      const col = document.createElement("div");
      col.className = cls;
      col.dataset.date = key;

      const header = document.createElement("div");
      header.className = "day-header";
      header.innerHTML = '<div class="day-date" style="font-size:14px;">'
        + (date.getDate() === 1
          ? "1 " + MONTH_NAMES[date.getMonth()].slice(0, 3).toLowerCase()
          : date.getDate())
        + '</div>';

      const tasks = document.createElement("div");
      tasks.className = "day-tasks drop-zone";
      tasks.dataset.list = key;

      addMirrors(tasks, data, dated.byDay[key], renderMonth);
      prepList(data, key).forEach((task, ti) => {
        tasks.appendChild(createTaskEl(
          task,
          () => saveData(data),
          t => {
            data.weekly[key] =
              data.weekly[key].filter(x => x !== t);
            saveData(data);
            renderMonth();
          },
          { noPlaceholder: true,
            listKey: key, index: ti }
        ));
      });

      setupDropZone(tasks, key);

      col.appendChild(header);
      col.appendChild(tasks);
      setupClickToAdd(col, key, renderMonth);
      el.appendChild(col);
    }

    drawMonthLines();
    if (cellWatch) {
      cellWatch.disconnect();
      el.querySelectorAll(".day-col[data-date]").forEach(c => {
        cellWatch.observe(c);
      });
    }
    saveData(data);

    // Scroll to the start of the chosen month, else stay put
    if (monthJump) {
      monthJump = false;
      scrollMonthTo(monthOffset === 0 ? new Date() : target);
    } else {
      el.scrollTop = keepTop;
    }
    updateMonthLabel();
  }

  // Put the week before a date's week just under the day names: for
  // today, the current week sits on the second row; for another
  // month, its first week does
  function scrollMonthTo(d) {
    const content = document.getElementById("month-view");
    const cell = document.querySelector(
      '#month-view .day-col[data-date="'
      + dateKey(addDays(weekStart(d), -7)) + '"]'
    );
    if (!cell) return;
    const head = document.querySelector("#month-view .month-head");
    content.scrollTop += cell.getBoundingClientRect().top
      - content.getBoundingClientRect().top
      - (head ? head.offsetHeight : 0);
  }

  // The label shows the month with the most days on screen
  function updateMonthLabel() {
    if (currentView !== "month") return;
    const content = document.getElementById("month-view");
    const head = document.querySelector("#month-view .month-head");
    const box = content.getBoundingClientRect();
    const top = box.top + (head ? head.offsetHeight : 0);
    const counts = {};
    document.querySelectorAll("#month-view .day-col[data-date]")
      .forEach(cell => {
        const r = cell.getBoundingClientRect();
        const mid = (r.top + r.bottom) / 2;
        if (mid < top || mid > box.bottom) return;
        const d = keyToDate(cell.dataset.date);
        const k = d.getFullYear() * 12 + d.getMonth();
        counts[k] = (counts[k] || 0) + 1;
      });
    const keys = Object.keys(counts).map(Number);
    if (!keys.length) return;
    const best = keys.reduce((a, b) => counts[b] > counts[a] ? b : a);
    const shown = new Date(Math.floor(best / 12), best % 12, 1);
    navLabel.textContent = fmtMonth(shown);
    const now = new Date();
    monthOffset = best - (now.getFullYear() * 12 + now.getMonth());
    localStorage.setItem(MONTH_KEY, monthOffset);
  }

  // Add weeks above or below as the month view nears either end
  document.getElementById("month-view").addEventListener("scroll", () => {
    if (currentView !== "month" || monthBusy || !monthFrom) return;
    const c = document.getElementById("month-view");
    if (c.scrollTop < 300) {
      monthBusy = true;
      const before = c.scrollHeight;
      monthFrom = addDays(monthFrom, -4 * 7);
      monthWeeks += 4;
      renderMonth();
      c.scrollTop += c.scrollHeight - before;
      monthBusy = false;
    } else if (c.scrollTop + c.clientHeight > c.scrollHeight - 300) {
      monthBusy = true;
      monthWeeks += 4;
      renderMonth();
      monthBusy = false;
    }
    updateMonthLabel();
  });

  // ---- Year ----

  function renderYear() {
    const data = loadData();
    const dated = collectDated(data);
    const el = document.getElementById("year-view");
    el.innerHTML = "";

    const now = new Date();
    const yr = now.getFullYear() + yearOffset;
    navLabel.textContent = String(yr);

    const currentMonth = now.getMonth();
    const currentYear = now.getFullYear();

    for (let m = 0; m < 12; m++) {
      const listKey = "_ym-" + yr + "-"
        + String(m).padStart(2, "0");
      if (!data.weekly[listKey]) {
        data.weekly[listKey] = [];
      }

      const card = document.createElement("div");
      let cls = "year-month-card";
      if (yr === currentYear && m === currentMonth) {
        cls += " current-month";
      } else if (
        yr < currentYear
        || (yr === currentYear && m < currentMonth)
      ) {
        cls += " past-month";
      }
      card.className = cls;

      const title = document.createElement("div");
      title.className = "year-month-title";
      title.textContent = MONTH_NAMES[m].slice(0, 3);
      card.appendChild(title);

      const tasks = document.createElement("div");
      tasks.className =
        "year-month-tasks drop-zone";
      tasks.dataset.list = listKey;

      addMirrors(tasks, data, dated.byMonth[listKey], renderYear);
      prepList(data, listKey).forEach((task, ti) => {
        tasks.appendChild(createTaskEl(
          task,
          () => saveData(data),
          t => {
            data.weekly[listKey] =
              data.weekly[listKey]
                .filter(x => x !== t);
            saveData(data);
            renderYear();
          },
          { noPlaceholder: true,
            listKey: listKey, index: ti }
        ));
      });

      setupDropZone(tasks, listKey);

      card.appendChild(tasks);
      setupClickToAdd(card, listKey, renderYear);
      el.appendChild(card);
    }

    saveData(data);
  }

  // ---- Views ----

  let currentView = "weekly";

  const views = {
    simple: document.getElementById("simple-view"),
    dates:  document.getElementById("dates-view"),
    weekly: document.getElementById("weekly-view"),
    month:  document.getElementById("month-view"),
    year:   document.getElementById("year-view"),
    done:   document.getElementById("done-view")
  };

  let shownView = null;

  function renderCurrentView() {
    Object.values(views).forEach(
      v => v.classList.add("hidden")
    );
    const hasNav = ["weekly", "month", "year"]
      .includes(currentView);
    navCtrl.classList.toggle("hidden", !hasNav);
    document.getElementById("toolbar").classList.toggle("hidden", !hasNav);
    applySize(viewSize(currentView));
    applyWidth(viewWidth(currentView));
    if (window.ToolkitSidebar) {
      ToolkitSidebar.setActive(currentView);
      ToolkitSidebar.refresh();
    }
    views[currentView].classList.remove("hidden");

    if (window.ToolkitSidebar) {
      ToolkitSidebar.title(VIEW_TITLES[currentView], "to dos");
    }

    // Animate only when switching to a different view
    const switched = currentView !== shownView;
    if (switched) {
      document.getElementById("content").scrollTop = 0;
      monthJump = true;
      weekJump = true;
      // The month view always opens on today
      if (currentView === "month") monthOffset = 0;
      const v = views[currentView];
      v.classList.remove("view-in");
      void v.offsetWidth;
      v.classList.add("view-in");
      shownView = currentView;
    }

    if (currentView === "simple")  renderSimple();
    if (currentView === "dates")   renderDates();
    if (currentView === "weekly")  renderWeekly();
    if (currentView === "month")   renderMonth();
    if (currentView === "year")    renderYear();
    if (currentView === "done")    renderDone();
    if (switched) restoreScroll();
  }

  // ---- Remember scroll (simple, dates, year, done) ----

  const SCROLL_KEY = "todo-scroll";
  const SCROLL_VIEWS = ["simple", "dates", "year", "done"];
  const VIEW_TITLES = { dates: "dates", done: "done", month: "month",
    simple: "simple", weekly: "week", year: "year" };

  function scrollMap() {
    try { return JSON.parse(localStorage.getItem(SCROLL_KEY)) || {}; }
    catch { return {}; }
  }

  function restoreScroll() {
    if (!SCROLL_VIEWS.includes(currentView)) return;
    const el = document.getElementById("content");
    const top = scrollMap()[currentView] || 0;
    el.scrollTop = top;
    requestAnimationFrame(() => { el.scrollTop = top; });
  }

  let scrollTimer = 0;
  document.getElementById("content").addEventListener("scroll", e => {
    if (!SCROLL_VIEWS.includes(currentView)) return;
    clearTimeout(scrollTimer);
    const view = currentView, top = e.target.scrollTop;
    scrollTimer = setTimeout(() => {
      const map = scrollMap();
      map[view] = Math.round(top);
      try { localStorage.setItem(SCROLL_KEY, JSON.stringify(map)); } catch {}
    }, 150);
  });

  // ---- Theme / Size ----

  let currentTheme = "t-dark";
  function applyTheme(theme) {
    app.classList.remove(currentTheme);
    currentTheme = theme;
    app.classList.add(currentTheme);
    localStorage.setItem(THEME_KEY, currentTheme);
  }

  let currentSize = "size-m";
  function applySize(size) {
    app.classList.remove(currentSize);
    currentSize = size;
    app.classList.add(currentSize);
    setDropdownActive("dd-size", currentSize);
  }

  // Each view keeps its own width; views not yet set use normal
  let currentWidth = "width-normal";
  function applyWidth(w) {
    app.classList.remove(currentWidth);
    currentWidth = w;
    app.classList.add(currentWidth);
    setDropdownActive("dd-width", currentWidth);
  }

  // Width and size are shared by every view and page
  function viewWidth() {
    const w = localStorage.getItem("toolkit-width");
    return ["normal", "wide", "full"].includes(w) ? "width-" + w
      : "width-normal";
  }

  function saveViewWidth(view, w) {
    localStorage.setItem("toolkit-width", w.replace("width-", ""));
  }

  function viewSize() {
    const s = localStorage.getItem("toolkit-size");
    return ["s", "m", "l"].includes(s) ? "size-" + s : "size-m";
  }

  function saveViewSize(view, size) {
    localStorage.setItem("toolkit-size", size.replace("size-", ""));
  }

  // ---- Nav ----

  document.getElementById("prev-nav")
    .addEventListener("click", () => {
      if (currentView === "weekly") {
        weekOffset--;
        localStorage.setItem(WEEK_KEY, weekOffset);
        renderWeekly();
      } else if (currentView === "month") {
        monthOffset--;
        localStorage.setItem(MONTH_KEY, monthOffset);
        jumpToMonth();
      } else if (currentView === "year") {
        yearOffset--;
        localStorage.setItem(YEAR_KEY, yearOffset);
        renderYear();
      }
    });

  document.getElementById("next-nav")
    .addEventListener("click", () => {
      if (currentView === "weekly") {
        weekOffset++;
        localStorage.setItem(WEEK_KEY, weekOffset);
        renderWeekly();
      } else if (currentView === "month") {
        monthOffset++;
        localStorage.setItem(MONTH_KEY, monthOffset);
        jumpToMonth();
      } else if (currentView === "year") {
        yearOffset++;
        localStorage.setItem(YEAR_KEY, yearOffset);
        renderYear();
      }
    });

  document.getElementById("today-btn")
    .addEventListener("click", () => {
      if (currentView === "weekly") {
        weekOffset = 0;
        localStorage.setItem(WEEK_KEY, weekOffset);
        weekJump = true;
        renderWeekly();
      } else if (currentView === "month") {
        monthOffset = 0;
        localStorage.setItem(MONTH_KEY, monthOffset);
        jumpToMonth();
      } else if (currentView === "year") {
        yearOffset = 0;
        localStorage.setItem(YEAR_KEY, yearOffset);
        renderYear();
      }
    });

  // ---- Init ----

  // Older pages saved their own mode; the sidebar now shares one
  const savedTheme = localStorage.getItem(THEME_KEY);

  // The toggle view is now the dates view
  let savedView = localStorage.getItem(VIEW_KEY);
  if (savedView === "toggle") savedView = "dates";
  const hashView = location.hash.slice(1);
  if (VIEWS.includes(hashView)) savedView = hashView;
  if (VIEWS.includes(savedView)) currentView = savedView;
  window.addEventListener("hashchange", () => {
    const v = location.hash.slice(1);
    if (v !== currentView) showView(v);
  });

  const savedWeek = localStorage.getItem(WEEK_KEY);
  if (savedWeek !== null) {
    weekOffset = parseInt(savedWeek);
  }
  const savedMonth = localStorage.getItem(MONTH_KEY);
  if (savedMonth !== null) {
    monthOffset = parseInt(savedMonth);
  }
  const savedYear = localStorage.getItem(YEAR_KEY);
  if (savedYear !== null) {
    yearOffset = parseInt(savedYear);
  }

  // Show ticks and edits made in the notes in another tab
  window.addEventListener("storage", e => {
    if (e.key === NOTES_KEY && currentView === "dates") renderDates();
  });

  // Sidebar: views, shared mode, and this view's size and width
  ToolkitSidebar.init({
    active: currentView,
    mode: {
      apply: (m, anim) => {
        if (anim) animate("theme-anim", 300);
        applyTheme(m === "light" ? "t-light" : "t-dark");
      },
      initial: savedTheme === "t-light" ? "light" : "dark"
    },
    onView: showView,
    page: "to-dos/index.html",
    size: {
      get: () => currentSize.slice(5),
      set: v => changeSize("size-" + v)
    },
    width: {
      get: () => currentWidth.slice(6),
      set: v => changeWidth("width-" + v)
    }
  });

  renderCurrentView();

  // Sync to-dos and sections via Google Drive
  ToolSync.init({
    file:     "to-dos.json",
    keys:     [STORAGE_KEY, TOGGLE_SEC],
    onRemote: () => renderCurrentView()
  });
</script>
</body>
