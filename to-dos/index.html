<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To do</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: 'Segoe UI Light', 'Segoe UI',
      -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 300;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: background 0.15s, color 0.15s;
  }

  .t-dark {
    --bg:         #011627;
    --bg-surface: #01111f;
    --fg:         #d6deeb;
    --fg-muted:   #6c7a89;
    --border:     #1e3a52;
    --accent:     #7fdbca;
    --check:      #87DACA;
    --hover:      #012a3f;
    --sel-bg:     #012a3f;
    --sel-bdr:    #1e3a52;
    --sel-fg:     #d6deeb;
    --today-bg:   #134957;
    --past-bg:    rgba(19, 85, 92, 0.25);
    --drag-bg:    rgba(127, 219, 202, 0.08);
  }
  .t-light {
    --bg:         #fff;
    --bg-surface: #f6f8fa;
    --fg:         #24292e;
    --fg-muted:   #6a737d;
    --border:     #e1e4e8;
    --accent:     #0c969b;
    --check:      #87DACA;
    --hover:      #f1f8ff;
    --sel-bg:     #fff;
    --sel-bdr:    #d1d5da;
    --sel-fg:     #24292e;
    --today-bg:   rgba(19, 73, 87, 0.1);
    --past-bg:    rgba(19, 85, 92, 0.08);
    --drag-bg:    rgba(12, 150, 155, 0.06);
  }

  /* ---- Toolbar ---- */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    font-family: 'Segoe UI Light', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #nav-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #dropdown-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  #toolbar button {
    background: none;
    border: 1px solid var(--border);
    color: var(--fg-muted);
    cursor: pointer;
    font-size: 13px;
    padding: 3px 10px;
    border-radius: 4px;
    font-family: 'Segoe UI Light', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #toolbar button:hover {
    background: var(--hover);
    color: var(--fg);
  }
  #nav-label {
    font-size: 13px;
    color: var(--fg);
    font-weight: 600;
    min-width: 140px;
    text-align: center;
  }

  /* ---- Custom dropdown ---- */
  .dropdown { position: relative; display: inline-block; }
  .dropdown-btn {
    background: var(--sel-bg);
    border: 1px solid var(--sel-bdr);
    color: var(--sel-fg);
    font-size: 12px;
    padding: 4px 20px 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Segoe UI Light', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    white-space: nowrap;
    position: relative;
  }
  .dropdown-btn::after {
    content: '';
    position: absolute;
    right: 7px; top: 50%;
    transform: translateY(-50%);
    border-left: 3.5px solid transparent;
    border-right: 3.5px solid transparent;
    border-top: 4px solid var(--fg-muted);
  }
  .dropdown-menu {
    display: none;
    position: absolute;
    top: calc(100% + 2px);
    right: 0;
    background: var(--sel-bg);
    border: 1px solid var(--sel-bdr);
    border-radius: 4px;
    padding: 4px 0;
    z-index: 100;
    min-width: 100%;
    font-size: 12px;
    font-family: 'Segoe UI Light', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .dropdown.open .dropdown-menu { display: block; }
  .dropdown-item {
    padding: 5px 12px;
    cursor: pointer;
    color: var(--sel-fg);
    white-space: nowrap;
  }
  .dropdown-item:hover { background: var(--hover); }
  .dropdown-item.active { color: var(--accent); }

  /* ---- Content ---- */
  #content {
    flex: 1;
    overflow-y: auto;
    background: var(--bg);
  }
  textarea.task-input {
    background: transparent;
    border: none;
    color: var(--fg);
    font-family: 'Segoe UI Light', 'Segoe UI',
      'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    outline: none;
    width: 100%;
    resize: none;
    overflow: hidden;
    padding: 0;
    margin: 0;
    line-height: 1.4;
    min-height: 1.4em;
    field-sizing: content;
  }
  textarea.task-input::placeholder {
    color: var(--fg-muted);
    opacity: 0.6;
  }

  .task-text-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
  }
  .task-text-wrap textarea.task-input {
    position: relative;
    z-index: 1;
    color: transparent;
    caret-color: var(--fg);
  }
  .task-highlight {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    pointer-events: none;
    white-space: pre-wrap;
    word-break: break-word;
    overflow: hidden;
    color: var(--fg);
    z-index: 0;
    line-height: 1.4;
  }
  .task.done .task-highlight {
    text-decoration: line-through;
    color: var(--fg-muted);
  }
  .t-dark .task.done .task-highlight {
    color: #87DACA;
  }
  .task-highlight .date-token {
    color: #87DACA;
  }
  .task.done .task-highlight .date-token {
    color: var(--fg-muted);
  }
  .t-dark .task.done .task-highlight .date-token {
    color: #87DACA;
  }

  .t-dark .task input[type="checkbox"] {
    border-color: #87DACA;
  }
  .t-dark .task input[type="checkbox"]:checked {
    border-color: var(--check);
  }

  .size-s textarea.task-input { font-size: 12px; }
  .size-s .day-tasks textarea.task-input { font-size: 11px; }
  .size-m textarea.task-input { font-size: 14px; }
  .size-m .day-tasks textarea.task-input { font-size: 13px; }
  .size-l textarea.task-input { font-size: 17px; }
  .size-l .day-tasks textarea.task-input { font-size: 15px; }

  /* ---- Task ---- */
  .task {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    padding: 6px 0;
    transition: opacity 0.15s;
  }
  .task.indent-1 { padding-left: 24px; }
  .task.indent-2 { padding-left: 48px; }
  .task.indent-3 { padding-left: 72px; }
  .task.dragging { opacity: 0.3; }
  .task.drag-over-above {
    border-top: 2px solid var(--accent);
    padding-top: 4px;
  }
  .task.drag-over-below {
    border-bottom: 2px solid var(--accent);
    padding-bottom: 4px;
  }

  .task input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 16px; height: 16px; min-width: 16px;
    border: 1.5px solid var(--fg-muted);
    border-radius: 3px;
    cursor: pointer;
    margin-top: 2px;
    position: relative;
    background: transparent;
    flex-shrink: 0;
  }
  .task input[type="checkbox"]:checked {
    background: var(--check);
    border-color: var(--check);
  }
  .task input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 4px; top: 1px;
    width: 5px; height: 9px;
    border: solid var(--bg);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .task.done textarea.task-input {
    color: transparent;
  }
  .task .delete-btn {
    background: none; border: none;
    color: var(--fg-muted);
    cursor: pointer; font-size: 14px;
    padding: 0 4px; opacity: 0;
    transition: opacity 0.15s;
    margin-top: 1px; flex-shrink: 0;
  }
  .task:hover .delete-btn { opacity: 0.6; }
  .task .delete-btn:hover { opacity: 1; }

  /* Drop zone highlight */
  .drop-zone.drag-active {
    background: var(--drag-bg);
    min-height: 40px;
  }

  /* ---- Simple ---- */
  #simple-view {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 24px;
  }
  .section-heading {
    font-size: 13px; font-weight: 600;
    color: var(--fg-muted);
    letter-spacing: 0.04em;
    margin-bottom: 16px;
    font-family: 'Segoe UI Light', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* ---- Toggle ---- */
  #toggle-view {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 24px;
  }
  .toggle-section { margin-bottom: 32px; }
  .toggle-header {
    display: flex; align-items: center;
    gap: 8px;
    margin-bottom: 12px; user-select: none;
  }
  .toggle-arrow {
    font-size: 10px; color: var(--fg-muted);
    transition: transform 0.15s;
    display: inline-block; width: 14px;
    cursor: pointer; flex-shrink: 0;
  }
  .toggle-arrow.collapsed {
    transform: rotate(-90deg);
  }
  .toggle-tasks.collapsed { display: none; }
  .toggle-name-input {
    background: transparent;
    border: none;
    color: var(--fg-muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    font-family: 'Segoe UI Light', 'Segoe UI',
      -apple-system, BlinkMacSystemFont, sans-serif;
    outline: none;
    flex: 1;
    min-width: 0;
    cursor: pointer;
  }
  .toggle-name-input:focus {
    cursor: text;
    color: var(--fg);
  }
  .toggle-delete-btn {
    background: none; border: none;
    color: var(--fg-muted);
    cursor: pointer; font-size: 14px;
    padding: 0 4px; opacity: 0;
    transition: opacity 0.15s;
  }
  .toggle-header:hover .toggle-delete-btn {
    opacity: 0.4;
  }
  .toggle-delete-btn:hover {
    opacity: 1 !important;
  }
  .add-section-btn {
    background: none;
    border: 1px dashed var(--border);
    color: var(--fg-muted);
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Segoe UI Light', 'Segoe UI',
      -apple-system, BlinkMacSystemFont, sans-serif;
    width: 100%;
    text-align: center;
    transition: border-color 0.15s, color 0.15s;
  }
  .add-section-btn:hover {
    border-color: var(--fg-muted);
    color: var(--fg);
  }

  /* ---- Column grids ---- */
  .col-view {
    display: grid; margin: 0 auto;
    min-height: 100%;
  }
  #weekly-view {
    grid-template-columns: repeat(8, 1fr);
    max-width: 1200px; padding: 0 24px 60px;
  }
  #month-view {
    grid-template-columns: repeat(7, 1fr);
    max-width: 1200px; padding: 0 24px 60px;
  }
  .day-col {
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    min-width: 0;
    cursor: pointer;
  }
  .day-col:last-child { border-right: none; }
  .day-col.today { background: var(--today-bg); }
  .day-col.past  { background: var(--past-bg); }
  .day-header {
    padding: 12px 10px 8px;
    border-bottom: 1px solid var(--border);
    font-family: 'Segoe UI Light', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; flex-shrink: 0;
  }
  .day-name {
    font-size: 11px; font-weight: 600;
    color: var(--fg-muted);
    letter-spacing: 0.04em;
  }
  .day-date {
    font-size: 18px; font-weight: 600;
    color: var(--fg); margin-top: 2px;
  }
  .day-col.today .day-name { color: var(--accent); }
  .day-col.today .day-date { color: var(--accent); }
  .day-tasks {
    flex: 1; overflow-y: auto; padding: 8px 10px;
    cursor: pointer;
  }

  #month-view .day-header { padding: 8px 8px 6px; }
  #month-view .day-date { font-size: 15px; }
  #month-view .day-tasks {
    padding: 4px 8px;
    min-height: 32px;
    overflow-y: visible;
  }
  #month-view .task { padding: 3px 0; gap: 4px; }
  #month-view .task input[type="checkbox"] {
    width: 14px; height: 14px; min-width: 14px;
  }
  #month-view .task input[type="checkbox"]:checked::after {
    left: 3px; top: 0; width: 4px; height: 8px;
  }
  .day-col.other-month { opacity: 0.35; }

  /* ---- Year ---- */
  #year-view {
    max-width: 1200px; margin: 0 auto;
    padding: 24px 24px 60px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .year-month-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    min-height: 180px;
    max-height: 360px;
  }
  .year-month-card.past-month {
    background: var(--past-bg);
  }
  .year-month-card.current-month {
    background: var(--today-bg);
  }
  .year-month-title {
    font-size: 12px; font-weight: 600;
    color: var(--fg); padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-family: 'Segoe UI Light', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    flex-shrink: 0;
  }
  .year-month-card.current-month .year-month-title {
    color: var(--accent);
  }
  .year-month-tasks {
    flex: 1;
    overflow-y: auto;
    padding: 6px 10px;
    cursor: pointer;
  }
  .year-month-tasks .task { padding: 3px 0; gap: 6px; }
  .year-month-tasks .task input[type="checkbox"] {
    width: 14px; height: 14px; min-width: 14px;
  }
  .year-month-tasks .task
    input[type="checkbox"]:checked::after {
    left: 3px; top: 0; width: 4px; height: 8px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app" class="t-dark size-m">
  <div id="toolbar">
    <div id="nav-controls" class="hidden">
      <button id="prev-nav">&larr;</button>
      <button id="today-btn">Today</button>
      <span id="nav-label"></span>
      <button id="next-nav">&rarr;</button>
    </div>
    <div id="dropdown-controls">
      <div class="dropdown" id="dd-style">
        <div class="dropdown-btn">View</div>
        <div class="dropdown-menu">
          <div class="dropdown-item"
            data-value="simple">Simple</div>
          <div class="dropdown-item"
            data-value="toggle">Toggle</div>
          <div class="dropdown-item active"
            data-value="weekly">Week</div>
          <div class="dropdown-item"
            data-value="month">Month</div>
          <div class="dropdown-item"
            data-value="year">Year</div>
        </div>
      </div>
      <div class="dropdown" id="dd-theme">
        <div class="dropdown-btn">Theme</div>
        <div class="dropdown-menu">
          <div class="dropdown-item active"
            data-value="t-dark">Dark</div>
          <div class="dropdown-item"
            data-value="t-light">Light</div>
        </div>
      </div>
      <div class="dropdown" id="dd-size">
        <div class="dropdown-btn">Size</div>
        <div class="dropdown-menu">
          <div class="dropdown-item"
            data-value="size-s">Small</div>
          <div class="dropdown-item active"
            data-value="size-m">Medium</div>
          <div class="dropdown-item"
            data-value="size-l">Large</div>
        </div>
      </div>
    </div>
  </div>

  <div id="content">
    <div id="simple-view" class="hidden">
      <div id="simple-tasks" class="drop-zone"
        data-list="simple"></div>
    </div>

    <div id="toggle-view" class="hidden"></div>

    <div id="weekly-view"
      class="col-view hidden"></div>
    <div id="month-view"
      class="col-view hidden"></div>
    <div id="year-view" class="hidden"></div>
  </div>
</div>

<script src="../sync.js"></script>
<script>
  const STORAGE_KEY = "todo-data";
  const THEME_KEY   = "todo-theme";
  const VIEW_KEY    = "todo-view";
  const SIZE_KEY    = "todo-size";
  const WEEK_KEY    = "todo-week-offset";
  const MONTH_KEY   = "todo-month-offset";
  const YEAR_KEY    = "todo-year-offset";
  const TOGGLE_KEY  = "todo-toggle-state";
  const TOGGLE_SEC  = "todo-toggle-sections";

  const app      = document.getElementById("app");
  const navCtrl  = document.getElementById("nav-controls");
  const navLabel = document.getElementById("nav-label");

  let weekOffset = 0, monthOffset = 0, yearOffset = 0;

  // ---- Dropdowns ----

  document.querySelectorAll(".dropdown-btn")
    .forEach(btn => {
      btn.addEventListener("click", e => {
        e.stopPropagation();
        const dd = btn.parentElement;
        document.querySelectorAll(".dropdown.open")
          .forEach(d => {
            if (d !== dd) d.classList.remove("open");
          });
        dd.classList.toggle("open");
      });
    });

  document.addEventListener("click", () => {
    document.querySelectorAll(".dropdown.open")
      .forEach(d => d.classList.remove("open"));
  });

  function setDropdownActive(ddId, value) {
    document.getElementById(ddId)
      .querySelectorAll(".dropdown-item")
      .forEach(item => {
        item.classList.toggle(
          "active",
          item.dataset.value === value
        );
      });
  }

  document.querySelectorAll(
    "#dd-style .dropdown-item"
  ).forEach(item => {
    item.addEventListener("click", e => {
      e.stopPropagation();
      currentView = item.dataset.value;
      setDropdownActive("dd-style", currentView);
      localStorage.setItem(VIEW_KEY, currentView);
      document.getElementById("dd-style")
        .classList.remove("open");
      renderCurrentView();
    });
  });

  document.querySelectorAll(
    "#dd-theme .dropdown-item"
  ).forEach(item => {
    item.addEventListener("click", e => {
      e.stopPropagation();
      applyTheme(item.dataset.value);
      setDropdownActive("dd-theme", currentTheme);
      document.getElementById("dd-theme")
        .classList.remove("open");
    });
  });

  document.querySelectorAll(
    "#dd-size .dropdown-item"
  ).forEach(item => {
    item.addEventListener("click", e => {
      e.stopPropagation();
      applySize(item.dataset.value);
      setDropdownActive("dd-size", currentSize);
      document.getElementById("dd-size")
        .classList.remove("open");
    });
  });

  // ---- Data ----

  function loadData() {
    let data;
    try {
      data = JSON.parse(
        localStorage.getItem(STORAGE_KEY)
      ) || {
        simple: [], weekly: {},
        toggleData: {}
      };
    } catch {
      data = {
        simple: [], weekly: {},
        toggleData: {}
      };
    }
    // Migrate old toggle format
    if (data.toggle && !data.toggleData) {
      data.toggleData = {};
      if (data.toggle.today) {
        data.toggleData.today = data.toggle.today;
      }
      if (data.toggle.later) {
        data.toggleData.later = data.toggle.later;
      }
      delete data.toggle;
    }
    if (!data.toggleData) data.toggleData = {};
    return data;
  }

  function saveData(data) {
    localStorage.setItem(
      STORAGE_KEY, JSON.stringify(data)
    );
  }

  // Toggle sections
  function loadToggleSections() {
    try {
      const s = JSON.parse(
        localStorage.getItem(TOGGLE_SEC)
      );
      if (Array.isArray(s) && s.length) return s;
    } catch {}
    return [
      { id: "today", name: "Today" },
      { id: "later", name: "Later" }
    ];
  }

  function saveToggleSections(sections) {
    localStorage.setItem(
      TOGGLE_SEC, JSON.stringify(sections)
    );
  }

  // Get array ref by list key
  function getList(data, listKey) {
    if (listKey === "simple") return data.simple;
    if (listKey.startsWith("toggle-")) {
      const secId = listKey.slice(7);
      if (!data.toggleData[secId]) {
        data.toggleData[secId] = [];
      }
      return data.toggleData[secId];
    }
    if (!data.weekly[listKey]) {
      data.weekly[listKey] = [];
    }
    return data.weekly[listKey];
  }

  // Set array by list key
  function setList(data, listKey, arr) {
    if (listKey === "simple") {
      data.simple = arr;
    } else if (listKey.startsWith("toggle-")) {
      const secId = listKey.slice(7);
      if (!data.toggleData) data.toggleData = {};
      data.toggleData[secId] = arr;
    } else {
      data.weekly[listKey] = arr;
    }
  }

  // ---- Dates ----

  function getMonday(offset) {
    const d = new Date();
    const day = d.getDay();
    const diff = d.getDate() - day
      + (day === 0 ? -6 : 1);
    const mon = new Date(
      d.setDate(diff + (offset * 7))
    );
    mon.setHours(0, 0, 0, 0);
    return mon;
  }

  function dateKey(d) {
    return d.toISOString().slice(0, 10);
  }

  function isPast(d) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const c = new Date(d);
    c.setHours(0, 0, 0, 0);
    return c < today;
  }

  function isToday(d) {
    const t = new Date();
    return d.getDate() === t.getDate()
      && d.getMonth() === t.getMonth()
      && d.getFullYear() === t.getFullYear();
  }

  function fmtMonth(d) {
    return d.toLocaleDateString("en-AU", {
      month: "short", year: "numeric"
    });
  }

  const DAY_NAMES = [
    "Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"
  ];
  const MONTH_NAMES = [
    "January", "February", "March", "April",
    "May", "June", "July", "August",
    "September", "October", "November", "December"
  ];

  // ---- Drag and drop ----

  let dragData = null; // { listKey, index }

  function handleDragStart(e, listKey, index) {
    dragData = { listKey, index };
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", "");
    e.target.closest(".task")
      .classList.add("dragging");
  }

  function handleDragEnd(e) {
    dragData = null;
    document.querySelectorAll(".dragging")
      .forEach(el => el.classList.remove("dragging"));
    document.querySelectorAll(
      ".drag-over-above, .drag-over-below"
    ).forEach(el => {
      el.classList.remove(
        "drag-over-above", "drag-over-below"
      );
    });
    document.querySelectorAll(".drag-active")
      .forEach(el =>
        el.classList.remove("drag-active")
      );
  }

  function handleDragOver(e, taskEl) {
    if (!dragData) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";

    // Clear previous indicators in this zone
    const zone = taskEl.closest(".drop-zone");
    if (zone) {
      zone.querySelectorAll(
        ".drag-over-above, .drag-over-below"
      ).forEach(el => {
        el.classList.remove(
          "drag-over-above", "drag-over-below"
        );
      });
    }

    const rect = taskEl.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    if (e.clientY < mid) {
      taskEl.classList.add("drag-over-above");
    } else {
      taskEl.classList.add("drag-over-below");
    }
  }

  function handleZoneDragOver(e) {
    if (!dragData) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    e.currentTarget.classList.add("drag-active");
  }

  function handleZoneDragLeave(e) {
    e.currentTarget.classList.remove("drag-active");
  }

  function handleDrop(e, targetListKey, targetIndex) {
    e.preventDefault();
    if (!dragData) return;

    const data = loadData();
    const srcList = getList(data, dragData.listKey);
    const srcIdx = dragData.index;

    // Don't move empty placeholder tasks
    if (!srcList[srcIdx]
      || srcList[srcIdx].text === "") {
      handleDragEnd(e);
      return;
    }

    const task = srcList.splice(srcIdx, 1)[0];
    const destList = getList(data, targetListKey);

    // Adjust target index if same list
    let insertAt = targetIndex;
    if (targetListKey === dragData.listKey
      && srcIdx < targetIndex) {
      insertAt--;
    }

    // Clamp
    if (insertAt < 0) insertAt = 0;
    if (insertAt > destList.length) {
      insertAt = destList.length;
    }

    destList.splice(insertAt, 0, task);

    setList(data, dragData.listKey, srcList);
    setList(data, targetListKey, destList);
    saveData(data);

    handleDragEnd(e);
    renderCurrentView();
  }

  function handleZoneDrop(e, listKey) {
    e.preventDefault();
    if (!dragData) return;

    const data = loadData();
    const srcList = getList(data, dragData.listKey);
    const srcIdx = dragData.index;

    if (!srcList[srcIdx]
      || srcList[srcIdx].text === "") {
      handleDragEnd(e);
      return;
    }

    const task = srcList.splice(srcIdx, 1)[0];
    const destList = getList(data, listKey);

    // Insert before last empty placeholder
    const insertAt = destList.length > 0
      && destList[destList.length - 1].text === ""
      ? destList.length - 1
      : destList.length;
    destList.splice(insertAt, 0, task);

    setList(data, dragData.listKey, srcList);
    setList(data, listKey, destList);
    saveData(data);

    handleDragEnd(e);
    renderCurrentView();
  }

  // ---- Date highlighting ----

  const DATE_PATTERN = new RegExp(
    '@('
    // Relative: @today, @tomorrow, @yesterday
    + 'today|tomorrow|yesterday'
    // Day names: @monday, @next tuesday
    + '|(?:next\\s+)?(?:mon(?:day)?|tue(?:sday)?'
    + '|wed(?:nesday)?|thu(?:rsday)?'
    + '|fri(?:day)?|sat(?:urday)?|sun(?:day)?)'
    // Month DD, YYYY or Month DD
    + '|(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?'
    + '|apr(?:il)?|may|jun(?:e)?|jul(?:y)?'
    + '|aug(?:ust)?|sep(?:tember)?|oct(?:ober)?'
    + '|nov(?:ember)?|dec(?:ember)?)'
    + '\\s+\\d{1,2}(?:,?\\s*\\d{4})?'
    // DD/MM/YYYY or DD-MM-YYYY
    + '|\\d{1,2}[\\/\\-]\\d{1,2}[\\/\\-]\\d{2,4}'
    + ')',
    'gi'
  );

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function highlightDates(text) {
    if (!text) return "";
    let result = "";
    let lastIdx = 0;
    let match;
    DATE_PATTERN.lastIndex = 0;
    while ((match = DATE_PATTERN.exec(text))) {
      result += escapeHtml(
        text.slice(lastIdx, match.index)
      );
      result += '<span class="date-token">'
        + escapeHtml(match[0]) + '</span>';
      lastIdx = match.index + match[0].length;
    }
    result += escapeHtml(text.slice(lastIdx));
    return result;
  }

  // ---- Task element ----

  function createTaskEl(
    task, onUpdate, onDelete, opts
  ) {
    opts = opts || {};
    const div = document.createElement("div");
    const indent = task.indent || 0;
    div.className = "task"
      + (task.done ? " done" : "")
      + (indent > 0 ? " indent-" + indent : "");

    // Drag from checkbox for non-empty tasks
    if (task.text !== "" && opts.listKey) {
      div.addEventListener("dragend", handleDragEnd);
      div.addEventListener("dragover", e =>
        handleDragOver(e, div)
      );
      div.addEventListener("drop", e => {
        const rect = div.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        const dropIdx = e.clientY < mid
          ? opts.index : opts.index + 1;
        handleDrop(e, opts.listKey, dropIdx);
      });
    }

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = task.done;

    if (task.text !== "" && opts.listKey) {
      cb.draggable = true;
      cb.style.cursor = "grab";
      cb.addEventListener("dragstart", e => {
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", "");
        e.dataTransfer.setDragImage(div, 20, 12);
        dragData = {
          listKey: opts.listKey,
          index: opts.index
        };
        div.classList.add("dragging");
      });
    }

    cb.addEventListener("change", () => {
      task.done = cb.checked;
      div.classList.toggle("done", task.done);
      onUpdate();
    });

    const txt = document.createElement("textarea");
    txt.className = "task-input";
    txt.rows = 1;
    txt.value = task.text;
    if (!opts.noPlaceholder) {
      txt.placeholder = "New task...";
    }
    txt.addEventListener("keydown", e => {
      if (e.key === "Tab") {
        e.preventDefault();
        if (e.shiftKey) {
          // Outdent
          task.indent = Math.max(
            0, (task.indent || 0) - 1
          );
        } else {
          // Indent (max 3 levels)
          task.indent = Math.min(
            3, (task.indent || 0) + 1
          );
        }
        onUpdate();
        renderCurrentView();
        // Refocus same task after re-render
        setTimeout(() => {
          let container = null;
          const cid = div.parentElement
            ? div.parentElement.id
              || div.parentElement.dataset.list
            : null;
          if (cid) {
            container =
              document.getElementById(cid)
              || document.querySelector(
                '[data-list="' + cid + '"]'
              );
          }
          if (container && opts.index !== undefined) {
            const inputs = container.querySelectorAll(
              ".task textarea.task-input"
            );
            if (inputs[opts.index]) {
              inputs[opts.index].focus();
            }
          }
        }, 10);
        return;
      }
      if (e.key === "Enter") {
        e.preventDefault();
        const containerId =
          div.parentElement
            ? div.parentElement.id
              || div.parentElement.dataset.list
            : null;
        onUpdate();
        renderCurrentView();
        setTimeout(() => {
          // Find the container after re-render
          let container = null;
          if (containerId) {
            container =
              document.getElementById(containerId)
              || document.querySelector(
                '[data-list="' + containerId + '"]'
              );
          }
          if (!container) {
            container = document.querySelector(
              '#content .drop-zone:not(.hidden)'
            );
          }
          if (container) {
            const inputs = container.querySelectorAll(
              ".task textarea.task-input"
            );
            if (inputs.length) {
              inputs[inputs.length - 1].focus();
            }
          }
        }, 10);
      }
      if (e.key === "Backspace"
        && txt.value === ""
        && task.text === "") {
        e.preventDefault();
        onDelete(task);
      }
    });

    const del = document.createElement("button");
    del.className = "delete-btn";
    del.textContent = "\u00d7";
    del.addEventListener("click",
      () => onDelete(task));

    // Text wrapper with highlight overlay
    const wrap = document.createElement("div");
    wrap.className = "task-text-wrap";

    const highlight = document.createElement("div");
    highlight.className = "task-highlight";

    function syncHighlight() {
      highlight.innerHTML = highlightDates(txt.value);
      const cs = getComputedStyle(txt);
      highlight.style.font = cs.font;
      highlight.style.padding = cs.padding;
      highlight.style.lineHeight = cs.lineHeight;
    }

    function autoResize() {
      txt.style.height = "auto";
      txt.style.height = txt.scrollHeight + "px";
    }

    txt.addEventListener("input", () => {
      task.text = txt.value;
      autoResize();
      syncHighlight();
      onUpdate();
    });

    wrap.appendChild(highlight);
    wrap.appendChild(txt);
    // Initial sync after DOM attach
    setTimeout(() => {
      autoResize();
      syncHighlight();
    }, 0);

    div.appendChild(cb);
    div.appendChild(wrap);
    div.appendChild(del);
    return div;
  }

  function ensureEmpty(arr) {
    if (!arr.length
      || arr[arr.length - 1].text !== "") {
      arr.push({ text: "", done: false, indent: 0 });
    }
  }

  function setupDropZone(el, listKey) {
    el.addEventListener("dragover",
      handleZoneDragOver);
    el.addEventListener("dragleave",
      handleZoneDragLeave);
    el.addEventListener("drop",
      e => handleZoneDrop(e, listKey));
  }

  function setupClickToAdd(
    clickEl, tasksEl, data, listKey, renderFn
  ) {
    clickEl.addEventListener("click", e => {
      if (e.target.closest(
        ".task, .delete-btn, button"
      )) return;
      const list = getList(data, listKey);
      if (list.length
        && list[list.length - 1].text === "") {
        const inputs = tasksEl.querySelectorAll(
          ".task textarea.task-input"
        );
        if (inputs.length) {
          inputs[inputs.length - 1].focus();
        }
        return;
      }
      list.push({
        text: "", done: false, indent: 0
      });
      setList(data, listKey, list);
      saveData(data);
      renderFn();
      setTimeout(() => {
        const inputs = tasksEl.querySelectorAll(
          ".task textarea.task-input"
        );
        if (inputs.length) {
          inputs[inputs.length - 1].focus();
        }
      }, 10);
    });
  }

  // ---- Simple ----

  function renderSimple() {
    const data = loadData();
    const el = document.getElementById("simple-tasks");
    el.innerHTML = "";
    ensureEmpty(data.simple);
    saveData(data);

    data.simple.forEach((task, i) => {
      el.appendChild(createTaskEl(
        task,
        () => saveData(data),
        t => {
          data.simple =
            data.simple.filter(x => x !== t);
          saveData(data);
          renderSimple();
        },
        { listKey: "simple", index: i }
      ));
    });

    setupDropZone(el, "simple");
  }

  // ---- Toggle ----

  function loadToggleState() {
    try {
      return JSON.parse(
        localStorage.getItem(TOGGLE_KEY)
      ) || {};
    } catch { return {}; }
  }

  function saveToggleState(st) {
    localStorage.setItem(
      TOGGLE_KEY, JSON.stringify(st)
    );
  }

  function renderToggle() {
    const data = loadData();
    const sections = loadToggleSections();
    const tState = loadToggleState();
    const el = document.getElementById("toggle-view");
    el.innerHTML = "";

    sections.forEach(sec => {
      const listKey = "toggle-" + sec.id;
      if (!data.toggleData[sec.id]) {
        data.toggleData[sec.id] = [];
      }
      ensureEmpty(data.toggleData[sec.id]);

      const sectionDiv = document.createElement("div");
      sectionDiv.className = "toggle-section";

      // Header
      const header = document.createElement("div");
      header.className = "toggle-header";

      const isOpen = tState[sec.id] !== false;

      const arrow = document.createElement("span");
      arrow.className = "toggle-arrow"
        + (isOpen ? "" : " collapsed");
      arrow.textContent = "\u25BC";
      arrow.addEventListener("click", e => {
        e.stopPropagation();
        const st = loadToggleState();
        st[sec.id] = !(st[sec.id] !== false);
        saveToggleState(st);
        renderToggle();
      });

      const nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.className = "toggle-name-input";
      nameInput.value = sec.name;
      nameInput.addEventListener("input", () => {
        sec.name = nameInput.value;
        saveToggleSections(sections);
      });
      nameInput.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          nameInput.blur();
        }
      });

      const delBtn = document.createElement("button");
      delBtn.className = "toggle-delete-btn";
      delBtn.textContent = "\u00d7";
      delBtn.addEventListener("click", e => {
        e.stopPropagation();
        if (sections.length <= 1) return;
        const newSections = sections.filter(
          s => s.id !== sec.id
        );
        saveToggleSections(newSections);
        delete data.toggleData[sec.id];
        saveData(data);
        renderToggle();
      });

      header.appendChild(arrow);
      header.appendChild(nameInput);
      if (sections.length > 1) {
        header.appendChild(delBtn);
      }

      // Tasks
      const tasksDiv = document.createElement("div");
      tasksDiv.className = "toggle-tasks drop-zone"
        + (isOpen ? "" : " collapsed");
      tasksDiv.dataset.list = listKey;
      tasksDiv.id = "toggle-" + sec.id;

      data.toggleData[sec.id].forEach((task, i) => {
        tasksDiv.appendChild(createTaskEl(
          task,
          () => saveData(data),
          t => {
            data.toggleData[sec.id] =
              data.toggleData[sec.id]
                .filter(x => x !== t);
            saveData(data);
            renderToggle();
          },
          { listKey, index: i }
        ));
      });

      setupDropZone(tasksDiv, listKey);

      sectionDiv.appendChild(header);
      sectionDiv.appendChild(tasksDiv);
      el.appendChild(sectionDiv);
    });

    // Add section button
    const addBtn = document.createElement("button");
    addBtn.className = "add-section-btn";
    addBtn.textContent = "+ Add section";
    addBtn.addEventListener("click", () => {
      const newId = "sec_" + Date.now();
      sections.push({
        id: newId, name: "New section"
      });
      saveToggleSections(sections);
      data.toggleData[newId] = [];
      saveData(data);
      renderToggle();
      // Focus the new section's name input
      setTimeout(() => {
        const inputs = el.querySelectorAll(
          ".toggle-name-input"
        );
        if (inputs.length) {
          const last = inputs[inputs.length - 1];
          last.focus();
          last.select();
        }
      }, 10);
    });
    el.appendChild(addBtn);

    saveData(data);
  }

  // ---- Week ----

  function renderWeekly() {
    const data = loadData();
    const el = document.getElementById("weekly-view");
    el.innerHTML = "";

    const monday = getMonday(weekOffset);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);

    navLabel.textContent =
      fmtMonth(monday) === fmtMonth(sunday)
        ? fmtMonth(monday)
        : fmtMonth(monday) + " \u2013 "
          + fmtMonth(sunday);

    for (let i = 0; i < 7; i++) {
      const date = new Date(monday);
      date.setDate(monday.getDate() + i);
      const key = dateKey(date);
      if (!data.weekly[key]) data.weekly[key] = [];

      let cls = "day-col";
      if (isToday(date))     cls += " today";
      else if (isPast(date)) cls += " past";

      const col = document.createElement("div");
      col.className = cls;

      const header = document.createElement("div");
      header.className = "day-header";
      header.innerHTML =
        '<div class="day-name">'
        + DAY_NAMES[i] + '</div>'
        + '<div class="day-date">'
        + date.getDate() + '</div>';

      const tasks = document.createElement("div");
      tasks.className = "day-tasks drop-zone";
      tasks.dataset.list = key;

      // Only render tasks with content
      data.weekly[key].filter(
        t => t.text !== ""
      ).forEach((task, ti) => {
        tasks.appendChild(createTaskEl(
          task,
          () => saveData(data),
          t => {
            data.weekly[key] =
              data.weekly[key].filter(x => x !== t);
            saveData(data);
            renderWeekly();
          },
          { noPlaceholder: true,
            listKey: key, index: ti }
        ));
      });

      setupDropZone(tasks, key);

      col.appendChild(header);
      col.appendChild(tasks);
      setupClickToAdd(
        col, tasks, data, key, renderWeekly
      );
      el.appendChild(col);
    }

    // Later
    const lk = "_later";
    if (!data.weekly[lk]) data.weekly[lk] = [];

    const laterCol = document.createElement("div");
    laterCol.className = "day-col";

    const laterH = document.createElement("div");
    laterH.className = "day-header";
    laterH.innerHTML =
      '<div class="day-name">Later</div>';

    const laterT = document.createElement("div");
    laterT.className = "day-tasks drop-zone";
    laterT.dataset.list = lk;

    data.weekly[lk].filter(
      t => t.text !== ""
    ).forEach((task, ti) => {
      laterT.appendChild(createTaskEl(
        task,
        () => saveData(data),
        t => {
          data.weekly[lk] =
            data.weekly[lk].filter(x => x !== t);
          saveData(data);
          renderWeekly();
        },
        { noPlaceholder: true,
          listKey: lk, index: ti }
      ));
    });

    setupDropZone(laterT, lk);

    laterCol.appendChild(laterH);
    laterCol.appendChild(laterT);
    setupClickToAdd(
      laterCol, laterT, data, lk, renderWeekly
    );
    el.appendChild(laterCol);

    saveData(data);
  }

  // ---- Month ----

  function getMonthStart(offset) {
    const d = new Date();
    return new Date(
      d.getFullYear(), d.getMonth() + offset, 1
    );
  }

  function renderMonth() {
    const data = loadData();
    const el = document.getElementById("month-view");
    el.innerHTML = "";

    const first = getMonthStart(monthOffset);
    navLabel.textContent = first.toLocaleDateString(
      "en-AU", { month: "long", year: "numeric" }
    );

    // Calculate number of week rows first
    const startDay = first.getDay();
    const startOff = startDay === 0
      ? -6 : 1 - startDay;
    const gridStart = new Date(first);
    gridStart.setDate(first.getDate() + startOff);
    const thisMonth = first.getMonth();

    let totalDays = 0;
    for (let i = 0; i < 42; i++) {
      const d = new Date(gridStart);
      d.setDate(gridStart.getDate() + i);
      const inM = d.getMonth() === thisMonth;
      if (!inM && i >= 35) break;
      if (!inM && i > 7 && d.getDay() === 1) break;
      totalDays++;
    }
    const weekRows = Math.ceil(totalDays / 7);
    el.style.gridTemplateRows =
      "auto " + ("1fr ".repeat(weekRows)).trim();

    // Day name headers
    DAY_NAMES.forEach(name => {
      const hdr = document.createElement("div");
      hdr.className = "day-col";
      hdr.style.borderBottom = "none";
      hdr.innerHTML =
        '<div class="day-header"'
        + ' style="border-bottom:none">'
        + '<div class="day-name">'
        + name + '</div></div>';
      el.appendChild(hdr);
    });

    // Day cells
    for (let i = 0; i < totalDays; i++) {
      const date = new Date(gridStart);
      date.setDate(gridStart.getDate() + i);
      const key = dateKey(date);
      const inMonth = date.getMonth() === thisMonth;

      if (!data.weekly[key]) data.weekly[key] = [];

      let cls = "day-col";
      if (!inMonth)            cls += " other-month";
      else if (isToday(date))  cls += " today";
      else if (isPast(date))   cls += " past";

      const col = document.createElement("div");
      col.className = cls;

      const header = document.createElement("div");
      header.className = "day-header";
      header.innerHTML =
        '<div class="day-date"'
        + ' style="font-size:14px;">'
        + date.getDate() + '</div>';

      const tasks = document.createElement("div");
      tasks.className = "day-tasks drop-zone";
      tasks.dataset.list = key;

      data.weekly[key].filter(
        t => t.text !== ""
      ).forEach((task, ti) => {
        tasks.appendChild(createTaskEl(
          task,
          () => saveData(data),
          t => {
            data.weekly[key] =
              data.weekly[key].filter(x => x !== t);
            saveData(data);
            renderMonth();
          },
          { noPlaceholder: true,
            listKey: key, index: ti }
        ));
      });

      setupDropZone(tasks, key);

      col.appendChild(header);
      col.appendChild(tasks);
      setupClickToAdd(
        col, tasks, data, key, renderMonth
      );
      el.appendChild(col);
    }

    saveData(data);
  }

  // ---- Year ----

  function renderYear() {
    const data = loadData();
    const el = document.getElementById("year-view");
    el.innerHTML = "";

    const now = new Date();
    const yr = now.getFullYear() + yearOffset;
    navLabel.textContent = String(yr);

    const currentMonth = now.getMonth();
    const currentYear = now.getFullYear();

    for (let m = 0; m < 12; m++) {
      const listKey = "_ym-" + yr + "-"
        + String(m).padStart(2, "0");
      if (!data.weekly[listKey]) {
        data.weekly[listKey] = [];
      }

      const card = document.createElement("div");
      let cls = "year-month-card";
      if (yr === currentYear && m === currentMonth) {
        cls += " current-month";
      } else if (
        yr < currentYear
        || (yr === currentYear && m < currentMonth)
      ) {
        cls += " past-month";
      }
      card.className = cls;

      const title = document.createElement("div");
      title.className = "year-month-title";
      title.textContent = MONTH_NAMES[m];
      card.appendChild(title);

      const tasks = document.createElement("div");
      tasks.className =
        "year-month-tasks drop-zone";
      tasks.dataset.list = listKey;

      data.weekly[listKey].filter(
        t => t.text !== ""
      ).forEach((task, ti) => {
        tasks.appendChild(createTaskEl(
          task,
          () => saveData(data),
          t => {
            data.weekly[listKey] =
              data.weekly[listKey]
                .filter(x => x !== t);
            saveData(data);
            renderYear();
          },
          { noPlaceholder: true,
            listKey: listKey, index: ti }
        ));
      });

      setupDropZone(tasks, listKey);

      card.appendChild(tasks);
      setupClickToAdd(
        card, tasks, data, listKey, renderYear
      );
      el.appendChild(card);
    }

    saveData(data);
  }

  // ---- Views ----

  let currentView = "weekly";

  const views = {
    simple: document.getElementById("simple-view"),
    toggle: document.getElementById("toggle-view"),
    weekly: document.getElementById("weekly-view"),
    month:  document.getElementById("month-view"),
    year:   document.getElementById("year-view")
  };

  function renderCurrentView() {
    Object.values(views).forEach(
      v => v.classList.add("hidden")
    );
    const hasNav = ["weekly", "month", "year"]
      .includes(currentView);
    navCtrl.classList.toggle("hidden", !hasNav);
    views[currentView].classList.remove("hidden");

    if (currentView === "simple")  renderSimple();
    if (currentView === "toggle")  renderToggle();
    if (currentView === "weekly")  renderWeekly();
    if (currentView === "month")   renderMonth();
    if (currentView === "year")    renderYear();
  }

  // ---- Theme / Size ----

  let currentTheme = "t-dark";
  function applyTheme(theme) {
    app.classList.remove(currentTheme);
    currentTheme = theme;
    app.classList.add(currentTheme);
    localStorage.setItem(THEME_KEY, currentTheme);
  }

  let currentSize = "size-m";
  function applySize(size) {
    app.classList.remove(currentSize);
    currentSize = size;
    app.classList.add(currentSize);
    localStorage.setItem(SIZE_KEY, currentSize);
  }

  // ---- Nav ----

  document.getElementById("prev-nav")
    .addEventListener("click", () => {
      if (currentView === "weekly") {
        weekOffset--;
        localStorage.setItem(WEEK_KEY, weekOffset);
        renderWeekly();
      } else if (currentView === "month") {
        monthOffset--;
        localStorage.setItem(MONTH_KEY, monthOffset);
        renderMonth();
      } else if (currentView === "year") {
        yearOffset--;
        localStorage.setItem(YEAR_KEY, yearOffset);
        renderYear();
      }
    });

  document.getElementById("next-nav")
    .addEventListener("click", () => {
      if (currentView === "weekly") {
        weekOffset++;
        localStorage.setItem(WEEK_KEY, weekOffset);
        renderWeekly();
      } else if (currentView === "month") {
        monthOffset++;
        localStorage.setItem(MONTH_KEY, monthOffset);
        renderMonth();
      } else if (currentView === "year") {
        yearOffset++;
        localStorage.setItem(YEAR_KEY, yearOffset);
        renderYear();
      }
    });

  document.getElementById("today-btn")
    .addEventListener("click", () => {
      if (currentView === "weekly") {
        weekOffset = 0;
        localStorage.setItem(WEEK_KEY, weekOffset);
        renderWeekly();
      } else if (currentView === "month") {
        monthOffset = 0;
        localStorage.setItem(MONTH_KEY, monthOffset);
        renderMonth();
      } else if (currentView === "year") {
        yearOffset = 0;
        localStorage.setItem(YEAR_KEY, yearOffset);
        renderYear();
      }
    });

  // ---- Init ----

  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme === "t-light"
    || savedTheme === "t-dark") {
    applyTheme(savedTheme);
    setDropdownActive("dd-theme", savedTheme);
  }

  const savedSize = localStorage.getItem(SIZE_KEY);
  if (["size-s", "size-m", "size-l"]
    .includes(savedSize)) {
    applySize(savedSize);
    setDropdownActive("dd-size", savedSize);
  }

  const savedView = localStorage.getItem(VIEW_KEY);
  if (["simple","toggle","weekly","month","year"]
    .includes(savedView)) {
    currentView = savedView;
    setDropdownActive("dd-style", savedView);
  }

  const savedWeek = localStorage.getItem(WEEK_KEY);
  if (savedWeek !== null) {
    weekOffset = parseInt(savedWeek);
  }
  const savedMonth = localStorage.getItem(MONTH_KEY);
  if (savedMonth !== null) {
    monthOffset = parseInt(savedMonth);
  }
  const savedYear = localStorage.getItem(YEAR_KEY);
  if (savedYear !== null) {
    yearOffset = parseInt(savedYear);
  }

  renderCurrentView();

  // Sync to-dos and sections via Google Drive
  ToolSync.init({
    file:     "to-dos.json",
    keys:     [STORAGE_KEY, TOGGLE_SEC],
    onRemote: () => renderCurrentView()
  });
</script>
</body>
</html>
