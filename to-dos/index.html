<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>to dos · toolkit</title>
<style>
  /* Pages cross-fade into each other where the browser allows */
  @view-transition { navigation: auto; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Buttons use the page font, not the browser default */
  button { font-family: inherit; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: 'Segoe UI',
      -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 400;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: background 0.15s, color 0.15s;
  }

  .t-dark {
    --bg:         #011627;
    --bg-surface: #01111f;
    --fg:         #d6deeb;
    --fg-muted:   #6c7a89;
    --border:     #1e3a52;
    --accent:     #7fdbca;
    --done:       #2f5d69;
    --scroll-thumb: #1e3a52;
    --head-tint:  rgba(1, 22, 39, 0.5);
    --hover:      #012a3f;
    --sel-bg:     #012a3f;
    --sel-bdr:    #1e3a52;
    --sel-fg:     #d6deeb;
    --today-bg:   #134957;
    --past-bg:    rgba(19, 85, 92, 0.25);
    --drag-bg:    rgba(127, 219, 202, 0.08);
    --future-head: #0b2133;
    --shadow:     0 2px 10px rgba(0, 0, 0, 0.45);
  }
  .t-light {
    --bg:         #ecf2f2;
    --bg-surface: #dce7e8;
    --fg:         #24292e;
    --fg-muted:   #6a737d;
    --border:     #a3c4c6;
    --accent:     #0c9e9a;
    --done:       #2f5d69;
    --scroll-thumb: #bccfd2;
    --head-tint:  rgba(236, 242, 242, 0.5);
    --hover:      #d9e8ea;
    --sel-bg:     #f6fafa;
    --sel-bdr:    #bccfd2;
    --sel-fg:     #24292e;
    --today-bg:   #cce4e1;
    --past-bg:    #dce7e8;
    --drag-bg:    rgba(12, 158, 154, 0.1);
    --future-head: #f6fafa;
    --shadow:     0 2px 8px rgba(36, 70, 75, 0.14);
  }

  /* ---- Toolbar ---- */
  /* Left link, centred calendar controls, right dropdowns.
     The toolbar keeps the dark palette in both modes. */
  #toolbar {
    --accent:     #7fdbca;
    --bg-surface: #01111f;
    --border:     #1e3a52;
    --fg:         #d6deeb;
    --fg-muted:   #6c7a89;
    --hover:      #012a3f;
    --sel-bdr:    #1e3a52;
    --sel-bg:     #012a3f;
    --sel-fg:     #d6deeb;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #home-link {
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--fg-muted);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 17px;
    font-weight: 600;
    grid-column: 1;
    justify-self: start;
    padding: 3px 10px;
    text-decoration: none;
  }
  #home-link:hover {
    background: var(--hover);
    color: var(--fg);
  }
  #nav-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    grid-column: 2;
  }
  #dropdown-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    grid-column: 3;
    justify-self: end;
  }
  #toolbar button {
    background: none;
    border: 1px solid var(--border);
    color: var(--fg-muted);
    cursor: pointer;
    font-size: 15px;
    padding: 3px 10px;
    border-radius: 4px;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #toolbar button:hover {
    background: var(--hover);
    color: var(--fg);
  }
  #nav-label {
    font-size: 15px;
    color: var(--fg);
    font-weight: 600;
    min-width: 180px;
    text-align: center;
  }

  /* Lowercase headings, toggles and dropdowns */
  #toolbar, #toolbar button, .section-heading, .toggle-name-input,
  .add-section-btn, .day-name, .year-month-title {
    text-transform: lowercase;
  }

  /* ---- Custom dropdown ---- */
  .dropdown { position: relative; display: inline-block; }
  .dropdown-btn {
    background: var(--sel-bg);
    border: 1px solid var(--sel-bdr);
    color: var(--sel-fg);
    font-size: 16px;
    padding: 4px 22px 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    /* Semibold for headings only, not menu options */
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 600;
    white-space: nowrap;
    position: relative;
  }
  .dropdown-btn::after {
    content: '';
    position: absolute;
    right: 7px; top: 50%;
    transform: translateY(-50%);
    border-left: 3.5px solid transparent;
    border-right: 3.5px solid transparent;
    border-top: 4px solid var(--fg-muted);
  }
  .dropdown-menu {
    display: none;
    position: absolute;
    top: calc(100% + 2px);
    right: 0;
    background: var(--sel-bg);
    border: 1px solid var(--sel-bdr);
    border-radius: 4px;
    padding: 4px 0;
    z-index: 100;
    min-width: 100%;
    font-size: 16px;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .dropdown.open .dropdown-menu { display: block; }
  .dropdown-item {
    padding: 5px 12px;
    cursor: pointer;
    color: var(--sel-fg);
    white-space: nowrap;
  }
  .dropdown-item:hover { background: var(--hover); }
  .dropdown-item.active { color: var(--accent); }

  /* ---- Content ---- */
  #content {
    flex: 1;
    overflow-y: auto;
    background: var(--bg);
  }
  textarea.task-input {
    background: transparent;
    border: none;
    color: var(--fg);
    font: inherit;
    outline: none;
    width: 100%;
    resize: none;
    overflow: hidden;
    padding: 0;
    margin: 0;
    line-height: 1.4;
    min-height: 1.4em;
    field-sizing: content;
  }
  textarea.task-input::placeholder {
    color: var(--fg-muted);
    opacity: 0.6;
  }

  .task-text-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
  }
  .task-text-wrap textarea.task-input {
    position: relative;
    z-index: 1;
    color: transparent;
    caret-color: var(--fg);
  }
  .task-highlight {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    pointer-events: none;
    white-space: pre-wrap;
    word-break: break-word;
    overflow: hidden;
    color: var(--fg);
    z-index: 0;
    line-height: 1.4;
  }
  /* Checked items in a slightly darker highlight colour */
  .task.done .task-highlight,
  .task.done .task-highlight span {
    text-decoration: line-through;
    color: var(--done);
  }
  .task-highlight .date-token,
  .task-highlight .mention-token {
    color: var(--accent);
  }
  .task-highlight .tag-token {
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border-radius: 3px;
    color: var(--accent);
  }

  /* Overdue tasks: only the date, in the completed colour */
  .task.overdue .task-highlight .date-token { color: var(--done); }

  /* Tags echoed at the right of a task, each with a tinted background */
  .task-tags {
    display: flex;
    flex-shrink: 0;
    font-size: 0.8em;
    gap: 4px;
    line-height: 1.75;
    white-space: nowrap;
  }
  .task-tags:empty { display: none; }
  .tag-chip {
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border-radius: 3px;
    color: var(--accent);
    padding: 0 4px;
  }
  .task.done .tag-chip { color: var(--done); }

  /* Calendar cells are narrow, so tags stay inline only */
  .day-tasks .task-tags,
  .year-month-tasks .task-tags {
    display: none;
  }

  /* Task text size for each size option */
  .size-s { --task-fs: 16px; }
  .size-m { --task-fs: 18px; }
  .size-l { --task-fs: 21px; }
  .size-s .day-tasks { --task-fs: 15px; }
  .size-m .day-tasks { --task-fs: 17px; }
  .size-l .day-tasks { --task-fs: 19px; }

  /* ---- Task ---- */
  .task {
    display: flex;
    align-items: flex-start;
    font-size: var(--task-fs, 18px);
    gap: 6px;
    padding: 6px 0;
    transition: opacity 0.15s;
  }
  .task.indent-1 { padding-left: 24px; --indent: 24px; }
  .task.indent-2 { padding-left: 48px; --indent: 48px; }
  .task.indent-3 { padding-left: 72px; --indent: 72px; }

  /* Six-dot drag handle, shown left of the checkbox on hover */
  .task { position: relative; }
  .drag-handle {
    align-items: center;
    color: var(--fg-muted);
    cursor: grab;
    display: flex;
    height: 16px;
    justify-content: center;
    left: calc(var(--indent, 0px) - 16px);
    opacity: 0;
    position: absolute;
    top: calc(6px + (var(--task-fs, 18px) * 1.4 - 16px) / 2);
    transition: opacity 0.15s;
    width: 12px;
    z-index: 3;
  }
  .drag-handle svg { fill: currentColor; }
  .task:hover .drag-handle { opacity: 0.6; }
  .task .drag-handle:hover { opacity: 1; }
  .day-tasks .drag-handle,
  .year-month-tasks .drag-handle {
    left: calc(var(--indent, 0px) - 7.5px);
    width: 7px;
  }
  #month-view .day-tasks .drag-handle {
    left: calc(var(--indent, 0px) - 6px);
    width: 6px;
  }
  #month-view .day-tasks .drag-handle,
  .year-month-tasks .drag-handle {
    height: 14px;
    top: calc(3px + (var(--task-fs, 18px) * 1.4 - 14px) / 2);
  }
  .task.dragging { opacity: 0.3; }

  /* Tasks picked with Ctrl+click, Shift+click or Ctrl+A */
  .task.selected {
    background: var(--drag-bg);
    border-radius: 4px;
    box-shadow: inset 2px 0 0 var(--accent);
  }
  /* The drop line starts at the depth the task will take */
  .task.drag-over-above::before,
  .task.drag-over-below::after {
    background: var(--accent);
    border-radius: 1px;
    content: '';
    height: 2px;
    left: var(--drop-left, 0px);
    position: absolute;
    right: 0;
    transition: left 0.1s ease;
  }
  .task.drag-over-above::before { top: -1px; }
  .task.drag-over-below::after { bottom: -1px; }

  .task input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 16px; height: 16px; min-width: 16px;
    border: 2px solid var(--accent);
    border-radius: 3px;
    cursor: pointer;
    /* Centre the box on the first line of text */
    margin-top: calc((var(--task-fs, 18px) * 1.4 - 16px) / 2);
    position: relative;
    background: transparent;
    flex-shrink: 0;
  }
  .task input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .task input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 3px; top: 0;
    width: 4px; height: 8px;
    border: solid var(--bg);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .task.done textarea.task-input {
    color: transparent;
  }
  .task .delete-btn {
    background: none; border: none;
    color: var(--fg-muted);
    cursor: pointer; font-size: 18px;
    padding: 0 4px; opacity: 0;
    transition: opacity 0.15s;
    margin-top: 1px; flex-shrink: 0;
  }
  .task:hover .delete-btn { opacity: 0.6; }
  .task .delete-btn:hover { opacity: 1; }

  /* Focus: a target that shows on hover or while editing */
  .task .focus-btn {
    align-items: center;
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    display: flex;
    flex-shrink: 0;
    height: calc(var(--task-fs, 18px) * 1.4);
    opacity: 0;
    padding: 0 2px;
    transition: opacity 0.15s;
  }
  .task .focus-btn svg { height: 17px; width: 17px; }
  .task:hover .focus-btn, .task:focus-within .focus-btn { opacity: 0.6; }
  .task .focus-btn:hover, .task .focus-btn:focus-visible { opacity: 1; }
  /* In calendar cells it floats over the text rather than taking room */
  .day-tasks .task .focus-btn {
    background: var(--bg);
    border-radius: 4px;
    position: absolute;
    right: 22px;
    top: 4px;
  }
  .year-month-tasks .task .focus-btn { display: none; }

  /* Drop zone highlight */
  .drop-zone.drag-active {
    background: var(--drag-bg);
    min-height: 40px;
  }

  /* ---- Simple ---- */
  #simple-view {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 24px;
  }
  .section-heading {
    font-size: 17px; font-weight: 600;
    color: var(--fg-muted);
    letter-spacing: 0.04em;
    margin-bottom: 16px;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* ---- Dates ---- */
  #dates-view {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 24px;
  }
  .toggle-section { margin-bottom: 32px; }
  .toggle-header {
    display: flex; align-items: center;
    gap: 8px;
    margin-bottom: 12px; user-select: none;
  }
  .toggle-arrow {
    font-size: 14px; color: var(--accent);
    transition: transform 0.2s ease;
    display: inline-block; width: 14px;
    cursor: pointer; flex-shrink: 0;
  }
  .toggle-arrow.collapsed {
    transform: rotate(-90deg);
  }

  /* A toggle with nothing in it has a dim arrow */
  .toggle-arrow.empty { opacity: 0.35; }
  /* Animate sections open and closed */
  .toggle-body {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows 0.25s ease, opacity 0.25s ease;
  }
  .toggle-body.collapsed {
    grid-template-rows: 0fr;
    opacity: 0;
  }

  /* Contents slide down into place as they appear */
  .toggle-body.collapsed > .toggle-tasks { transform: translateY(-8px); }
  .toggle-body > .toggle-tasks {
    min-height: 0;
    overflow: hidden;
    transition: transform 0.25s ease;

    /* Room on the left for the drag handle inside the clipped area */
    margin-left: -18px;
    padding-left: 18px;
  }
  .toggle-name-input {
    background: transparent;
    border: none;
    color: var(--accent);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.04em;
    font-family: 'Segoe UI',
      -apple-system, BlinkMacSystemFont, sans-serif;
    outline: none;
    flex: 1;
    min-width: 0;
    cursor: pointer;
  }
  .toggle-name-input:focus {
    cursor: text;
  }
  .toggle-delete-btn {
    background: none; border: none;
    color: var(--fg-muted);
    cursor: pointer; font-size: 18px;
    padding: 0 4px; opacity: 0;
    transition: opacity 0.15s;
  }
  .toggle-header:hover .toggle-delete-btn {
    opacity: 0.4;
  }
  .toggle-delete-btn:hover {
    opacity: 1 !important;
  }
  .add-section-btn {
    background: none;
    border: 1px dashed var(--border);
    color: var(--fg-muted);
    font-size: 16px;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Segoe UI',
      -apple-system, BlinkMacSystemFont, sans-serif;
    width: 100%;
    text-align: center;
    transition: border-color 0.15s, color 0.15s;
  }
  .add-section-btn:hover {
    border-color: var(--fg-muted);
    color: var(--fg);
  }

  /* ---- Done ---- */
  #done-view {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 24px;
  }
  .done-empty { color: var(--fg-muted); }

  /* Where a completed task came from */
  .task-source {
    color: var(--fg-muted);
    flex-shrink: 0;
    font-size: 0.8em;
    line-height: 1.75;
    text-transform: lowercase;
    white-space: nowrap;
  }

  /* To-dos from notes: read-only text with a link back to the note */
  .task .task-highlight.note-text { position: static; pointer-events: auto; }
  .note-link {
    color: var(--fg-muted);
    text-decoration: none;
  }
  .note-link:hover { color: var(--accent); }

  .toggle-count {
    color: var(--fg-muted);
    cursor: pointer;
    font-size: 12px;
    margin-right: auto;
    opacity: 0.75;
  }
  .hide-counts .toggle-count { visibility: hidden; }
  .add-row { display: flex; gap: 10px; margin-bottom: 32px; }
  .add-row .add-section-btn { margin-bottom: 0; }
  .add-row .counts-btn { flex-shrink: 0; width: auto; }
  .add-row .add-range-input { flex: 1; margin: 0; min-width: 0; }

  /* Simple: the prompt above the list */
  /* Smaller than the tasks, in the completed colour */
  .simple-prompt {
    align-items: center;
    border-bottom: 1px solid var(--border);
    color: var(--done);
    display: flex;
    font-size: calc(var(--task-fs, 18px) * 0.85);
    font-style: italic;
    font-weight: 400;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 10px;
  }
  .simple-prompt svg { flex-shrink: 0; height: 1.1em; width: 1.1em; }

  /* Week: lighter headings for days to come in light mode; in dark
     mode they match past days' headings. To schedule looks like a day
     to come */
  .day-col.future .day-header,
  .day-col.later-col .day-header { background: var(--future-head); }
  .t-dark .day-col.future .day-header,
  .t-dark .day-col.later-col .day-header {
    background: linear-gradient(var(--head-tint), var(--head-tint)),
      linear-gradient(var(--past-bg), var(--past-bg)), var(--bg);
  }
  .later-col .day-header {
    display: flex;
    flex-direction: column-reverse;
  }

  /* Month: a teal line, drawn over the grid, traces where each month
     meets the next, with rounded turns */
  #month-view { position: relative; }
  #month-lines {
    left: 0;
    overflow: visible;
    pointer-events: none;
    position: absolute;
    top: 0;
    z-index: 4;
  }
  #month-lines path {
    fill: none;
    stroke: var(--accent);
    stroke-linecap: round;
    stroke-width: 2;
  }

  /* Typing a new date or range for the dates view */
  .add-range-input {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    caret-color: var(--accent);
    color: var(--accent);
    font: inherit;
    font-size: 16px;
    outline: none;
    padding: 8px 16px;
    text-align: center;
    width: 100%;
  }
  .add-range-input.invalid { color: #e06c75; }
  .add-range-input::placeholder { color: var(--accent); opacity: 0.45; }
  .add-section-btn { margin-bottom: 32px; }

  /* Fixed title for the done toggle */
  .toggle-done { margin-top: 32px; }

  /* To schedule and done: headings in the completed-task colour */
  .toggle-muted .toggle-title,
  .toggle-muted .toggle-arrow,
  .toggle-muted .toggle-count,
  .toggle-done .toggle-title,
  .toggle-done .toggle-arrow,
  .toggle-done .toggle-count { color: var(--done); }

  /* Items sit in from their heading, level with its text */
  #dates-view .toggle-body > .toggle-tasks,
  #done-view .toggle-body > .toggle-tasks { padding-left: 40px; }

  /* Room below a section's to dos to click and add another */
  #dates-view .toggle-body > .toggle-tasks::after {
    content: '';
    display: block;
    height: 12px;
  }
  .toggle-title {
    color: var(--accent);
    cursor: pointer;
    flex: 0 1 auto;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: lowercase;
  }

  /* ---- Column grids ---- */
  /* Outlined, rounded calendar set apart from the toolbar */
  .col-view {
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: var(--shadow);
    display: grid;
    margin: 24px auto 60px;
    max-width: 1152px;
    min-height: calc(100% - 84px);
    overflow: clip;
    width: calc(100% - 48px);
  }
  /* Week: two rows, mon to thu above fri, sat, sun and to schedule.
     Each row is at least half the view and grows with its to dos */
  #weekly-view {
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: auto 1fr auto 1fr;
  }
  #weekly-view .day-col:nth-child(4) { border-right: none; }
  #weekly-view .day-col:nth-child(n+5) { border-top: 1px solid var(--border); }

  /* Week: day and date on one line, dim for past days, teal for today
     and full colour for days to come */
  #weekly-view .day-name { color: var(--fg); font-size: 16px; }
  #weekly-view .day-col.past .day-name { color: var(--fg-muted); }
  #weekly-view .day-col.today .day-name { color: var(--accent); }

  /* Today's header carries a small label */
  .today-tag {
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border-radius: 3px;
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    margin-left: 6px;
    padding: 1px 5px;
    vertical-align: 2px;
  }

  /* Headers in a row share one height, so a title that wraps still
     lines up with the dates beside it */
  #weekly-view .day-col {
    display: grid;
    grid-row: span 2;
    grid-template-rows: subgrid;
  }
  #weekly-view .day-col:not(.later-col) .day-header {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  #month-view {
    grid-template-columns: repeat(7, 1fr);
  }
  #month-view .day-col:nth-child(7n) { border-right: none; }

  /* Month scrolls through weeks; day names stay at the top */
  #month-view {
    grid-auto-rows: max-content;
    grid-template-rows: max-content;
  }

  /* Rows take their tallest cell's content; the minimum height sits on
     the cells. (In a grid taller than its scroll box, auto rows never
     grow past their minimum, so tasks used to spill out.) */
  #month-view .day-col {
    border-top: 1px solid var(--border);
    min-height: 120px;
  }
  #month-view .day-col.month-head { min-height: 0; }
  #month-view .month-head {
    background: var(--bg);
    border-top: none;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  #month-view .month-start .day-date { color: var(--accent); }
  .day-col {
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    min-width: 0;
    cursor: pointer;
  }
  .day-col:last-child { border-right: none; }
  .day-col.today { background: var(--today-bg); }
  .day-col.past  { background: var(--past-bg); }
  .day-header {
    padding: 12px 5px 8px 7.5px;
    border-bottom: 1px solid var(--border);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; flex-shrink: 0;
  }
  .day-name {
    font-size: 15px; font-weight: 600;
    color: var(--fg-muted);
    letter-spacing: 0.04em;
  }
  .day-date {
    font-size: 19px; font-weight: 600;
    color: var(--fg); margin-top: 2px;
  }
  .day-col.today .day-name { color: var(--accent); }
  .day-col.today .day-date { color: var(--accent); }
  .day-tasks {
    flex: 1; overflow-y: auto; padding: 8px 5px 8px 7.5px;
    cursor: pointer;
  }

  #month-view .day-header { padding: 8px 4px 6px 6px; }
  #month-view .day-date { font-size: 19px; }
  #month-view .day-tasks {
    padding: 4px 4px 4px 6px;
    min-height: 32px;
    overflow-y: visible;
  }
  #month-view .task { padding: 3px 0; gap: 4px; }
  #month-view .task input[type="checkbox"] {
    width: 14px; height: 14px; min-width: 14px;
    margin-top: calc((var(--task-fs, 18px) * 1.4 - 14px) / 2);
  }
  #month-view .task input[type="checkbox"]:checked::after {
    left: 3px; top: 0; width: 4px; height: 8px;
  }
  .day-col.other-month { opacity: 0.35; }

  /* ---- Year ---- */
  #year-view {
    max-width: 1200px; margin: 0 auto;
    padding: 24px 24px 60px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .year-month-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-height: 180px;
    max-height: 360px;
  }
  .year-month-card.past-month {
    background: var(--past-bg);
  }
  .year-month-card.current-month {
    background: var(--today-bg);
  }
  .year-month-title {
    font-size: 14px; font-weight: 600;
    color: var(--fg); padding: 8px 5px 8px 7.5px;
    border-bottom: 1px solid var(--border);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    flex-shrink: 0;
  }
  .year-month-card.current-month .year-month-title {
    color: var(--accent);
  }
  .year-month-tasks {
    flex: 1;
    overflow-y: auto;
    padding: 6px 5px 6px 7.5px;
    cursor: pointer;
  }
  .year-month-tasks .task { padding: 3px 0; gap: 6px; }
  .year-month-tasks .task input[type="checkbox"] {
    width: 14px; height: 14px; min-width: 14px;
    margin-top: calc((var(--task-fs, 18px) * 1.4 - 14px) / 2);
  }
  .year-month-tasks .task
    input[type="checkbox"]:checked::after {
    left: 2.5px; top: -0.5px; width: 3px; height: 7px;
  }

  /* Calendar cells: wrapped lines start under the checkbox */
  .day-tasks .task,
  .year-month-tasks .task {
    position: relative;
  }
  .day-tasks .task input[type="checkbox"],
  .year-month-tasks .task input[type="checkbox"] {
    position: absolute;
    z-index: 2;
  }
  .day-tasks textarea.task-input,
  .day-tasks .task-highlight {
    text-indent: 22px;
  }
  #month-view .day-tasks textarea.task-input,
  #month-view .day-tasks .task-highlight {
    text-indent: 18px;
  }
  .year-month-tasks textarea.task-input,
  .year-month-tasks .task-highlight {
    text-indent: 20px;
  }

  /* Brief colour fade while the mode changes */
  .theme-anim, .theme-anim * {
    transition: background-color 0.25s ease, border-color 0.25s ease,
      color 0.25s ease !important;
  }

  /* Brief text resize while the size changes */
  .size-anim .task { transition: font-size 0.2s ease; }
  .size-anim .task input[type="checkbox"] {
    transition: margin-top 0.2s ease;
  }

  /* Views fade and rise in slightly when you switch */
  @keyframes view-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  .view-in { animation: view-in 0.22s ease; }

  /* ---- Scrollbars in the mode's colours ---- */
  #app { scrollbar-color: var(--scroll-thumb) transparent; }
  #app ::-webkit-scrollbar { height: 10px; width: 10px; }
  #app ::-webkit-scrollbar-track { background: transparent; }
  #app ::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb);
    background-clip: content-box;
    border: 2px solid transparent;
    border-radius: 5px;
  }

  /* ---- Width options ----
     Every page shares the simple view's widths: 720px boxes with 24px
     either side (672px of content), wide halfway to full, and full.
     Boxes drawn without padding (the calendars) take off the 48px */
  .width-normal #simple-view,
  .width-normal #dates-view,
  .width-normal #done-view { max-width: 720px; }
  #simple-view, #dates-view, #done-view, .col-view, #year-view {
    transition: max-width 0.25s ease;
  }
  .width-wide #simple-view,
  .width-wide #dates-view,
  .width-wide #done-view { max-width: calc(50% + 360px); }
  .width-normal .col-view { max-width: 672px; }
  .width-wide .col-view { max-width: calc(50% + 312px); }
  .width-normal #year-view { max-width: 720px; }
  .width-wide #year-view { max-width: calc(50% + 360px); }
  .width-full #simple-view,
  .width-full #dates-view,
  .width-full #done-view,
  .width-full .col-view,
  .width-full #year-view { max-width: 100%; }


  /* Calendar headings sit halfway between their cell and the page
     colour, in both modes */
  .day-header,
  .year-month-title { background: var(--head-tint); }
  #month-view .month-head .day-header { background: none; }

  /* Pinned day names in today's colours */
  #month-view .month-head {
    background: linear-gradient(var(--head-tint), var(--head-tint)),
      linear-gradient(var(--today-bg), var(--today-bg)), var(--bg);
  }
  #month-view .month-head .day-name { color: var(--accent); font-size: 13px; }

  /* Month: its own scroll area, set below the toolbar, rounded */
  #month-view {
    height: calc(100% - 48px);
    margin: 24px auto;
    min-height: 0;
    overflow-y: auto;
  }

  /* Month and year cells grow to fit their tasks, keeping the same
     space below the last task as above the first */
  #month-view .day-tasks { flex: 1 0 auto; }
  .year-month-card { max-height: none; }
  .year-month-tasks {
    flex: 1 0 auto;
    overflow-y: visible;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app" class="t-dark size-m width-normal">
  <!-- Slim bar for the calendar views' arrows and today button -->
  <div id="toolbar" class="hidden">
    <div id="nav-controls" class="hidden">
      <button id="prev-nav">&larr;</button>
      <button id="today-btn">today</button>
      <span id="nav-label"></span>
      <button id="next-nav">&rarr;</button>
    </div>
  </div>

  <div id="content">
    <div id="simple-view" class="hidden">
      <div class="simple-prompt"><svg width="22" height="22"
        viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
        <path d="M7.5 15.5a4 4 0 0 1-.9-7.9 5 5 0 0 1 9.4-1.4 4 4 0 0 1
          1.9 7.6 3.5 3.5 0 0 1-3.4 1.7z"/>
        <circle cx="7" cy="18.6" r="1.3"/><circle cx="4.3" cy="21" r="0.8"/>
        </svg>what do we need to get done?</div>
      <div id="simple-tasks" class="drop-zone"
        data-list="simple"></div>
    </div>

    <div id="dates-view" class="hidden"></div>

    <div id="weekly-view"
      class="col-view hidden"></div>
    <div id="month-view"
      class="col-view hidden"></div>
    <div id="year-view" class="hidden"></div>
    <div id="done-view" class="hidden"></div>
  </div>
</div>

<script src="../sync.js"></script>
<script src="../sidebar.js"></script>
<script src="../dates.js"></script>
<script>
  const STORAGE_KEY = "todo-data";
  const DATES = ToolkitDates;
  const THEME_KEY   = "todo-theme";
  const VIEW_KEY    = "todo-view";

  // Drop the old shared size setting
  localStorage.removeItem("todo-size");
  const WEEK_KEY    = "todo-week-offset";
  const MONTH_KEY   = "todo-month-offset";
  const YEAR_KEY    = "todo-year-offset";
  const TOGGLE_KEY  = "todo-toggle-state";
  const TOGGLE_SEC  = "todo-toggle-sections";

  const app      = document.getElementById("app");
  const navCtrl  = document.getElementById("nav-controls");
  const navLabel = document.getElementById("nav-label");

  let weekOffset = 0, monthOffset = 0, yearOffset = 0;

  // ---- Dropdowns ----

  document.querySelectorAll(".dropdown-btn")
    .forEach(btn => {
      btn.addEventListener("click", e => {
        e.stopPropagation();
        const dd = btn.parentElement;
        document.querySelectorAll(".dropdown.open")
          .forEach(d => {
            if (d !== dd) d.classList.remove("open");
          });
        dd.classList.toggle("open");
      });
    });

  document.addEventListener("click", () => {
    document.querySelectorAll(".dropdown.open")
      .forEach(d => d.classList.remove("open"));
  });

  // Add a class to the page briefly, then run an optional follow-up
  function animate(cls, ms, after) {
    app.classList.add(cls);
    setTimeout(() => {
      app.classList.remove(cls);
      if (after) after();
    }, ms);
  }

  // Mark the chosen option and show it on the button
  function setDropdownActive(ddId, value) {
    const dd = document.getElementById(ddId);
    if (!dd) return;
    dd.querySelectorAll(".dropdown-item").forEach(item => {
      const on = item.dataset.value === value;
      item.classList.toggle("active", on);
      if (on) {
        dd.querySelector(".dropdown-btn").textContent = item.textContent;
      }
    });
  }

  // ---- Views, size and width (driven by the sidebar) ----

  const VIEWS = ["simple", "dates", "weekly", "month", "year", "done"];

  // Switch view in place, keeping the address and sidebar in step
  function showView(v) {
    if (!VIEWS.includes(v)) return false;
    currentView = v;
    localStorage.setItem(VIEW_KEY, v);
    history.replaceState(null, "", "#" + v);
    renderCurrentView();
    return true;
  }

  function changeWidth(w) {
    saveViewWidth(currentView, w);
    applyWidth(w);
    redrawMonthLines(300);

    // Refit text boxes once the width change settles
    setTimeout(() => {
      document.querySelectorAll("textarea.task-input").forEach(t => {
        t.style.height = "auto";
        t.style.height = t.scrollHeight + "px";
      });
    }, 270);
  }

  function changeSize(size) {
    saveViewSize(currentView, size);

    // Let text boxes grow with the text, then fit them once done
    const boxes = document.querySelectorAll("textarea.task-input");
    boxes.forEach(t => { t.style.height = ""; });
    animate("size-anim", 220, () => {
      boxes.forEach(t => {
        t.style.height = "auto";
        t.style.height = t.scrollHeight + "px";
      });
      redrawMonthLines();
    });
    applySize(size);
  }

  // ---- Data ----

  let dateKeysReady = true;
  let dateMigrationWarned = false;

  function loadData() {
    dateKeysReady = DATES.migrateStoredTodoKeys();
    if (!dateKeysReady && !dateMigrationWarned) {
      dateMigrationWarned = true;
      ToolkitSidebar.toast(
        "Date update paused; free browser storage and reload to retry."
      );
    }
    let data, raw = null;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
      data = JSON.parse(raw);
      const valid = data && typeof data === "object" && !Array.isArray(data)
        && (data.simple == null || Array.isArray(data.simple))
        && (data.weekly == null || (typeof data.weekly === "object"
          && !Array.isArray(data.weekly)))
        && (data.toggleData == null || (typeof data.toggleData === "object"
          && !Array.isArray(data.toggleData)))
        && ["simple", "weekly", "toggleData", "toggle", "dateSections",
          "datesMigrated"].some(k => k in data);
      if (raw !== null && !valid) {
        ToolkitSidebar.preserveRecovery(STORAGE_KEY, raw);
        data = null;
      }
      data = data || {
        simple: [], weekly: {},
        toggleData: {}, ...(dateKeysReady ? { dateKeyVersion: 1 } : {})
      };
    } catch {
      ToolkitSidebar.preserveRecovery(STORAGE_KEY, raw);
      data = {
        simple: [], weekly: {},
        toggleData: {}, ...(dateKeysReady ? { dateKeyVersion: 1 } : {})
      };
    }
    if (!Array.isArray(data.simple)) data.simple = [];
    if (!data.weekly || typeof data.weekly !== "object"
        || Array.isArray(data.weekly)) data.weekly = {};
    // Migrate old toggle format
    if (data.toggle && !data.toggleData) {
      data.toggleData = {};
      if (data.toggle.today) {
        data.toggleData.today = data.toggle.today;
      }
      if (data.toggle.later) {
        data.toggleData.later = data.toggle.later;
      }
      delete data.toggle;
    }
    if (!data.toggleData) data.toggleData = {};
    if (dateKeysReady) data.dateKeyVersion = 1;

    // Move old toggle sections into the simple list, once
    if (!data.datesMigrated) {
      const moved = [];
      Object.keys(data.toggleData).forEach(id => {
        data.toggleData[id].forEach(t => {
          if (t.text === "") return;
          if (id === "today" && !t.done && !firstToken(t.text)) {
            t.text += " @today";
          }
          moved.push(t);
        });
      });
      data.simple = data.simple.filter(t => t.text !== "").concat(moved);
      data.toggleData = {};
      data.datesMigrated = true;
    }
    if (!data.dateSections) data.dateSections = [];

    // Give every task a written day for its relative dates
    allLists(data).forEach(([, list]) => {
      list.forEach(t => { if (t.text && !t.anchorAt) stampAnchor(t); });
    });
    return data;
  }

  // Save, leaving out empty day lists so scrolling adds nothing
  function saveData(data) {
    if (dateKeysReady) data.dateKeyVersion = 1;
    const weekly = {};
    Object.keys(data.weekly).forEach(k => {
      if (data.weekly[k].length) weekly[k] = data.weekly[k];
    });
    localStorage.setItem(
      STORAGE_KEY, JSON.stringify(Object.assign({}, data, { weekly }))
    );
  }

  // Toggle sections
  function loadToggleSections() {
    try {
      const s = JSON.parse(
        localStorage.getItem(TOGGLE_SEC)
      );
      if (Array.isArray(s) && s.length) return s;
    } catch {}
    return [
      { id: "today", name: "Today" },
      { id: "later", name: "Later" }
    ];
  }

  function saveToggleSections(sections) {
    localStorage.setItem(
      TOGGLE_SEC, JSON.stringify(sections)
    );
  }

  // Get array ref by list key
  function getList(data, listKey) {
    if (listKey === "simple") return data.simple;
    if (listKey.startsWith("toggle-")) {
      const secId = listKey.slice(7);
      if (!data.toggleData[secId]) {
        data.toggleData[secId] = [];
      }
      return data.toggleData[secId];
    }
    if (!data.weekly[listKey]) {
      data.weekly[listKey] = [];
    }
    return data.weekly[listKey];
  }

  // Set array by list key
  function setList(data, listKey, arr) {
    if (listKey === "simple") {
      data.simple = arr;
    } else if (listKey.startsWith("toggle-")) {
      const secId = listKey.slice(7);
      if (!data.toggleData) data.toggleData = {};
      data.toggleData[secId] = arr;
    } else {
      data.weekly[listKey] = arr;
    }
  }

  // ---- Dates ----

  function getMonday(offset) {
    const d = new Date();
    const day = d.getDay();
    const diff = d.getDate() - day
      + (day === 0 ? -6 : 1);
    const mon = new Date(
      d.setDate(diff + (offset * 7))
    );
    mon.setHours(0, 0, 0, 0);
    return mon;
  }

  function isPast(d) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const c = new Date(d);
    c.setHours(0, 0, 0, 0);
    return c < today;
  }

  function isToday(d) {
    const t = new Date();
    return d.getDate() === t.getDate()
      && d.getMonth() === t.getMonth()
      && d.getFullYear() === t.getFullYear();
  }

  // Month as its three-letter name and year, such as "Oct 2026"
  function fmtMonth(d) {
    return MONTH_NAMES[d.getMonth()].slice(0, 3) + " " + d.getFullYear();
  }

  const DAY_NAMES = [
    "Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"
  ];
  const MONTH_NAMES = [
    "January", "February", "March", "April",
    "May", "June", "July", "August",
    "September", "October", "November", "December"
  ];

  // ---- Drag and drop ----

  let dragData = null; // { listKey, index }

  function handleDragStart(e, listKey, index) {
    dragData = { listKey, index };
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", "");
    e.target.closest(".task")
      .classList.add("dragging");
  }

  function handleDragEnd(e) {
    dragData = null;
    document.querySelectorAll(".dragging")
      .forEach(el => el.classList.remove("dragging"));
    document.querySelectorAll(
      ".drag-over-above, .drag-over-below"
    ).forEach(el => {
      el.classList.remove(
        "drag-over-above", "drag-over-below"
      );
    });
    document.querySelectorAll(".drag-active")
      .forEach(el =>
        el.classList.remove("drag-active")
      );
  }

  function handleDragOver(e, taskEl) {
    if (!dragData) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";

    // Clear previous indicators in this zone
    const zone = taskEl.closest(".drop-zone");
    if (zone) {
      zone.querySelectorAll(
        ".drag-over-above, .drag-over-below"
      ).forEach(el => {
        el.classList.remove(
          "drag-over-above", "drag-over-below"
        );
      });
    }

    const rect = taskEl.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    const above = e.clientY < mid;
    taskEl.classList.add(above ? "drag-over-above" : "drag-over-below");

    // In a list, dragging left or right sets the depth: at most one
    // deeper than the task it lands under, and three levels in all
    if (dragData.x0 === undefined) {
      taskEl.style.removeProperty("--drop-left");
      return;
    }
    let prev = above || taskEl.classList.contains("dragging")
      ? taskEl.previousElementSibling : taskEl;
    while (prev && (prev.classList.contains("dragging")
      || !prev.classList.contains("task"))) {
      prev = prev.previousElementSibling;
    }
    const max = prev && prev._task ? Math.min(3, (prev._task.indent || 0) + 1)
      : 0;
    const want = dragData.indent + Math.round((e.clientX - dragData.x0) / 24);
    dragData.depth = Math.max(0, Math.min(max, want));
    taskEl.style.setProperty("--drop-left", dragData.depth * 24 + "px");
  }

  // Dragging left to unindent can take the pointer off the list, so a
  // drag beside its own list still lands on the task level with it
  function besideTask(e) {
    if (!dragData || dragData.x0 === undefined || dragData.group) return null;
    if (e.target.closest && e.target.closest(".drop-zone, .task")) return null;
    const zone = zoneFor(dragData.listKey);
    if (!zone) return null;
    const tasks = [...zone.querySelectorAll(".task[data-index]")]
      .filter(t => t._task && t._task.text);
    return tasks.find(t => {
      const r = t.getBoundingClientRect();
      return e.clientY >= r.top && e.clientY < r.bottom;
    }) || null;
  }
  document.addEventListener("dragover", e => {
    const t = besideTask(e);
    if (t) handleDragOver(e, t);
  });
  document.addEventListener("drop", e => {
    const t = besideTask(e);
    if (!t) return;
    const r = t.getBoundingClientRect();
    const i = +t.dataset.index;
    handleDrop(e, dragData.listKey,
      e.clientY < r.top + r.height / 2 ? i : i + 1);
  });

  function handleZoneDragOver(e) {
    if (!dragData) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    e.currentTarget.classList.add("drag-active");
  }

  function handleZoneDragLeave(e) {
    e.currentTarget.classList.remove("drag-active");
  }

  function handleDrop(e, targetListKey, targetIndex) {
    e.preventDefault();
    if (!dragData) return;
    if (dragData.group) return dropGroup(e, targetListKey, targetIndex);
    if (dragData.mirror) return handleZoneDrop(e, targetListKey);

    const data = loadData();
    const srcList = getList(data, dragData.listKey);
    const srcIdx = dragData.index;

    // Don't move empty placeholder tasks
    if (!srcList[srcIdx]
      || srcList[srcIdx].text === "") {
      handleDragEnd(e);
      return;
    }

    const task = srcList.splice(srcIdx, 1)[0];
    const destList = getList(data, targetListKey);

    // Adjust target index if same list
    let insertAt = targetIndex;
    if (targetListKey === dragData.listKey
      && srcIdx < targetIndex) {
      insertAt--;
    }

    // Clamp
    if (insertAt < 0) insertAt = 0;
    if (insertAt > destList.length) {
      insertAt = destList.length;
    }

    destList.splice(insertAt, 0, task);
    if (dragData.depth !== undefined) task.indent = dragData.depth;
    fitToList(task, targetListKey, dragData.listKey);

    setList(data, dragData.listKey, srcList);
    setList(data, targetListKey, destList);
    saveData(data);

    handleDragEnd(e);
    renderCurrentView();
  }

  function handleZoneDrop(e, listKey) {
    e.preventDefault();
    if (!dragData) return;
    if (dragData.group) return dropGroup(e, listKey);

    const data = loadData();

    // A task shown here because of its date: change its date instead
    if (dragData.mirror) {
      const task = getList(data, dragData.listKey)[dragData.index];
      if (task) setDateToken(task, dateTokenFor(listKey));
      saveData(data);
      handleDragEnd(e);
      renderCurrentView();
      return;
    }
    const srcList = getList(data, dragData.listKey);
    const srcIdx = dragData.index;

    if (!srcList[srcIdx]
      || srcList[srcIdx].text === "") {
      handleDragEnd(e);
      return;
    }

    const task = srcList.splice(srcIdx, 1)[0];
    const destList = getList(data, listKey);

    // Insert before last empty placeholder
    const insertAt = destList.length > 0
      && destList[destList.length - 1].text === ""
      ? destList.length - 1
      : destList.length;
    destList.splice(insertAt, 0, task);
    if (listKey !== dragData.listKey) fitToList(task, listKey, dragData.listKey);

    setList(data, dragData.listKey, srcList);
    setList(data, listKey, destList);
    saveData(data);

    handleDragEnd(e);
    renderCurrentView();
  }

  // Drop several tasks at once: dated tasks shown from elsewhere take the
  // list's date; the rest move here in order, before the task dropped on
  function dropGroup(e, listKey, targetIndex) {
    const data = loadData();
    const dest = getList(data, listKey);
    const items = dragData.group
      .map(g => ({ g, task: getList(data, g.listKey)[g.index] }))
      .filter(x => x.task && x.task.text);
    const moving = [];
    items.forEach(({ g, task }) => {
      if (g.mirror && g.listKey !== listKey) {
        setDateToken(task, dateTokenFor(listKey));
      } else {
        moving.push({ g, task });
      }
    });
    const tasks = moving.map(m => m.task);
    let before = null;
    if (targetIndex !== undefined) {
      before = dest.slice(targetIndex).find(t => !tasks.includes(t)) || null;
    }
    moving.forEach(({ g, task }) => {
      setList(data, g.listKey,
        getList(data, g.listKey).filter(t => t !== task));
    });
    const list = getList(data, listKey);
    let at = before ? list.indexOf(before) : -1;
    if (at < 0) {
      at = list.length && list[list.length - 1].text === ""
        ? list.length - 1 : list.length;
    }
    list.splice(at, 0, ...tasks);
    moving.forEach(({ g, task }) => fitToList(task, listKey, g.listKey));
    setList(data, listKey, list);
    saveData(data);
    handleDragEnd(e);
    renderCurrentView();
  }

  // ---- Selecting several tasks ----

  function viewTasks() {
    return [...views[currentView].querySelectorAll(
      ".task:not(.placeholder):not(.note-task)")]
      .filter(el => el.offsetParent !== null && el._task && el._task.text);
  }

  function selectedTasks() {
    return [...views[currentView].querySelectorAll(".task.selected")];
  }

  let selAnchor = null;

  function clearTaskSelection() {
    document.querySelectorAll(".task.selected")
      .forEach(el => el.classList.remove("selected"));
    selAnchor = null;
  }

  // Ctrl+click adds or removes a task; Shift+click selects a run
  document.getElementById("content").addEventListener("pointerdown", e => {
    const el = e.target.closest(".task");
    const mod = e.ctrlKey || e.metaKey;
    if (!el || (!mod && !e.shiftKey) || !el._task || !el._task.text
      || el.classList.contains("placeholder")
      || e.target.closest('button, input[type="checkbox"], a')) {
      if (!e.target.closest(".task.selected .drag-handle")) {
        clearTaskSelection();
      }
      return;
    }
    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) {
      document.activeElement.blur();
    }
    const all = viewTasks();
    if (e.shiftKey) {
      const focused = selAnchor && all.includes(selAnchor) ? selAnchor
        : selectedTasks()[0] || el;
      let a = all.indexOf(focused), z = all.indexOf(el);
      if (a > z) [a, z] = [z, a];
      clearTaskSelection();
      all.slice(a, z + 1).forEach(x => x.classList.add("selected"));
      selAnchor = focused;
    } else {
      el.classList.toggle("selected");
      selAnchor = el;
    }
  });

  // Ctrl+A selects every task in the view (a second press when a task's
  // own text is already selected); then copy, delete or Escape
  document.addEventListener("keydown", e => {
    const mod = e.ctrlKey || e.metaKey;
    const a = document.activeElement;
    const inTask = a && a.matches && a.matches("textarea.task-input");
    const typing = a && a.matches && a.matches("input, textarea, select")
      && !inTask;
    if (typing || document.getElementById("tk-switch")) return;
    if (mod && e.key.toLowerCase() === "a") {
      if (inTask && a.value && !(a.selectionStart === 0
        && a.selectionEnd === a.value.length)) return;
      e.preventDefault();
      if (inTask) a.blur();
      getSelection().removeAllRanges();
      viewTasks().forEach(x => x.classList.add("selected"));
      return;
    }
    const sel = selectedTasks();
    if (!sel.length || inTask) return;
    if (e.key === "Escape") {
      clearTaskSelection();
    } else if (e.key === "Delete" || e.key === "Backspace") {
      e.preventDefault();
      const before = localStorage.getItem(STORAGE_KEY);
      const data = loadData();
      sel.forEach(el => {
        const d = el._drag;
        if (!d) return;
        const task = getList(data, d.listKey)[d.index];
        if (task) task._gone = true;
      });
      allLists(data).forEach(([key, list]) => {
        setList(data, key, list.filter(t => !t._gone));
      });
      saveData(data);
      clearTaskSelection();
      renderCurrentView();
      ToolkitSidebar.toast(sel.length + " to dos deleted", () => {
        localStorage.setItem(STORAGE_KEY, before);
        renderCurrentView();
      });
    }
  });

  // Copy the selected tasks as lines of text, indented as they are
  document.addEventListener("copy", e => {
    const sel = selectedTasks();
    const a = document.activeElement;
    if (!sel.length || (a && a.matches && a.matches("input, textarea"))) {
      return;
    }
    e.preventDefault();
    e.clipboardData.setData("text/plain", sel.map(el =>
      "  ".repeat(el._task.indent || 0) + el._task.text).join("\n"));
  });

  // Six dots in two columns
  const DRAG_ICON = '<svg width="6" height="10" viewBox="0 0 6 10">'
    + '<circle cx="1" cy="1" r="1"/><circle cx="5" cy="1" r="1"/>'
    + '<circle cx="1" cy="5" r="1"/><circle cx="5" cy="5" r="1"/>'
    + '<circle cx="1" cy="9" r="1"/><circle cx="5" cy="9" r="1"/></svg>';

  // Calendar lists hold their own date, so a dropped task drops its @date
  function isCalendarList(key) {
    return /^\d{4}-\d{2}-\d{2}$/.test(key) || key.startsWith("_ym-");
  }

  function fitToList(task, listKey, fromKey) {
    if (listKey !== fromKey && isCalendarList(listKey)) {
      setDateToken(task, "");
    }
  }

  // The @date matching a calendar list, or "" for undated lists
  function dateTokenFor(listKey) {
    if (/^\d{4}-\d{2}-\d{2}$/.test(listKey)) {
      const d = keyToDate(listKey);
      return "@" + d.getDate() + " " + MONTH_NAMES[d.getMonth()].slice(0, 3)
        + " " + d.getFullYear();
    }
    if (listKey.startsWith("_ym-")) {
      const [, y, m] = listKey.split("-");
      return "@" + MONTH_NAMES[+m] + " " + y;
    }
    return "";
  }

  // Replace a task's first @date, add one, or remove it ("" token)
  function setDateToken(task, token) {
    DATE_PATTERN.lastIndex = 0;
    const m = DATE_PATTERN.exec(task.text);
    let text = m
      ? task.text.slice(0, m.index) + token + task.text.slice(m.index + m[0].length)
      : token ? task.text.trimEnd() + " " + token : task.text;
    task.text = text.replace(/\s{2,}/g, " ").trim();
    stampAnchor(task);
  }

  // ---- Date highlighting ----

  const DATE_PATTERN = DATES.datePattern();
  const {
    addDays, dateKey, dayStart, firstToken, keyToDate, monthRange, oneDay,
    parseSpec, stampAnchor, taskRange, textRange, weekStart
  } = DATES;

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function highlightDates(text) {
    if (!text) return "";
    let result = "";
    let lastIdx = 0;
    let match;
    DATE_PATTERN.lastIndex = 0;
    while ((match = DATE_PATTERN.exec(text))) {
      result += highlightTags(
        text.slice(lastIdx, match.index)
      );
      result += '<span class="date-token">'
        + escapeHtml(match[0]) + '</span>';
      lastIdx = match.index + match[0].length;
    }
    result += highlightTags(text.slice(lastIdx));
    return result;
  }

  // ---- Tags ----

  // A # at the start or after a space, running to the next space
  const TAG_PATTERN = /(^|\s)(#[^\s#]+)/g;

  // Tags (#), and any word with an @ in it (names, emails, a lone @)
  const MARK_PATTERN = /(^|\s)(#[^\s#]+|[^\s#]*@[^\s]*)/g;

  // Drop punctuation that ends a sentence rather than the tag
  function trimTag(tag) {
    return tag.replace(/[.,;:!?)\]]+$/, "");
  }

  // Tint #tags; colour any other @word, such as a name
  function highlightTags(seg) {
    let out = "", last = 0, m;
    MARK_PATTERN.lastIndex = 0;
    while ((m = MARK_PATTERN.exec(seg))) {
      const start = m.index + m[1].length;
      const isTag = m[2][0] === "#";
      const mark = isTag ? trimTag(m[2]) : m[2].replace(/[.,;:!?)\]]+$/, "") || m[2];
      if (isTag && mark.length < 2) continue;
      const cls = isTag ? "tag-token" : "mention-token";
      out += escapeHtml(seg.slice(last, start))
        + '<span class="' + cls + '">' + escapeHtml(mark) + '</span>';
      last = start + mark.length;
    }
    return out + escapeHtml(seg.slice(last));
  }

  // Unique tags in a task, in the order written
  function taskTags(text) {
    const tags = [];
    let m;
    TAG_PATTERN.lastIndex = 0;
    while ((m = TAG_PATTERN.exec(text || ""))) {
      const tag = trimTag(m[2]);
      if (tag.length > 1 && !tags.includes(tag)) tags.push(tag);
    }
    return tags;
  }

  // ---- Task element ----

  function createTaskEl(
    task, onUpdate, onDelete, opts
  ) {
    opts = opts || {};
    const div = document.createElement("div");
    const indent = task.indent || 0;
    div.className = "task"
      + (task.done ? " done" : "")
      + (indent > 0 && !opts.flat ? " indent-" + indent : "");
    if (opts.index !== undefined) div.dataset.index = opts.index;

    // What a drag of this task carries, alone or with others
    div._task = task;
    div._drag = opts.listKey ? { index: opts.index, listKey: opts.listKey }
      : opts.dragSrc ? { index: opts.dragIndex, listKey: opts.dragSrc,
        mirror: true, section: opts.section, task } : null;

    // Past its date and not ticked
    const range = task.text && !task.done
      ? taskRange(task, opts.srcKey || opts.listKey) : null;
    if (range && range.end < dayStart(new Date())) {
      div.classList.add("overdue");
    }

    // A new-task row in the dates view
    if (opts.onCommit) {
      div.classList.add("placeholder");
      div.dataset.section = opts.section;
    }

    // Drag handle for reordering and moving tasks
    let handle = null;
    if (task.text !== "" && !opts.onCommit
      && (opts.listKey || opts.dragSrc)) {
      handle = document.createElement("span");
      handle.className = "drag-handle";
      handle.title = "drag to move";
      handle.innerHTML = DRAG_ICON;
      handle.draggable = true;
      handle.addEventListener("dragstart", e => {
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", "");
        e.dataTransfer.setDragImage(div, 20, 12);

        // A selected task brings the rest of the selection with it
        const group = selectedTasks();
        if (div.classList.contains("selected") && group.length > 1) {
          dragData = Object.assign({}, div._drag, {
            group: group.map(el => el._drag).filter(Boolean)
          });
          group.forEach(el => el.classList.add("dragging"));
          return;
        }
        clearTaskSelection();
        dragData = opts.listKey
          ? { index: opts.index, indent: task.indent || 0,
            listKey: opts.listKey, x0: e.clientX }
          : {
            index: opts.dragIndex, listKey: opts.dragSrc, mirror: true,
            section: opts.section, task
          };
        div.classList.add("dragging");
      });
      div.addEventListener("dragend", handleDragEnd);
    }

    // Dropping onto a task places the dragged one above or below it
    if (task.text !== "" && (opts.listKey || opts.onDropHere)) {
      div.addEventListener("dragover", e => handleDragOver(e, div));
      div.addEventListener("drop", e => {
        const rect = div.getBoundingClientRect();
        const before = e.clientY < rect.top + rect.height / 2;
        e.stopPropagation();
        if (opts.onDropHere) opts.onDropHere(e, task, before);
        else handleDrop(e, opts.listKey, before ? opts.index : opts.index + 1);
      });
    }

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = task.done;

    cb.addEventListener("change", () => {
      task.done = cb.checked;
      if (task.done) task.doneAt = Date.now();
      else delete task.doneAt;
      div.classList.toggle("done", task.done);
      onUpdate();

      // Let the tick show before the task moves
      if (opts.onDoneChange) setTimeout(opts.onDoneChange, 250);
    });

    const txt = document.createElement("textarea");
    txt.className = "task-input";
    txt.rows = 1;
    txt.value = task.text;
    if (!opts.noPlaceholder) {
      txt.placeholder = "new task...";
    }
    txt.addEventListener("keydown", e => {
      if (e.key === "Tab") {
        e.preventDefault();
        if (e.shiftKey) {
          // Outdent
          task.indent = Math.max(
            0, (task.indent || 0) - 1
          );
        } else {
          // Indent (max 3 levels)
          task.indent = Math.min(
            3, (task.indent || 0) + 1
          );
        }
        if (opts.noPlaceholder && task.text === "") {
          pendingAdd = opts.listKey;
        }
        onUpdate();
        renderCurrentView();

        // Refocus same task after re-render
        setTimeout(() => {
          const zone = zoneFor(opts.listKey);
          const t = zone && zone.querySelector(
            '.task[data-index="' + opts.index + '"] textarea'
          );
          if (t) t.focus();
        }, 10);
        return;
      }
      if (e.key === "Enter" && opts.onCommit) {
        e.preventDefault();
        committedByEnter = true;
        txt.blur();
        return;
      }
      if (e.key === "Enter") {
        e.preventDefault();
        const pos = txt.selectionStart, end = txt.selectionEnd;
        const before = txt.value.slice(0, pos);
        const after = txt.value.slice(end);
        if (opts.mirror) {
          onUpdate();
          if (opts.onEnter && txt.value) opts.onEnter(div, before, after);
          else txt.blur();
          return;
        }
        if (opts.listKey && opts.index !== undefined && txt.value) {
          enterAt(task, opts, before, after);
          return;
        }

        // Calendar views add a blank task on Enter
        if (opts.noPlaceholder) pendingAdd = opts.listKey;
        onUpdate();
        renderCurrentView();
        focusLast(opts.listKey);
      }
      if (e.key === "Backspace"
        && txt.value === ""
        && task.text === "") {
        e.preventDefault();
        onDelete(task);
      }
    });

    const del = document.createElement("button");
    del.className = "delete-btn";
    del.textContent = "\u00d7";
    del.addEventListener("click", () => {
      const before = localStorage.getItem(STORAGE_KEY);
      onDelete(task);
      if (window.ToolkitSidebar) {
        ToolkitSidebar.toast("to do deleted", () => {
          localStorage.setItem(STORAGE_KEY, before);
          renderCurrentView();
        });
      }
    });

    // Text wrapper with highlight overlay
    const wrap = document.createElement("div");
    wrap.className = "task-text-wrap";

    const highlight = document.createElement("div");
    highlight.className = "task-highlight";

    // Tags echoed at the right, kept in step with the text
    const tagBox = document.createElement("span");
    tagBox.className = "task-tags";

    function syncHighlight() {
      highlight.innerHTML = highlightDates(txt.value);
      tagBox.innerHTML = taskTags(txt.value)
        .map(t => '<span class="tag-chip">' + escapeHtml(t) + '</span>')
        .join("");
    }

    function autoResize() {
      txt.style.height = "auto";
      txt.style.height = txt.scrollHeight + "px";
    }

    // New-task rows save when you press Enter or leave them
    let committedByEnter = false;
    if (opts.onCommit) {
      txt.addEventListener("blur", () => {
        opts.onCommit(committedByEnter);
        committedByEnter = false;
      });
    }

    txt.addEventListener("input", () => {
      task.text = txt.value;
      if (task.text) stampAnchor(task);
      autoResize();
      syncHighlight();
      onUpdate();
    });

    wrap.appendChild(highlight);
    wrap.appendChild(txt);
    // Initial sync after DOM attach
    setTimeout(() => {
      autoResize();
      syncHighlight();
    }, 0);

    if (handle) div.appendChild(handle);
    div.appendChild(cb);
    div.appendChild(wrap);
    div.appendChild(tagBox);
    if (task.text !== "" && !opts.onCommit) {
      div.appendChild(focusBtn(() => {
        if (!task.fid) task.fid = newFid();
        onUpdate();
        ToolkitFocus.go({ fid: task.fid, kind: "todo" }, task.text);
      }));
    }
    div.appendChild(del);
    return div;
  }

  // ---- Focus mode ----

  const newFid = () => Date.now().toString(36)
    + Math.random().toString(36).slice(2, 7);

  // The target button that opens a task in focus mode
  function focusBtn(onClick) {
    const b = document.createElement("button");
    b.className = "focus-btn";
    b.type = "button";
    b.title = "focus on this";
    b.setAttribute("aria-label", "focus on this");
    b.innerHTML = ToolkitSidebar.icon("focus");
    b.addEventListener("mousedown", e => e.preventDefault());
    b.addEventListener("click", e => {
      e.stopPropagation();
      onClick();
    });
    return b;
  }

  function setupDropZone(el, listKey) {
    el.addEventListener("dragover",
      handleZoneDragOver);
    el.addEventListener("dragleave",
      handleZoneDragLeave);
    el.addEventListener("drop",
      e => handleZoneDrop(e, listKey));
  }

  // ---- Blank tasks in calendar views ----

  // List waiting for a blank task on the next render
  let pendingAdd = null;

  // Find a list's drop zone in the visible view
  function zoneFor(listKey) {
    return views[currentView].querySelector(
      '.drop-zone[data-list="' + listKey + '"]'
    );
  }

  // Click below the simple list to start a new to do at its end
  document.getElementById("simple-view").addEventListener("click", e => {
    if (e.target.closest(".task, button, .simple-prompt, a")) return;
    const tasks = document.getElementById("simple-tasks");
    const last = tasks.lastElementChild;
    if (last && e.clientY < last.getBoundingClientRect().bottom) return;
    const blank = [...tasks.querySelectorAll("textarea")]
      .find(t => !t.value);
    if (blank) {
      blank.focus();
      return;
    }
    pendingAdd = "simple";
    renderSimple();
    focusLast("simple");
  });

  // Enter in a list: the text after the cursor (or a blank task) goes
  // directly beneath; at the very start, a blank task goes above
  let pendingAt = null;

  function enterAt(task, opts, before, after) {
    const data = loadData();
    const list = getList(data, opts.listKey);
    const i = opts.index;
    const cur = list[i];
    if (!cur) return;
    const indent = cur.indent || 0;
    const pending = opts.noPlaceholder || opts.listKey === "simple";
    let focusAt;
    const caret = 0;
    if (before) {
      cur.text = before;
      stampAnchor(cur);
      if (after) {
        const nt = { done: false, indent, text: after };
        stampAnchor(nt);
        list.splice(i + 1, 0, nt);
      } else if (!pending) {
        list.splice(i + 1, 0, { done: false, indent, text: "" });
      }
      focusAt = i + 1;
    } else {
      if (!pending) {
        list.splice(i, 0, { done: false, indent, text: "" });
      }
      focusAt = pending ? i : i + 1;
    }
    setList(data, opts.listKey, list);
    saveData(data);

    // Lists drop blank tasks when drawn, so ask for this one
    if (pending && !(before && after)) {
      const kept = list.filter(t => t.text !== "");
      const k = kept.indexOf(cur);
      pendingAt = { indent, listKey: opts.listKey,
        pos: before ? k + 1 : k };
      focusAt = pendingAt.pos;
    }
    renderCurrentView();
    setTimeout(() => {
      pendingAt = null;
      const zone = zoneFor(opts.listKey);
      const t = zone && zone.querySelector(
        '.task[data-index="' + focusAt + '"] textarea');
      if (t) {
        t.focus();
        t.setSelectionRange(caret, caret);
      }
    }, 10);
  }

  // Focus the last task in a list after re-render
  function focusLast(listKey) {
    setTimeout(() => {
      pendingAdd = null;
      const zone = zoneFor(listKey);
      if (!zone) return;
      const inputs = zone.querySelectorAll("textarea.task-input");
      if (inputs.length) inputs[inputs.length - 1].focus();
    }, 10);
  }

  // Drop blank tasks, then add one where the user asked for it
  function prepList(data, listKey) {
    const list = getList(data, listKey)
      .filter(t => t.text !== "");
    if (pendingAdd === listKey) {
      list.push({ text: "", done: false, indent: 0 });
    }
    if (pendingAt && pendingAt.listKey === listKey) {
      list.splice(pendingAt.pos, 0,
        { done: false, indent: pendingAt.indent, text: "" });
    }
    setList(data, listKey, list);
    return list;
  }

  // Every stored list as [list key, tasks]
  function allLists(data) {
    const lists = [["simple", data.simple]];
    Object.keys(data.toggleData).forEach(id => {
      lists.push(["toggle-" + id, data.toggleData[id]]);
    });
    Object.keys(data.weekly).forEach(k => {
      lists.push([k, data.weekly[k]]);
    });
    return lists;
  }

  // Group dated tasks by day key and year-view month key
  function collectDated(data) {
    const byDay = {}, byMonth = {};
    allLists(data).forEach(([src, list]) => {
      list.forEach(task => {
        if (!task.text) return;
        const anchor = dayStart(
          task.anchorAt ? new Date(task.anchorAt) : new Date()
        );
        const r = textRange(task.text, anchor);
        if (!r) return;
        const d = r.start;
        const mk = "_ym-" + d.getFullYear() + "-"
          + String(d.getMonth()).padStart(2, "0");

        // Single days show in their day cell; anything within a month
        // shows on that month's card
        if (+r.start === +r.end) {
          const dk = dateKey(d);
          if (src !== dk) (byDay[dk] = byDay[dk] || []).push({ src, task });
        }
        if (r.end.getMonth() === d.getMonth()
          && r.end.getFullYear() === d.getFullYear() && src !== mk) {
          (byMonth[mk] = byMonth[mk] || []).push({ src, task });
        }
      });
    });
    return { byDay, byMonth };
  }

  // Show tasks dated from other lists at the top of a cell
  function addMirrors(el, data, items, renderFn) {
    (items || []).forEach(({ src, task }) => {
      const tEl = createTaskEl(
        task,
        () => saveData(data),
        t => {
          setList(data, src, getList(data, src).filter(x => x !== t));
          saveData(data);
          renderFn();
        },
        {
          dragIndex: getList(data, src).indexOf(task), dragSrc: src,
          flat: true, mirror: true, noPlaceholder: true,
          onDoneChange: renderFn
        }
      );
      tEl.classList.add("mirrored");
      tEl.title = "dated task, also listed elsewhere";
      el.appendChild(tEl);
    });
  }

  // Click an empty part of a cell to add a task
  function setupClickToAdd(clickEl, listKey, renderFn) {
    clickEl.addEventListener("click", e => {
      if (e.target.closest(
        ".task, .delete-btn, button"
      )) return;
      pendingAdd = listKey;
      renderFn();
      focusLast(listKey);
    });
  }

  // ---- Simple ----

  function renderSimple() {
    const data = loadData();
    const el = document.getElementById("simple-tasks");
    el.innerHTML = "";

    // No standing blank row: one shows only for an empty list, or where
    // Enter or a click below the list asks for it
    const list = prepList(data, "simple");
    if (!list.length) list.push({ done: false, indent: 0, text: "" });
    saveData(data);

    data.simple.forEach((task, i) => {
      el.appendChild(createTaskEl(
        task,
        () => saveData(data),
        t => {
          data.simple =
            data.simple.filter(x => x !== t);
          saveData(data);
          renderSimple();
        },
        { listKey: "simple", index: i }
      ));
    });

    setupDropZone(el, "simple");
  }

  // ---- Toggle ----

  // The dates and done views' toggles start closed on each visit
  localStorage.removeItem(TOGGLE_KEY);
  localStorage.removeItem("todo-done-sections");

  function loadToggleState() {
    try {
      return JSON.parse(
        localStorage.getItem(TOGGLE_KEY)
      ) || {};
    } catch { return {}; }
  }

  function saveToggleState(st) {
    localStorage.setItem(
      TOGGLE_KEY, JSON.stringify(st)
    );
  }

  // ---- Dates ----

  // Section to refocus after a re-render, set when a task is added
  let datesRefocus = null, datesAfter = null;

  // Built-in date sections, then added ones in date order
  function dateSections(data) {
    const t = dayStart(new Date());
    const wk = weekStart(t);
    const sections = [
      { id: "today", name: "Today", range: oneDay(t), token: "@today" },
      {
        id: "tomorrow", name: "Tomorrow",
        range: oneDay(addDays(t, 1)), token: "@tomorrow"
      },
      {
        id: "this-week", name: "This week",
        range: { start: wk, end: addDays(wk, 6) }, token: "@this week"
      },
      {
        id: "next-week", name: "Next week",
        range: { start: addDays(wk, 7), end: addDays(wk, 13) },
        token: "@next week"
      }
    ];
    const added = data.dateSections
      .map(c => ({
        custom: true, id: c.id, name: "@" + c.spec,
        range: parseSpec(c.spec, t), token: "@" + c.spec
      }))
      .filter(c => c.range)
      .sort((a, b) => a.range.start - b.range.start);
    return sections.concat(added);
  }

  // Save a typed new task to the simple list, adding the section's date
  function commitNew(data, temp, token, sectionId, byEnter) {
    const text = temp.text.trim();
    if (!text) return;
    const task = {
      done: false, indent: 0,
      text: token && !firstToken(text) ? text + " " + token : text
    };
    stampAnchor(task);
    data.simple = data.simple.filter(t => t.text !== "");
    data.simple.push(task);
    saveData(data);

    // Keep typing in the same section after Enter; otherwise follow
    // the cursor to whichever new-task row was clicked
    setTimeout(() => {
      const a = document.activeElement;
      const row = a && a.closest && a.closest(".task.placeholder");
      datesRefocus = byEnter ? sectionId : row ? row.dataset.section : null;
      renderDates();
    }, 0);
  }

  // Drop a dragged task into a dates section, above or below a task
  function dropInSection(e, data, sec, items, target, before) {
    e.preventDefault();
    e.stopPropagation();
    const drag = dragData;
    handleDragEnd(e);
    if (!drag || !drag.task || sec.id === "overdue") return;
    const moves = drag.group ? drag.group.filter(g => g.task) : [drag];
    const tasks = moves.map(g => g.task);
    moves.forEach(g => moveToSection(data, g, sec));

    // Keep the dropped position within the section
    if (sec.id !== "_done") {
      const list = items.map(x => x.task).filter(t => !tasks.includes(t));
      const at = target && list.includes(target)
        ? list.indexOf(target) + (before ? 0 : 1) : list.length;
      list.splice(at, 0, ...tasks);
      list.forEach((t, i) => { t.order = i; });
    }
    saveData(data);
    renderDates();
  }

  // Moving to another section changes the task's date or tick
  function moveToSection(data, drag, sec) {
    const task = drag.task;
    if (drag.section !== sec.id) {
      if (sec.id === "_done") {
        task.done = true;
        task.doneAt = Date.now();
      } else {
        task.done = false;
        delete task.doneAt;
        setDateToken(task, sec.id === "to-schedule" ? "" : sec.token);

        // A calendar task takes its new date from the text instead
        if (isCalendarList(drag.listKey)) {
          setList(data, drag.listKey,
            getList(data, drag.listKey).filter(t => t !== task));
          data.simple = data.simple.filter(t => t.text !== "");
          data.simple.push(task);
        }
      }
    }
  }

  // One collapsible section of the dates view
  function buildSection(el, sec, items, data, tState, opts = {}) {
    const open = tState[sec.id] === true;
    const section = document.createElement("div");
    section.className = "toggle-section" + (opts.cls ? " " + opts.cls : "");

    const header = document.createElement("div");
    header.className = "toggle-header";
    const arrow = document.createElement("span");
    arrow.className = "toggle-arrow" + (open ? "" : " collapsed")
      + (items.length ? "" : " empty");
    arrow.textContent = "▼";
    const title = document.createElement("span");
    title.className = "toggle-title";
    title.textContent = sec.name;
    const count = document.createElement("span");
    count.className = "toggle-count";
    count.textContent = items.length;
    header.appendChild(arrow);
    header.appendChild(title);
    header.appendChild(count);

    // Added dates and ranges can be removed; their tasks stay
    if (sec.custom) {
      const del = document.createElement("button");
      del.className = "toggle-delete-btn";
      del.textContent = "×";
      del.title = "remove this date or range";
      del.addEventListener("click", e => {
        e.stopPropagation();
        const before = localStorage.getItem(STORAGE_KEY);
        data.dateSections = data.dateSections.filter(c => c.id !== sec.id);
        saveData(data);
        renderDates();
        ToolkitSidebar.toast("date removed", () => {
          localStorage.setItem(STORAGE_KEY, before);
          renderDates();
        });
      });
      header.appendChild(del);
    }

    const tasks = document.createElement("div");
    tasks.className = "toggle-tasks drop-zone";
    tasks.dataset.section = sec.id;
    const drop = (e, target, before) =>
      dropInSection(e, data, sec, items, target, before);

    // Drop onto the section's tasks or its title (useful when closed)
    if (sec.id !== "overdue") {
      [tasks, header].forEach(z => {
        z.addEventListener("dragover", handleZoneDragOver);
        z.addEventListener("dragleave", handleZoneDragLeave);
        z.addEventListener("drop", e => drop(e, null, false));
      });
    }

    // Subtasks under their parent keep their indent; tasks shown on
    // their own here sit flush
    items.forEach(item => {
      addItem(item, true);
      (item.children || []).forEach(c => addItem(c, false));
    });

    function addItem(item, flat) {
      if (item.note) {
        tasks.appendChild(noteTaskEl(item));
        return;
      }
      const { src, task } = item;
      const tEl = createTaskEl(
        task,
        () => saveData(data),
        t => {
          setList(data, src, getList(data, src).filter(x => x !== t));
          saveData(data);
          renderDates();
        },
        {
          dragIndex: getList(data, src).indexOf(task), dragSrc: src,
          flat, mirror: true, noPlaceholder: true, onDoneChange: renderDates,
          onDropHere: sec.id === "overdue" ? null : drop,
          onEnter: opts.addable
            ? (el, before, after) => enterBelow(el, task, before, after)
            : null,
          section: sec.id, srcKey: src
        }
      );
      tEl.title = "from " + sourceLabel(src);
      if (opts.showDate) {
        const r = taskRange(task, src);
        if (r && +r.start === +r.end) addSource(tEl, fmtDay(r.start, false));
      }
      tasks.appendChild(tEl);
    }

    // Enter in a task: the rest of its text, or a new row, goes directly
    // beneath it in this section
    function enterBelow(el, task, before, after) {
      if (after && before) {
        task.text = before;
        stampAnchor(task);
        placeAfter(task, after, "split");
        return;
      }
      const temp = { done: false, indent: task.indent || 0, text: "" };
      const row = createTaskEl(temp, () => {}, () => {}, {
        onCommit: byEnter => {
          if (row._done) return;
          row._done = true;
          if (!temp.text.trim()) {
            row.remove();
            return;
          }
          placeAfter(task, temp.text.trim(), byEnter ? "row" : null);
        },
        section: sec.id
      });
      el.after(row);
      setTimeout(() => row.querySelector("textarea").focus(), 0);
    }

    // Add a task to this section, ordered just after another; then put
    // the cursor at its start (split) or open a row beneath it (row)
    function placeAfter(task, text, then) {
      const nt = { done: false, indent: task.indent || 0,
        text: sec.token && !firstToken(text) ? text + " " + sec.token : text };
      stampAnchor(nt);
      data.simple = data.simple.filter(t => t.text !== "");
      data.simple.push(nt);
      const seq = [...tasks.querySelectorAll(".task:not(.placeholder)")]
        .map(x => x._task).filter(Boolean);
      seq.splice(seq.indexOf(task) + 1, 0, nt);
      seq.forEach((t, i) => { t.order = i; });
      saveData(data);
      datesAfter = then ? { section: sec.id, text: nt.text, then } : null;
      setTimeout(renderDates, 0);
    }

    // A row for typing a new task into this section
    // A new-task row shows for an empty section, to keep typing after
    // Enter, or when the space below the section's to dos is clicked
    function addRow() {
      const temp = { done: false, indent: 0, text: "" };
      const row = createTaskEl(
        temp, () => {}, () => {},
        {
          onCommit: byEnter => commitNew(
            data, temp, sec.token, sec.id, byEnter
          ),
          section: sec.id
        }
      );
      tasks.appendChild(row);
      return row;
    }
    if (opts.addable) {
      if (!items.length || datesRefocus === sec.id) addRow();
      tasks.addEventListener("click", e => {
        if (e.target.closest(".task")) return;
        const row = tasks.querySelector(".task.placeholder") || addRow();
        row.querySelector("textarea").focus();
      });
    }

    const body = document.createElement("div");
    body.className = "toggle-body" + (open ? "" : " collapsed");
    body.appendChild(tasks);

    // Open or close in place so the change animates
    [arrow, title, count].forEach(btn => {
      btn.addEventListener("click", () => {
        const st = loadToggleState();
        st[sec.id] = st[sec.id] !== true;
        saveToggleState(st);
        arrow.classList.toggle("collapsed", !st[sec.id]);
        body.classList.toggle("collapsed", !st[sec.id]);
      });
    });

    section.appendChild(header);
    section.appendChild(body);
    el.appendChild(section);
  }

  // Button that turns into a box for typing a new date or range
  function buildAddRange(el, data) {
    const btn = document.createElement("button");
    btn.className = "add-section-btn";
    btn.textContent = "+ Add date or range";
    btn.addEventListener("click", () => {
      const input = document.createElement("input");
      input.className = "add-range-input";
      input.placeholder = "e.g. friday, november, 1 nov to 7 nov";
      btn.replaceWith(input);
      input.focus();

      const finish = save => {
        const spec = input.value.trim().replace(/^@/, "");
        if (save && spec) {
          if (!parseSpec(spec, dayStart(new Date()))) {
            input.classList.add("invalid");
            input.title = "try a day, month, or range such as 1 nov to 7 nov";
            return;
          }
          data.dateSections.push({ id: "d_" + Date.now(), spec });
          saveData(data);
        }
        renderDates();
      };
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") finish(true);
        if (e.key === "Escape") finish(false);
      });
      input.addEventListener("input", () => {
        input.classList.remove("invalid");
      });
      input.addEventListener("blur", () => {
        if (!input.value.trim()) renderDates();
      });
    });
    // Show or hide how many items each section holds
    const counts = document.createElement("button");
    counts.className = "add-section-btn counts-btn";
    const shown = () => localStorage.getItem(COUNTS_KEY) !== "0";
    counts.textContent = shown() ? "hide counts" : "show counts";
    counts.addEventListener("click", () => {
      localStorage.setItem(COUNTS_KEY, shown() ? "0" : "1");
      el.classList.toggle("hide-counts", !shown());
      counts.textContent = shown() ? "hide counts" : "show counts";
    });

    const row = document.createElement("div");
    row.className = "add-row";
    row.append(btn, counts);
    el.appendChild(row);
  }

  const COUNTS_KEY = "todo-show-counts";

  function renderDates() {
    const data = loadData();
    const tState = loadToggleState();
    const el = document.getElementById("dates-view");
    el.innerHTML = "";
