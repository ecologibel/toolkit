<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>notes · toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
  /* Pages cross-fade into each other where the browser allows */
  @view-transition { navigation: auto; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  button, input { font-family: inherit; }
  html, body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 400;
    height: 100%;
    overflow: hidden;
  }

  /* ---- Modes ---- */
  .t-dark {
    --accent:       #7fdbca;
    --bg:           #011627;
    --bg-surface:   #01111f;
    --block-sel:    rgba(127, 219, 202, 0.12);
    --border:       #1e3a52;
    --code-bg:      rgba(127, 219, 202, 0.08);
    --code-block:   #010e1a;
    --code-fg:      #f78c6c;
    --drag-bg:      rgba(127, 219, 202, 0.08);
    --fg:           #d6deeb;
    --fg-muted:     #6c7a89;
    --head-tint:    rgba(1, 22, 39, 0.5);
    --hover:        #012a3f;
    --mark-bg:      color-mix(in srgb, var(--accent) 16%, transparent);
    --past-bg:      rgba(19, 85, 92, 0.25);
    --scroll-thumb: #1e3a52;
    --shadow:       0 2px 10px rgba(0, 0, 0, 0.45);
    --c-blue:   #82aaff;
    --c-green:  #addb67;
    --c-grey:   #8a96a3;
    --c-orange: #f78c6c;
    --c-pink:   #ff8bb4;
    --c-purple: #c792ea;
    --c-red:    #ef5350;
    --c-yellow: #ecc48d;
    --r-com:   #5a9a8e;
    --r-const: #9ea3ec;
    --r-fg:    #d6deeb;
    --r-fn:    #f4a46a;
    --r-kw:    #97b7ff;
    --r-num:   #9ea3ec;
    --r-op:    #7fdbca;
    --r-str:   #9ccc8a;
  }
  .t-light {
    --accent:       #0c9e9a;
    --bg:           #ecf2f2;
    --bg-surface:   #f6fafa;
    --block-sel:    rgba(12, 158, 154, 0.12);
    --border:       #a3c4c6;
    --code-bg:      rgba(12, 158, 154, 0.08);
    --code-block:   #ebf5f3;
    --code-fg:      #c9532b;
    --drag-bg:      rgba(12, 158, 154, 0.1);
    --fg:           #24292e;
    --fg-muted:     #6a737d;
    --head-tint:    rgba(236, 242, 242, 0.5);
    --hover:        #d9e8ea;
    --mark-bg:      color-mix(in srgb, var(--accent) 16%, transparent);
    --past-bg:      #dce7e8;
    --scroll-thumb: #bccfd2;
    --shadow:       0 2px 8px rgba(36, 70, 75, 0.14);
    --c-blue:   #3b6fd6;
    --c-green:  #5f8a1c;
    --c-grey:   #6a737d;
    --c-orange: #c9532b;
    --c-pink:   #c2407c;
    --c-purple: #8e44c4;
    --c-red:    #d73a49;
    --c-yellow: #a66f00;
    --r-com:   #4f8f82;
    --r-const: #5e65d9;
    --r-fg:    #1b4d42;
    --r-fn:    #c43d00;
    --r-kw:    #2d68e9;
    --r-num:   #5e65d9;
    --r-op:    #077a76;
    --r-str:   #1f7a45;
  }

  /* Text size in a note */
  .size-s { --fs: 14px; }
  .size-m { --fs: 16px; }
  .size-l { --fs: 18px; }

  #app {
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #content { flex: 1; overflow-y: auto; }

  /* ---- Gallery ---- */
  #gallery {
    margin: 0 auto;
    padding: 24px 24px 60px;
    transition: max-width 0.25s ease;
  }
  /* Widths match every page: 672px of content, wide halfway to full */
  .width-normal #gallery { max-width: 720px; }
  .width-wide #gallery { max-width: calc(50% + 360px); }
  .width-full #gallery { max-width: 100%; }

  /* Preview panel sizes */
  .cards-s { --card-h: 130px; --card-min: 170px; }
  .cards-m { --card-h: 165px; --card-min: 215px; }
  .cards-l { --card-h: 200px; --card-min: 260px; }

  #search {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg);
    font-size: 15px;
    margin-bottom: 28px;
    outline: none;
    padding: 7px 10px;
    width: 100%;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--fg-muted); opacity: 0.7; }

  .grid {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
  }
  .rule {
    border: none;
    border-top: 1px solid var(--border);
    margin: 32px 0;
  }
  .empty-msg { color: var(--fg-muted); font-size: 14px; }

  /* Note panels, coloured like past months in the year view */
  .card {
    background: var(--past-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: var(--shadow);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    height: var(--card-h);
    overflow: hidden;
    position: relative;
    transition: border-color 0.15s, opacity 0.15s;
  }
  .card:hover { border-color: var(--accent); }
  .card-title {
    background: var(--head-tint);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    padding: 7px 34px 7px 10px;
  }
  .card-name {
    color: var(--fg);
    font-size: 16px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card-name.untitled { color: var(--fg-muted); font-weight: 400; }
  .card-name svg { margin-right: 5px; vertical-align: -1px; }
  .card-date { color: var(--accent); font-size: 12px; margin-top: 1px; }
  .card-preview {
    color: var(--fg-muted);
    flex: 1;
    font-size: 13px;
    line-height: 1.55;
    -webkit-mask-image: linear-gradient(#000 70%, transparent);
    mask-image: linear-gradient(#000 70%, transparent);
    overflow: hidden;
    padding: 8px 10px;
  }
  .pv-line {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pv-line.pv-head { color: var(--fg); font-weight: 600; }
  .pv-line.pv-done { text-decoration: line-through; }
  .pv-line.pv-code { font-family: 'Ubuntu Mono', 'Consolas', monospace; }
  .pv-line.pv-toggle { color: var(--accent); }
  .pv-line hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 10px 0;
  }
  .card.trashed { opacity: 0.6; }
  .card.trashed:hover { opacity: 1; }

  /* Card tints */
  .card.tint-blue {
    background: color-mix(in srgb, var(--c-blue) 16%, var(--bg));
  }
  .card.tint-green {
    background: color-mix(in srgb, var(--c-green) 16%, var(--bg));
  }
  .card.tint-grey {
    background: color-mix(in srgb, var(--c-grey) 16%, var(--bg));
  }
  .card.tint-orange {
    background: color-mix(in srgb, var(--c-orange) 16%, var(--bg));
  }
  .card.tint-pink {
    background: color-mix(in srgb, var(--c-pink) 16%, var(--bg));
  }
  .card.tint-purple {
    background: color-mix(in srgb, var(--c-purple) 16%, var(--bg));
  }
  .card.tint-red {
    background: color-mix(in srgb, var(--c-red) 16%, var(--bg));
  }
  .card.tint-yellow {
    background: color-mix(in srgb, var(--c-yellow) 16%, var(--bg));
  }

  .more-btn {
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--fg-muted);
    cursor: pointer;
    font-size: 16px;
    height: 24px;
    line-height: 1;
    opacity: 0;
    position: absolute;
    right: 6px;
    top: 6px;
    transition: opacity 0.15s;
    width: 26px;
  }
  .card:hover .more-btn, .more-btn:focus-visible { opacity: 0.8; }
  .more-btn:hover { background: var(--hover); opacity: 1; }

  /* Folders: shaped like a folder, with a tab at the top left, and the
     icon, name and count inside. Solid colours let the tab cover the
     body's top edge */
  .folder-card {
    align-items: center;
    background: linear-gradient(var(--past-bg), var(--past-bg)), var(--bg);
    border-top-left-radius: 0;
    flex-direction: row;
    gap: 10px;
    height: auto;
    margin-top: 10px;
    min-height: 60px;
    overflow: visible;
    padding: 8px 34px 8px 12px;
  }
  .folder-card:not(.new-card)::before {
    background: inherit;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 6px 8px 0 0;
    content: '';
    height: 11px;
    left: -1px;
    position: absolute;
    top: -11px;
    transition: border-color 0.15s;
    width: 42%;
  }
  .folder-card:not(.new-card)::after {
    background: inherit;
    content: '';
    height: 2px;
    left: 0;
    position: absolute;
    top: -1px;
    width: calc(42% - 2px);
  }
  .folder-card:hover::before, .folder-card.open::before {
    border-color: var(--accent);
  }
  .new-card.folder-card { border-top-left-radius: 6px; }
  .folder-card .more-btn { top: 50%; transform: translateY(-50%); }
  .folder-icon { color: var(--accent); flex-shrink: 0; }
  .folder-text { min-width: 0; }
  .folder-name {
    font-size: 15px;
    font-weight: 600;
    outline: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .folder-name[contenteditable="true"] {
    caret-color: var(--accent);
    color: var(--accent);
    cursor: text;
    text-overflow: clip;
  }
  .folder-count { color: var(--fg-muted); font-size: 12px; }
  .folder-card.open { border-color: var(--accent); }

  /* Dashed cards add a note or folder */
  .new-card {
    align-items: center;
    background: none;
    border: 1.5px dashed var(--border);
    box-shadow: none;
    color: var(--fg-muted);
    font-size: 15px;
    justify-content: center;
  }
  .new-card:hover { border-color: var(--accent); color: var(--accent); }
  .new-card.folder-card { justify-content: center; padding: 8px 12px; }

  /* An open folder spreads across the row below its card */
  /* An open folder's notes slide open on the row below it */
  .panel {
    display: grid;
    grid-column: 1 / -1;
    grid-template-rows: 0fr;
    margin-top: -12px;
    transition: grid-template-rows 0.25s ease, margin-top 0.25s ease;
  }
  .panel.shown { grid-template-rows: 1fr; margin-top: 0; }
  .panel-inner { min-height: 0; overflow: hidden; }
  .panel.settled .panel-inner { overflow: visible; }
  .panel-inner > .grid + .grid { margin-top: 12px; }
  .panel-inner > .empty-msg { margin: 2px 2px 10px; }
  .panel.drop-into {
    border-radius: 6px;
    box-shadow: 0 0 0 1px var(--accent);
  }

  /* Icons a folder can wear */
  .folder-icon { color: var(--accent); display: flex; flex-shrink: 0; }
  .folder-icon svg { height: 22px; width: 22px; }
  .icon-grid {
    display: grid;
    gap: 3px;
    grid-template-columns: repeat(8, 28px);
    padding: 4px 8px 6px;
  }
  .icon-grid button {
    align-items: center;
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    color: var(--fg);
    cursor: pointer;
    display: flex;
    height: 28px;
    justify-content: center;
  }
  .icon-grid button svg { height: 18px; width: 18px; }
  .icon-grid button:hover { background: var(--hover); }
  .icon-grid button.active {
    border-color: var(--accent);
    color: var(--accent);
  }
  .panel-head {
    color: var(--accent);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
    user-select: none;
  }
  .panel-head .arrow { display: inline-block; font-size: 11px; width: 16px; }
  .panel .rule { margin: 12px 0; }
  .panel-actions { margin-top: 12px; }
  .text-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--fg-muted);
    cursor: pointer;
    font-size: 13px;
    padding: 3px 9px;
  }
  .text-btn:hover { border-color: var(--accent); color: var(--fg); }
  .text-btn.armed { border-color: var(--c-red); color: var(--c-red); }

  /* Dragging in the gallery */
  .card.dragging { opacity: 0.35; }
  .drop-into {
    background: var(--drag-bg) !important;
    border-color: var(--accent) !important;
  }
  .drop-before { box-shadow: inset 3px 0 0 var(--accent); }
  .drop-after { box-shadow: inset -3px 0 0 var(--accent); }

  /* ---- Note: one large past-month panel ---- */
  .sheet {
    background: var(--past-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: var(--shadow);
    position: relative;
    display: flex;
    flex-direction: column;
    font-size: var(--fs);
    margin: 24px auto 60px;
    min-height: calc(100% - 84px);
    transition: max-width 0.25s ease;
    width: calc(100% - 48px);
  }
  .width-normal .sheet { max-width: 672px; }
  .width-wide .sheet { max-width: calc(50% + 312px); }
  .width-full .sheet { max-width: 100%; }

  .note-head {
    background: var(--head-tint);
    border-bottom: 1px solid var(--border);
    border-radius: 6px 6px 0 0;
    padding: 24px 56px 28px 72px;
  }
  .sheet.back-above { margin-top: 34px; }

  /* Breadcrumb back to the gallery: left of the panel, or above it if
     there's no room */
  .crumbs {
    color: var(--fg-muted);
    display: flex;
    font-size: 13px;
    gap: 5px;
    position: absolute;
    right: calc(100% + 28px);
    top: 2px;
    white-space: nowrap;
  }
  .sheet.back-above .crumbs { left: 2px; right: auto; top: -22px; }
  .crumbs a {
    color: var(--fg-muted);
    cursor: pointer;
    text-decoration: none;
  }
  .crumbs a:first-child { text-transform: lowercase; }
  .crumbs a:hover { color: var(--accent); }
  .crumbs .sep { opacity: 0.5; }

  /* Last edited, pin and word count: dim details */
  .edited { color: var(--fg-muted); font-size: 13px; opacity: 0.7; }
  .pin-toggle {
    align-items: center;
    background: none;
    border: none;
    border-radius: 3px;
    color: var(--fg-muted);
    cursor: pointer;
    display: inline-flex;
    font-size: 13px;
    gap: 4px;
    opacity: 0.55;
    padding: 0 4px;
    text-transform: lowercase;
    transition: opacity 0.15s;
  }
  .pin-toggle:hover { background: var(--hover); opacity: 1; }
  .pin-toggle.on { color: var(--accent); opacity: 0.9; }
  .word-count {
    bottom: 12px;
    color: var(--fg-muted);
    font-size: 12px;
    opacity: 0.6;
    position: absolute;
    right: 18px;
  }

  /* Trash: a floating button at the bottom right */
  #trash-fab {
    align-items: center;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    bottom: 16px;
    box-shadow: var(--shadow);
    color: var(--fg-muted);
    cursor: pointer;
    display: flex;
    height: 44px;
    justify-content: center;
    position: fixed;
    right: 16px;
    transition: border-color 0.15s, color 0.15s;
    width: 44px;
    z-index: 950;
  }
  #trash-fab:hover, #trash-fab.open { border-color: var(--accent);
    color: var(--accent); }
  #trash-fab.drop-into { background: var(--drag-bg); }
  #trash-fab .badge {
    background: var(--accent);
    border-radius: 8px;
    color: var(--bg);
    font-size: 10px;
    font-weight: 700;
    line-height: 16px;
    min-width: 16px;
    padding: 0 4px;
    position: absolute;
    right: -5px;
    text-align: center;
    top: -5px;
  }
  #trash-pop {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    bottom: 70px;
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.3);
    max-height: 60vh;
    overflow-y: auto;
    padding: 10px 12px 12px;
    position: fixed;
    right: 16px;
    width: min(720px, calc(100vw - 110px));
    z-index: 960;
  }
  #trash-pop .panel-head { cursor: default; }
  .sort-bar {
    color: var(--fg-muted);
    display: flex;
    font-size: 12px;
    gap: 4px;
    justify-content: flex-end;
    margin: -8px 0 10px;
    text-transform: lowercase;
  }
  .sort-bar button {
    background: none;
    border: none;
    border-radius: 3px;
    color: var(--fg-muted);
    cursor: pointer;
    font-size: 12px;
    opacity: 0.75;
    padding: 1px 5px;
  }
  .sort-bar button:hover { opacity: 1; }
  .sort-bar button.on { color: var(--accent); opacity: 1; }
  #title {
    color: var(--fg);
    font-size: calc(var(--fs) * 2.25);
    font-weight: 700;
    line-height: 1.2;
    outline: none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #title:empty::before {
    color: var(--fg-muted);
    content: 'untitled';
    opacity: 0.6;
  }
  #date {
    border-radius: 3px;
    color: var(--accent);
    cursor: pointer;
    display: inline-block;
    font-size: 14px;
    margin-left: -3px;
    outline: none;
    padding: 0 3px;
  }

  /* Date and tags share a line, with more room below the title */
  .meta-row {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 20px;
  }
  .tag-chip {
    align-items: center;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border-radius: 3px;
    color: var(--accent);
    display: inline-flex;
    font-size: 13px;
    gap: 2px;
    line-height: 1.5;
    padding: 0 5px;
  }
  .tag-chip button {
    background: none;
    border: none;
    color: inherit;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    opacity: 0.6;
    padding: 0 0 0 2px;
  }
  .tag-chip button:hover { opacity: 1; }
  .add-tag {
    background: none;
    border: none;
    border-radius: 3px;
    color: var(--fg-muted);
    cursor: pointer;
    font-size: 13px;
    opacity: 0.55;
    padding: 0 4px;
    text-transform: lowercase;
    transition: opacity 0.15s;
  }
  .add-tag:hover { background: var(--hover); opacity: 1; }
  /* Fields are typed in place, in teal, without a box */
  .tag-input {
    background: none;
    border: none;
    caret-color: var(--accent);
    color: var(--accent);
    field-sizing: content;
    font: inherit;
    font-size: 13px;
    min-width: 6ch;
    outline: none;
    padding: 0 4px;
  }
  .tag-input::placeholder { color: var(--accent); opacity: 0.45; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .card-tags .tag-chip { cursor: pointer; font-size: 11px; padding: 0 4px; }
  .card-tags .tag-chip:hover {
    background: color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .filter-bar {
    align-items: center;
    color: var(--fg-muted);
    display: flex;
    font-size: 13px;
    gap: 6px;
    margin: -4px 0 14px;
  }
  #date:hover { background: var(--hover); }
  #date[contenteditable="true"] {
    background: none;
    caret-color: var(--accent);
    color: var(--accent);
    cursor: text;
  }
  #date.invalid { color: var(--c-red); }
  .note-body { flex: 1; padding: 20px 56px 120px 72px; }

  /* ---- Blocks: Notion-like spacing ---- */
  #blocks { --unit: 1.625em; line-height: 1.5; position: relative; }
  .block {
    --lh: 1.5em;
    align-items: flex-start;
    display: flex;
    margin-top: 1px;
    padding: 3px 0 3px calc(var(--indent, 0) * var(--unit));
    position: relative;
  }
  .block.hidden { display: none; }
  .block.type-h1 { --lh: 2.4375em; margin-top: 1.1em; }
  .block.type-h2 { --lh: 1.95em; margin-top: 0.8em; }
  .block.type-h3 { --lh: 1.625em; margin-top: 0.5em; }
  .block:first-child { margin-top: 0; }

  .content {
    caret-color: var(--fg);
    flex: 1;
    min-height: 1.5em;
    min-width: 0;
    outline: none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .type-h1 .content, .type-h2 .content, .type-h3 .content {
    line-height: 1.3;
    min-height: 0;
  }
  .type-h1 .content { font-size: 1.875em; font-weight: 700; }
  .type-h2 .content { font-size: 1.5em; font-weight: 600; }
  .type-h3 .content { font-size: 1.25em; font-weight: 600; }
  .content:empty::before {
    color: var(--fg-muted);
    content: attr(data-ph);
    opacity: 0.55;
    pointer-events: none;
  }
  .type-text .content:empty:not(:focus)::before { content: none; }
  .type-todo.checked .content {
    color: var(--fg-muted);
    text-decoration: line-through;
  }

  /* Inline formatting */
  .content code {
    background: var(--code-bg);
    border-radius: 4px;
    color: var(--code-fg);
    font-family: 'Ubuntu Mono', 'Consolas', 'Menlo', monospace;
    font-size: 0.9em;
    padding: 1px 4px;
  }
  .content mark {
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border-radius: 2px;
    color: inherit;
    padding: 0 1px;
  }
  .content a {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .date-token { color: var(--accent); }
  .tag-token {
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border-radius: 3px;
    color: var(--accent);
  }

  /* Bullet, number, checkbox, arrow or icon before the text */
  .marker {
    align-items: center;
    color: var(--fg);
    display: flex;
    flex: 0 0 var(--unit);
    height: 1.5em;
    justify-content: center;
    user-select: none;
  }
  .bullet { font-size: 1.4em; line-height: 1; }
  .type-number .marker {
    font-variant-numeric: tabular-nums;
    justify-content: flex-end;
    padding-right: 6px;
  }
  .marker input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: 2px solid var(--accent);
    border-radius: 3px;
    cursor: pointer;
    height: 16px;
    position: relative;
    width: 16px;
  }
  .marker input[type="checkbox"]:checked { background: var(--accent); }
  .marker input[type="checkbox"]:checked::after {
    border: solid var(--bg);
    border-width: 0 2px 2px 0;
    content: '';
    height: 8px;
    left: 3px;
    position: absolute;
    top: 0;
    transform: rotate(45deg);
    width: 4px;
  }

  /* Toggles match the dates view: a 14px teal arrow and teal text */
  .toggle-arrow {
    color: var(--accent);
    cursor: pointer;
    display: inline-block;
    font-size: 14px;
    line-height: 1;
    text-align: center;
    transition: transform 0.2s ease;
    width: 14px;
  }
  .type-toggle:not(.open) .toggle-arrow { transform: rotate(-90deg); }

  /* A toggle with nothing in it has a dim arrow */
  .type-toggle.empty .toggle-arrow { opacity: 0.35; }

  /* A toggle's contents slide in as it opens, and out as it closes */
  @keyframes block-in {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes block-out {
    to { opacity: 0; transform: translateY(-6px); }
  }
  .block.reveal { animation: block-in 0.22s ease both; }
  .block.conceal { animation: block-out 0.15s ease both; }

  /* Dropping onto a toggle puts the blocks inside it */
  .block.into-toggle > .content {
    background: var(--drag-bg);
    border-radius: 4px;
    box-shadow: 0 0 0 1px var(--accent);
  }
  .type-toggle > .content { color: var(--accent); }

  /* Quote, callout and code */
  .type-quote > .content {
    border-left: 3px solid var(--fg);
    padding-left: 14px;
  }
  .type-callout {
    background: var(--code-bg);
    border-radius: 6px;
    margin-top: 4px;
    padding-bottom: 12px;
    padding-top: 12px;
  }
  .type-callout > .marker { flex-basis: calc(var(--unit) + 14px); }
  .type-callout > .content { padding-right: 14px; }
  .type-code > .content {
    background: var(--code-block);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--r-fg);
    font-family: 'Ubuntu Mono', 'Consolas', 'Menlo', monospace;
    font-size: 0.9em;
    line-height: 1.55;
    overflow-x: auto;
    padding: 12px 14px;
    tab-size: 2;
    white-space: pre;
    word-break: normal;
  }
  .type-code > .content:empty::before { font-family: inherit; }
  .r-com { color: var(--r-com); font-style: italic; }
  .r-const { color: var(--r-const); }
  .r-fn { color: var(--r-fn); }
  .r-kw { color: var(--r-kw); }
  .r-num { color: var(--r-num); }
  .r-op { color: var(--r-op); }
  .r-str { color: var(--r-str); }
  .r-p0 { color: #ed909a; }
  .r-p1 { color: #d3a25e; }
  .r-p2 { color: #99b657; }
  .r-p3 { color: #2dc192; }
  .r-p4 { color: #04bdce; }
  .r-p5 { color: #8ea9ec; }
  .r-p6 { color: #d891db; }

  /* Simple tables */
  .type-table > .handle { left: calc(var(--indent, 0) * var(--unit) - 34px); }
  .tbl-wrap {
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    margin: -10px -22px -22px -10px;
    padding: 10px 22px 22px 10px;
  }
  .tbl-area { display: inline-block; position: relative; }
  .ntable {
    border-collapse: collapse;
    table-layout: fixed;
    width: max-content;
  }
  .ntable td {
    border: 1px solid var(--border);
    padding: 0;
    position: relative;
    vertical-align: top;
  }
  .ntable .cell {
    caret-color: var(--fg);
    min-height: 1.5em;
    outline: none;
    padding: 5px 8px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .ntable td:focus-within { box-shadow: inset 0 0 0 1px var(--accent); }
  /* Header tint sits over any row, column or cell colour */
  .ntable.head-row tr:first-of-type td,
  .ntable.head-col td:first-child {
    background-image: linear-gradient(
      color-mix(in srgb, var(--fg) 6%, transparent),
      color-mix(in srgb, var(--fg) 6%, transparent));
    font-weight: 600;
  }
  .ntable .cell code {
    background: var(--code-bg);
    border-radius: 4px;
    color: var(--code-fg);
    font-family: 'Ubuntu Mono', 'Consolas', 'Menlo', monospace;
    padding: 1px 4px;
  }
  .ntable .cell mark { background: var(--mark-bg); color: inherit; }
  .ntable .cell a { color: var(--accent); }
  .ntable .bg-blue {
    background-color: color-mix(in srgb, var(--c-blue) 18%, transparent);
  }
  .ntable .bg-green {
    background-color: color-mix(in srgb, var(--c-green) 18%, transparent);
  }
  .ntable .bg-grey {
    background-color: color-mix(in srgb, var(--c-grey) 18%, transparent);
  }
  .ntable .bg-orange {
    background-color: color-mix(in srgb, var(--c-orange) 18%, transparent);
  }
  .ntable .bg-pink {
    background-color: color-mix(in srgb, var(--c-pink) 18%, transparent);
  }
  .ntable .bg-purple {
    background-color: color-mix(in srgb, var(--c-purple) 18%, transparent);
  }
  .ntable .bg-red {
    background-color: color-mix(in srgb, var(--c-red) 18%, transparent);
  }
  .ntable .bg-yellow {
    background-color: color-mix(in srgb, var(--c-yellow) 18%, transparent);
  }

  /* Row and column grips sit on the table's edges, shown on hover */
  .row-grip, .col-grip {
    align-items: center;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--fg-muted);
    cursor: pointer;
    display: flex;
    justify-content: center;
    opacity: 0;
    position: absolute;
    transition: opacity 0.15s;
    z-index: 3;
  }
  .row-grip { height: 20px; left: -8px; top: 50%; transform: translateY(-50%);
    width: 14px; }
  .col-grip { height: 14px; left: 50%; top: -8px; transform: translateX(-50%);
    width: 20px; }
  .row-grip svg, .col-grip svg { fill: currentColor; }
  .ntable tr:hover .row-grip, .col-grip.show { opacity: 1; }
  .row-grip:hover, .col-grip:hover { border-color: var(--accent);
    color: var(--accent); }
  .col-resize {
    bottom: 0;
    cursor: col-resize;
    position: absolute;
    right: -4px;
    top: 0;
    width: 7px;
    z-index: 2;
  }
  .col-resize:hover, .col-resize.on { background: var(--accent); opacity: 0.5; }
  .add-row-bar, .add-col-bar {
    align-items: center;
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--fg-muted);
    cursor: pointer;
    display: flex;
    font-size: 14px;
    justify-content: center;
    opacity: 0;
    position: absolute;
    transition: opacity 0.15s, background 0.15s;
  }
  .add-row-bar { bottom: -20px; height: 16px; left: 0; right: 0; }
  .add-col-bar { bottom: 0; right: -20px; top: 0; width: 16px; }
  .type-table:hover .add-row-bar, .type-table:hover .add-col-bar {
    opacity: 0.6;
  }
  .add-row-bar:hover, .add-col-bar:hover { background: var(--hover);
    opacity: 1 !important; }
  .type-table { padding-bottom: 24px; }

  /* Horizontal line */
  .type-divider { align-items: center; height: calc(1.5em + 6px); }
  .type-divider hr {
    border: none;
    border-top: 1px solid var(--fg-muted);
    flex: 1;
    opacity: 0.6;
  }

  /* Text colours */
  .c-blue > .content   { color: var(--c-blue); }
  .c-green > .content  { color: var(--c-green); }
  .c-grey > .content   { color: var(--c-grey); }
  .c-orange > .content { color: var(--c-orange); }
  .c-pink > .content   { color: var(--c-pink); }
  .c-purple > .content { color: var(--c-purple); }
  .c-red > .content    { color: var(--c-red); }
  .c-yellow > .content { color: var(--c-yellow); }

  /* Six-dot handle: drag to move, click for the block menu */
  .handle {
    align-items: center;
    border-radius: 4px;
    color: var(--fg-muted);
    cursor: grab;
    display: flex;
    height: 22px;
    justify-content: center;
    left: calc(var(--indent, 0) * var(--unit) - 24px);
    opacity: 0;
    position: absolute;
    top: calc(3px + (var(--lh) - 22px) / 2);
    touch-action: none;
    transition: opacity 0.15s;
    width: 18px;
  }
  .handle svg { fill: currentColor; }
  .block:hover > .handle { opacity: 0.6; }

  /* Focus on a to do: a target to the right, shown on hover */
  .block > .focus-btn {
    align-items: center;
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    display: flex;
    height: 22px;
    justify-content: center;
    opacity: 0;
    padding: 0;
    position: absolute;
    right: -32px;
    top: calc(3px + (var(--lh) - 22px) / 2);
    transition: opacity 0.15s;
    width: 22px;
  }
  .block > .focus-btn svg { height: 17px; width: 17px; }
  .block:hover > .focus-btn, .block:focus-within > .focus-btn {
    opacity: 0.6;
  }
  .block > .focus-btn:hover { opacity: 1; }
  .block > .handle:hover { background: var(--hover); opacity: 1; }
  .type-callout > .handle { top: calc(12px + (1.5em - 22px) / 2); }
  .type-code > .handle { top: 12px; }
  .type-divider > .handle { top: calc((1.5em + 6px - 22px) / 2); }

  /* Selected blocks */
  .block.selected::after {
    background: var(--block-sel);
    border-radius: 4px;
    bottom: 0;
    content: '';
    left: calc(var(--indent, 0) * var(--unit) - 4px);
    pointer-events: none;
    position: absolute;
    right: -4px;
    top: 0;
  }
  .block.dragging { opacity: 0.3; }
  #drop-line {
    background: var(--accent);
    border-radius: 1px;
    display: none;
    height: 3px;
    pointer-events: none;
    position: absolute;
    right: 0;
    z-index: 5;
  }
  body.dragging-block, body.dragging-block * { cursor: grabbing !important; }

  /* ---- Floating menus ---- */
  .menu, #fmt {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    color: var(--fg);
    position: fixed;
    z-index: 1000;
  }
  .menu {
    font-size: 14px;
    max-height: 70vh;
    min-width: 190px;
    overflow-y: auto;
    padding: 4px;
  }
  .menu-label {
    color: var(--fg-muted);
    font-size: 12px;
    padding: 6px 8px 2px;
  }
  .menu-item {
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--fg);
    cursor: pointer;
    display: block;
    font-size: 14px;
    padding: 5px 8px;
    text-align: left;
    width: 100%;
  }
  .menu-item:hover, .menu-item.hl { background: var(--hover); }
  .menu-item.active { color: var(--accent); }
  .menu-item.danger { color: var(--c-red); }
  .menu-rule { border-top: 1px solid var(--border); margin: 4px 0; }
  .swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 4px 8px 6px;
  }
  .swatch {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    height: 24px;
    width: 24px;
  }
  .swatch:hover, .swatch.active { border-color: var(--accent); }
  .linkbox { min-width: 280px; padding: 6px; }
  .linkbox input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--fg);
    font-size: 14px;
    outline: none;
    padding: 5px 8px;
    width: 100%;
  }
  .linkbox input:focus { border-color: var(--accent); }

  #fmt { display: none; gap: 2px; padding: 3px; }
  #fmt.show { display: flex; }
  #fmt button {
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--fg);
    cursor: pointer;
    font-size: 14px;
    height: 28px;
    min-width: 30px;
  }
  #fmt button:hover { background: var(--hover); }
  #fmt button.on { color: var(--accent); }
  #fmt .f-code { font-family: 'Ubuntu Mono', 'Consolas', monospace; }
  #fmt .f-mark span {
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    padding: 0 3px;
  }

  /* Highlights in the block colours */
  mark[data-c="grey"] { background: color-mix(in srgb, var(--c-grey) 28%, transparent) !important; }
  mark[data-c="red"] { background: color-mix(in srgb, var(--c-red) 28%, transparent) !important; }
  mark[data-c="orange"] { background: color-mix(in srgb, var(--c-orange) 28%, transparent) !important; }
  mark[data-c="yellow"] { background: color-mix(in srgb, var(--c-yellow) 30%, transparent) !important; }
  mark[data-c="green"] { background: color-mix(in srgb, var(--c-green) 28%, transparent) !important; }
  mark[data-c="blue"] { background: color-mix(in srgb, var(--c-blue) 28%, transparent) !important; }
  mark[data-c="purple"] { background: color-mix(in srgb, var(--c-purple) 28%, transparent) !important; }
  mark[data-c="pink"] { background: color-mix(in srgb, var(--c-pink) 28%, transparent) !important; }
  #fmt .f-markc { font-size: 10px; padding-left: 2px; padding-right: 4px; }

  /* Menu items with a teal symbol column, names lined up, and a dim
     shortcut on the right */
  .menu-item.sym {
    align-items: center;
    display: grid;
    gap: 6px;
    grid-template-columns: 30px 1fr auto;
  }
  .menu-item .m-sym {
    color: var(--accent);
    display: flex;
    font-size: 13px;
    justify-content: flex-start;
    white-space: nowrap;
  }
  .menu-item .m-hint {
    color: var(--fg-muted);
    font-family: 'Ubuntu Mono', 'Consolas', monospace;
    font-size: 12px;
    opacity: 0.7;
    padding-left: 12px;
    white-space: pre;
  }
  .sym-box {
    border: 1.5px solid var(--accent);
    border-radius: 3px;
    display: inline-block;
    height: 12px;
    width: 12px;
  }
  .menu-item:focus-visible { background: var(--hover); outline: none; }
  .menu .note-pick { padding: 4px 4px 6px; }
  .menu .note-pick input {
    background: none;
    border: none;
    caret-color: var(--accent);
    color: var(--accent);
    font: inherit;
    outline: none;
    padding: 4px 6px;
    width: 100%;
  }

  /* Lowercase interface labels; your own text is left as typed */
  .menu, .new-card, #fmt, .text-btn, .empty-msg {
    text-transform: lowercase;
  }

  /* Brief colour fade while the mode changes */
  .theme-anim, .theme-anim * {
    transition: background-color 0.25s ease, border-color 0.25s ease,
      color 0.25s ease !important;
  }

  /* Views fade and rise in slightly when you switch */
  @keyframes view-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  .view-in { animation: view-in 0.22s ease; }

  /* ---- Scrollbars in the mode's colours ---- */
  #app { scrollbar-color: var(--scroll-thumb) transparent; }
  #app ::-webkit-scrollbar { height: 10px; width: 10px; }
  #app ::-webkit-scrollbar-track { background: transparent; }
  #app ::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb);
    background-clip: content-box;
    border: 2px solid transparent;
    border-radius: 5px;
  }

  .gone { display: none !important; }
</style>
</head>
<body>
<div id="app" class="t-dark size-m width-normal">
  <div id="content">
    <div id="gallery" class="gone">
      <input id="search" type="search" placeholder="search notes"
        autocomplete="off" spellcheck="false">
      <div id="gallery-body"></div>
    </div>
    <div id="note" class="sheet gone">
      <div class="note-head">
        <nav class="crumbs" aria-label="breadcrumb"></nav>
        <div id="title" contenteditable="true" spellcheck="true"></div>
        <div class="meta-row">
          <span id="date" title="click to change the date"></span>
          <span class="edited"></span>
          <span id="tags"></span>
          <button class="add-tag" type="button">+ tag</button>
          <button class="pin-toggle" type="button"></button>
        </div>
      </div>
      <div class="note-body">
        <div id="blocks"><div id="drop-line"></div></div>
        <div class="word-count"></div>
      </div>
    </div>
  </div>

  <button id="trash-fab" class="gone" type="button" aria-label="trash"
    title="trash: drop notes here, click to open"></button>

  <!-- Shown when text is selected -->
  <div id="fmt">
    <button type="button" data-cmd="bold"
      title="bold (ctrl+b)"><b>B</b></button>
    <button type="button" data-cmd="italic"
      title="italic (ctrl+i)"><i>I</i></button>
    <button type="button" data-cmd="s"
      title="strikethrough (ctrl+shift+s)"><s>S</s></button>
    <button type="button" data-cmd="code" class="f-code"
      title="code (ctrl+e)">&lt;/&gt;</button>
    <button type="button" data-cmd="mark" class="f-mark"
      title="highlight (ctrl+shift+h)"><span>H</span></button>
    <button type="button" data-cmd="markc" class="f-markc"
      title="highlight colour">▾</button>
    <button type="button" data-cmd="link"
      title="link (ctrl+k)">link</button>
  </div>
</div>

<script src="../sync.js"></script>
<script src="../sidebar.js"></script>
<script>
  const CARD_KEY  = "notes-card-size";
  const DATA_KEY  = "notes-data";
  const OPEN_KEY  = "notes-open-folders";
  const SCROLL_KEY = "notes-scroll";
  const SIZE_KEY  = "notes-size";
  const SORT_KEY  = "notes-sort";
  const WIDTH_KEY = "notes-width";
  const TRASH_DAYS = 30;

  const app      = document.getElementById("app");
  const blocksEl = document.getElementById("blocks");
  const content  = document.getElementById("content");
  const dateEl   = document.getElementById("date");
  const dropLine = document.getElementById("drop-line");
  const fmt      = document.getElementById("fmt");
  const gallery  = document.getElementById("gallery");
  const galBody  = document.getElementById("gallery-body");
  const noteEl   = document.getElementById("note");
  const searchEl = document.getElementById("search");
  const tagsEl   = document.getElementById("tags");
  const titleEl  = document.getElementById("title");
  const trashFab = document.getElementById("trash-fab");
  const crumbsEl = noteEl.querySelector(".crumbs");
  const editedEl = noteEl.querySelector(".edited");
  const wordsEl  = noteEl.querySelector(".word-count");
  const pinBtn   = noteEl.querySelector(".pin-toggle");

  const TYPES = {
    text:    "text",
    h1:      "heading 1",
    h2:      "heading 2",
    h3:      "heading 3",
    bullet:  "bulleted list",
    number:  "numbered list",
    toggle:  "toggle",
    todo:    "to do",
    quote:   "quote",
    callout: "callout",
    code:    "code",
    table:   "table",
    divider: "divider"
  };

  // Each type's teal symbol in the menus, and the shortcut that makes it
  const TABLE_SYM = '<svg viewBox="0 0 16 16" width="14" height="14" '
    + 'fill="none" stroke="currentColor" stroke-width="1.4">'
    + '<rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/>'
    + '<path d="M1.5 6.5h13M1.5 10h13M6 6.5v7"/></svg>';
  const TODO_SYM = '<span class="sym-box"></span>';
  const TYPE_SYMS = {
    text: "", h1: "#", h2: "##", h3: "###", bullet: "•", number: "1.",
    toggle: "▶", todo: TODO_SYM, quote: "|", callout: "&gt;",
    code: "&lt;/&gt;", table: TABLE_SYM, divider: "—"
  };
  const TYPE_HINTS = {
    text: "", h1: "# ", h2: "## ", h3: "### ", bullet: "- ", number: "1. ",
    toggle: "&gt; ", todo: "[] ", quote: "\" ", callout: "/callout",
    code: "```", table: "/tab", divider: "---"
  };

  // Extra words the / menu matches
  const ALIASES = {
    bullet: ["bullet", "list", "ul"], callout: ["note", "tip", "box"],
    code: ["code", "r", "block"], divider: ["line", "hr", "---"],
    h1: ["h1", "title"], h2: ["h2", "subheading"], h3: ["h3"],
    number: ["number", "ol", "1."], quote: ["quote", "blockquote"],
    table: ["tab", "table", "grid"],
    text: ["text", "plain", "paragraph"],
    todo: ["to", "todo", "to do", "check", "box", "task"],
    toggle: ["tog", "toggle", "collapse"]
  };
  const COLOURS = ["grey", "red", "orange", "yellow", "green", "blue",
    "purple", "pink"];
  const LIST_TYPES = ["bullet", "number", "todo", "toggle"];
  const PLACEHOLDER = {
    bullet: "list", callout: "callout", code: "r code", h1: "heading 1",
    h2: "heading 2", h3: "heading 3", number: "list", quote: "quote",
    text: "type / for blocks", todo: "to do", toggle: "toggle"
  };
  const GRIP = '<svg width="10" height="14" viewBox="0 0 10 14">'
    + '<circle cx="2.5" cy="2.5" r="1.4"/><circle cx="7.5" cy="2.5" r="1.4"/>'
    + '<circle cx="2.5" cy="7" r="1.4"/><circle cx="7.5" cy="7" r="1.4"/>'
    + '<circle cx="2.5" cy="11.5" r="1.4"/>'
    + '<circle cx="7.5" cy="11.5" r="1.4"/></svg>';
  const TRASH_ICON = '<svg class="folder-icon" width="22" height="22" '
    + 'viewBox="0 0 24 24" '
    + 'fill="none" stroke="currentColor" stroke-width="1.8" '
    + 'stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16'
    + 'M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/></svg>';
  const PIN_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" '
    + 'fill="none" stroke="currentColor" stroke-width="2.2" '
    + 'stroke-linecap="round" stroke-linejoin="round"><path d="M15 3l6 6'
    + 'M17.5 5.5L13 10l-4.5-1L6 11.5l6.5 6.5L15 15.5l-1-4.5 4.5-4.5M9 15l-5.5'
    + ' 5.5"/></svg>';
  const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MONS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug",
    "Sep", "Oct", "Nov", "Dec"];

  let notes = [], folders = [], current = null, query = "", tagFilter = "";
  let selected = new Set(), selAnchor = null;
  let openFolders = new Set();

  // ---- Helpers ----

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Only web and email links are kept
  function safeHref(href) {
    const h = String(href || "").trim();
    if (/^(https?:|mailto:)/i.test(h)) return h;
    if (/^www\./i.test(h)) return "https://" + h;
    return "";
  }

  // Keep only bold, italic, underline, strike, code, highlight, links
  // and line breaks
  function clean(html) {
    const t = document.createElement("template");
    t.innerHTML = html;
    const TAGS = { B: "b", STRONG: "b", I: "i", EM: "i", U: "u", S: "s",
      STRIKE: "s", DEL: "s", CODE: "code", MARK: "mark" };
    const walk = node => {
      let out = "";
      node.childNodes.forEach(n => {
        if (n.nodeType === 3) {
          out += escapeHtml(n.data.replace(/​/g, ""));
        } else if (n.nodeType === 1) {
          if (n.tagName === "BR") { out += "<br>"; return; }
          const inner = walk(n);
          if (!inner) return;
          if (n.tagName === "A") {
            const href = safeHref(n.getAttribute("href"));
            out += href ? '<a href="' + escapeHtml(href) + '">' + inner
              + "</a>" : inner;
            return;
          }
          const tag = TAGS[n.tagName];
          const col = tag === "mark" && COLOURS.includes(n.dataset.c)
            ? ' data-c="' + n.dataset.c + '"' : "";
          out += tag ? "<" + tag + col + ">" + inner + "</" + tag + ">"
            : inner;
        }
      });
      return out;
    };
    const out = walk(t.content);
    return out === "<br>" ? "" : out;
  }

  // Characters in a block, as the caret counts them
  function textLen(html) {
    const t = document.createElement("template");
    t.innerHTML = html;
    return t.content.textContent.length;
  }

  function plain(html) {
    const t = document.createElement("template");
    t.innerHTML = String(html).replace(/<br>/g, " ");
    return t.content.textContent;
  }

  function codeText(b) {
    const t = document.createElement("template");
    t.innerHTML = b.html;
    return t.content.textContent;
  }

  // Inline markdown in pasted text
  function inlineMarkdown(s) {
    return escapeHtml(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/~~([^~]+)~~/g, "<s>$1</s>")
      .replace(/==([^=]+)==/g, "<mark>$1</mark>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, href) => {
        const h = safeHref(href.replace(/&amp;/g, "&"));
        return h ? '<a href="' + escapeHtml(h) + '">' + text + "</a>" : text;
      })
      .replace(/(^|[^*])\*([^*\s](?:[^*]*[^*\s])?)\*/g, "$1<i>$2</i>");
  }

  // ---- Dates (as in the to-dos) ----

  const MONTH_RE = '(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?'
    + '|apr(?:il)?|may|june?|july?|aug(?:ust)?'
    + '|sep(?:t(?:ember)?)?|oct(?:ober)?'
    + '|nov(?:ember)?|dec(?:ember)?)(?![a-z])';
  const WEEKDAY_RE = '(?:mon(?:day)?|tue(?:sday)?|wed(?:nesday)?'
    + '|thu(?:rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)(?![a-z])';
  const DATE_CORE = '(?:'
    + '(?:today|tomorrow|yesterday)(?![a-z])'
    + '|(?:this|next)\\s+(?:week|month)(?![a-z])'
    + '|(?:next\\s+)?' + WEEKDAY_RE
    + '(?:\\s+\\d{1,2}\\s+' + MONTH_RE + '(?:,?\\s+\\d{4})?)?'
    + '|\\d{1,2}\\s+' + MONTH_RE + '(?:,?\\s+\\d{4})?'
    + '|' + MONTH_RE + '\\s+\\d{1,2}(?!\\d)(?:,?\\s*\\d{4})?'
    + '|\\d{1,2}[\\/\\-]\\d{1,2}(?:[\\/\\-]\\d{2,4})?'
    + '|' + MONTH_RE + '(?:\\s+\\d{4})?'
    + ')';
  const DATE_PATTERN = new RegExp(
    '@' + DATE_CORE
    + '(?:\\s*(?:–|—|-|to(?![a-z]))\\s*' + DATE_CORE + ')?',
    'gi'
  );
  const TAG_PATTERN = /(^|\s)(#[^\s#]+)/g;
  const MONTHS = MONS.map(m => m.toLowerCase());
  const WEEKDAYS = DAYS.map(d => d.toLowerCase());

  function dayStart(d) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function addDays(d, n) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  }

  function weekStart(d) {
    const day = d.getDay();
    return addDays(dayStart(d), day === 0 ? -6 : 1 - day);
  }

  function isoDay(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
      + "-" + String(d.getDate()).padStart(2, "0");
  }

  function fromIso(s) {
    const [y, m, d] = String(s).split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  // Dates the toolkit writes are lowercase: fri 30 oct 2026
  function fmtLong(d) {
    return (DAYS[d.getDay()] + " " + d.getDate() + " " + MONS[d.getMonth()]
      + " " + d.getFullYear()).toLowerCase();
  }

  // A single day typed as today, friday, 2/11, 2 nov 2026 and so on
  function parseDay(str, anchor) {
    const s = str.trim().toLowerCase().replace(/^@/, "").replace(/,/g, " ")
      .replace(/\s+/g, " ");
    const mon = name => MONTHS.indexOf(name.slice(0, 3));
    let m;
    if (s === "today") return anchor;
    if (s === "tomorrow") return addDays(anchor, 1);
    if (s === "yesterday") return addDays(anchor, -1);
    if ((m = s.match(new RegExp('^(next )?' + WEEKDAY_RE + '$')))) {
      const wd = WEEKDAYS.indexOf(s.replace("next ", "").slice(0, 3));
      if (m[1]) return addDays(addDays(weekStart(anchor), 7), (wd + 6) % 7);
      return addDays(anchor, (wd - anchor.getDay() + 7) % 7);
    }
    let day, month, year;
    const rest = s.replace(new RegExp('^' + WEEKDAY_RE + ' '), "");
    if ((m = rest.match(new RegExp(
      '^(\\d{1,2}) ' + MONTH_RE + '(?: (\\d{4}))?$')))) {
      [day, month, year] = [+m[1], mon(m[2]), m[3]];
    } else if ((m = rest.match(new RegExp(
      '^' + MONTH_RE + ' (\\d{1,2})(?: (\\d{4}))?$')))) {
      [day, month, year] = [+m[2], mon(m[1]), m[3]];
    } else if ((m = rest.match(
      /^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?$/))) {
      [day, month, year] = [+m[1], +m[2] - 1, m[3]];
    } else if ((m = rest.match(/^(\d{4})-(\d{2})-(\d{2})$/))) {
      [day, month, year] = [+m[3], +m[2] - 1, m[1]];
    } else {
      return null;
    }
    let y = year ? +year : anchor.getFullYear();
    if (y < 100) y += 2000;
    const d = new Date(y, month, day);
    if (d.getMonth() !== month || d.getDate() !== day) return null;
    return d;
  }

  function firstToken(text) {
    DATE_PATTERN.lastIndex = 0;
    const m = DATE_PATTERN.exec(text || "");
    return m ? m[0].toLowerCase() : "";
  }

  // Wrap @dates and #tags in a block's html in coloured spans
  function decorate(html) {
    if (!/[@#]/.test(html)) return html;
    const t = document.createElement("template");
    t.innerHTML = html;
    const nodes = [];
    const walker = document.createTreeWalker(t.content, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      if (!walker.currentNode.parentElement
        || !walker.currentNode.parentElement.closest("code, a")) {
        nodes.push(walker.currentNode);
      }
    }
    nodes.forEach(node => {
      const text = node.data, marks = [];
      let m;
      DATE_PATTERN.lastIndex = 0;
      while ((m = DATE_PATTERN.exec(text))) {
        marks.push([m.index, m.index + m[0].length, "date-token"]);
      }
      TAG_PATTERN.lastIndex = 0;
      while ((m = TAG_PATTERN.exec(text))) {
        const tag = m[2].replace(/[.,;:!?)\]]+$/, "");
        const start = m.index + m[1].length;
        const end = start + tag.length;
        if (tag.length > 1 && !marks.some(x => start < x[1] && end > x[0])) {
          marks.push([start, end, "tag-token"]);
        }
      }
      if (!marks.length) return;
      marks.sort((a, b) => a[0] - b[0]);
      const frag = document.createDocumentFragment();
      let last = 0;
      marks.forEach(([a, z, cls]) => {
        if (a < last) return;
        if (a > last) {
          frag.appendChild(document.createTextNode(text.slice(last, a)));
        }
        const span = document.createElement("span");
        span.className = cls;
        span.textContent = text.slice(a, z);
        frag.appendChild(span);
        last = z;
      });
      if (last < text.length) {
        frag.appendChild(document.createTextNode(text.slice(last)));
      }
      node.replaceWith(frag);
    });
    return t.innerHTML;
  }

  // ---- R highlighting for code blocks ----

  const R_KEYWORDS = new Set(["if", "else", "repeat", "while", "function",
    "for", "in", "next", "break", "return", "switch"]);
  const R_CONSTS = new Set(["TRUE", "FALSE", "NULL", "NA", "NA_integer_",
    "NA_real_", "NA_character_", "Inf", "NaN", "T", "F"]);
  const R_TOKEN = new RegExp([
    '(#[^\\n]*)',
    '("(?:[^"\\\\]|\\\\.)*"?|\'(?:[^\'\\\\]|\\\\.)*\'?|`[^`\\n]*`?)',
    '(\\d+\\.?\\d*(?:[eE][+-]?\\d+)?L?|\\.\\d+(?:[eE][+-]?\\d+)?)',
    '([A-Za-z.][\\w.]*)',
    '(<<-|->>|<-|->|%[^%\\n]*%|\\|>|==|!=|<=|>=|&&|\\|\\||[-+*/^~!&|<>=$@:?])',
    '([()\\[\\]{}])'
  ].join("|"), "g");

  function highlightR(text) {
    let out = "", last = 0, depth = 0, m;
    R_TOKEN.lastIndex = 0;
    while ((m = R_TOKEN.exec(text))) {
      out += escapeHtml(text.slice(last, m.index));
      const tok = escapeHtml(m[0]);
      let cls = "";
      if (m[1]) cls = "r-com";
      else if (m[2]) cls = "r-str";
      else if (m[3]) cls = "r-num";
      else if (m[4]) {
        if (R_KEYWORDS.has(m[4])) cls = "r-kw";
        else if (R_CONSTS.has(m[4])) cls = "r-const";
        else if (/^\s*\(/.test(text.slice(m.index + m[0].length))) {
          cls = "r-fn";
        }
      } else if (m[5]) cls = "r-op";
      else if (m[6]) {
        if ("([{".includes(m[6])) cls = "r-p" + (depth++ % 7);
        else cls = "r-p" + (((depth = Math.max(0, depth - 1)) % 7));
      }
      out += cls ? '<span class="' + cls + '">' + tok + "</span>" : tok;
      last = m.index + m[0].length;
    }
    out += escapeHtml(text.slice(last));
    return out + (text.endsWith("\n") ? "<br>" : "");
  }

  // ---- Data ----

  function normBlock(b) {
    const type = TYPES[b.type] ? b.type : "text";
    const out = {
      checked: !!b.checked,
      color: COLOURS.includes(b.color) ? b.color : null,
      html: type === "code"
        ? escapeHtml(codeText({ html: String(b.html || "") }))
        : clean(String(b.html || "")),
      id: b.id || uid(),
      indent: Math.max(0, Math.min(8, parseInt(b.indent) || 0)),
      open: b.open !== false,
      type
    };
    if (b.anchorAt) {
      out.anchorAt = b.anchorAt;
      out.anchorTok = b.anchorTok || "";
    }
    if (b.doneAt) out.doneAt = b.doneAt;
    if (type === "table") Object.assign(out, normTable(b));
    return out;
  }

  // A table's rows of cell html, kept rectangular, with its settings
  function normTable(b) {
    let rows = Array.isArray(b.rows) ? b.rows : [];
    rows = rows.filter(Array.isArray)
      .map(r => r.map(c => clean(String(c || ""))));
    if (!rows.length) rows = [["", "", ""], ["", "", ""]];
    const cols = Math.max(1, ...rows.map(r => r.length));
    rows.forEach(r => { while (r.length < cols) r.push(""); });
    const pick = (list, n) => Array.from({ length: n }, (_, i) =>
      Array.isArray(list) && COLOURS.includes(list[i]) ? list[i] : null);
    const cellColors = {};
    Object.entries(b.cellColors || {}).forEach(([k, v]) => {
      if (COLOURS.includes(v)) cellColors[k] = v;
    });
    return {
      cellColors,
      colColors: pick(b.colColors, cols),
      headCol: !!b.headCol,
      headRow: b.headRow !== false,
      rowColors: pick(b.rowColors, rows.length),
      rows,
      widths: Array.from({ length: cols }, (_, i) => {
        const w = Array.isArray(b.widths) ? parseInt(b.widths[i]) : 0;
        return w >= 60 ? Math.min(w, 900) : 160;
      })
    };
  }

  // Words in a block, as plain text
  function blockText(b) {
    if (b.type === "code") return codeText(b);
    if (b.type === "table") {
      return b.rows.map(r => r.map(c => plain(c)).join(" ")).join(" ");
    }
    return plain(b.html);
  }

  function load() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(DATA_KEY)); } catch {}
    folders = (data && Array.isArray(data.folders) ? data.folders : [])
      .filter(f => f && f.id)
      .map(f => ({ icon: ToolkitSidebar.folderIcons.includes(f.icon)
        ? f.icon : "folder", id: f.id, name: String(f.name || "folder"),
        order: +f.order || 0, parent: f.parent || null }));
    const ids = new Set(folders.map(f => f.id));
    folders.forEach(f => {
      if (!ids.has(f.parent) || f.parent === f.id) f.parent = null;
    });

    // Break any loop in the folder tree
    folders.forEach(f => {
      const seen = new Set([f.id]);
      for (let p = byFolder(f.parent); p; p = byFolder(p.parent)) {
        if (seen.has(p.id)) { f.parent = null; break; }
        seen.add(p.id);
      }
    });

    notes = (data && Array.isArray(data.notes) ? data.notes : [])
      .filter(n => n && n.id);
    const cutoff = Date.now() - TRASH_DAYS * 864e5;
    const before = notes.length;
    notes = notes.filter(n => !n.trashed || n.trashed > cutoff);
    notes.forEach(n => {
      n.title = typeof n.title === "string" ? n.title : "";
      n.created = n.created || n.updated || Date.now();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(n.date || "")) {
        n.date = isoDay(new Date(n.created));
      }
      n.folder = ids.has(n.folder) ? n.folder : null;
      n.pinned = !!n.pinned;
      n.tint = COLOURS.includes(n.tint) ? n.tint : null;
      n.tags = [...new Set((Array.isArray(n.tags) ? n.tags : [])
        .map(cleanTag).filter(Boolean))];
      n.trashed = n.trashed || null;
      n.blocks = (Array.isArray(n.blocks) ? n.blocks : []).map(normBlock);
      if (!n.blocks.length) n.blocks.push(newBlock());
      normalise(n.blocks);
    });
    if (notes.length !== before) persist();
  }

  function persist() {
    localStorage.setItem(DATA_KEY, JSON.stringify({ folders, notes }));
  }

  let detailTimer = 0;

  function save(touch = true) {
    if (current && touch) current.updated = Date.now();
    persist();
    markEmptyToggles();
    if (current) {
      clearTimeout(detailTimer);
      detailTimer = setTimeout(() => {
        if (!current) return;
        renderEdited();
        renderWords();
      }, 400);
    }
  }

  function newBlock(type = "text", html = "", indent = 0) {
    const b = { checked: false, color: null, html, id: uid(), indent,
      open: true, type };
    if (type === "table") Object.assign(b, normTable({}));
    return b;
  }

  // Each block sits at most one level deeper than the one above
  function normalise(list) {
    list.forEach((b, i) => {
      const max = i ? list[i - 1].indent + 1 : 0;
      if (b.indent > max) b.indent = max;
      if (b.indent < 0) b.indent = 0;
    });
  }

  const blocks = () => current.blocks;
  const indexOf = id => blocks().findIndex(b => b.id === id);
  const byId = id => blocks().find(b => b.id === id);
  const byFolder = id => folders.find(f => f.id === id);

  // The block plus every line indented beneath it
  function subtreeEnd(i) {
    const list = blocks();
    let j = i + 1;
    while (j < list.length && list[j].indent > list[i].indent) j++;
    return j;
  }

  // Blocks inside collapsed toggles
  function hiddenIds() {
    const out = new Set();
    let hideAt = Infinity;
    blocks().forEach(b => {
      if (b.indent > hideAt) { out.add(b.id); return; }
      hideAt = Infinity;
      if (b.type === "toggle" && !b.open) hideAt = b.indent;
    });
    return out;
  }

  // A tag as stored: no #, no spaces
  function cleanTag(t) {
    return String(t || "").trim().replace(/^#+/, "").replace(/\s+/g, "-");
  }

  // ---- Folders ----

  function subfolders(parent) {
    return folders.filter(f => f.parent === parent)
      .sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
  }

  function isWithin(id, ancestor) {
    for (let f = byFolder(id); f; f = byFolder(f.parent)) {
      if (f.id === ancestor) return true;
    }
    return false;
  }

  const live = () => notes.filter(n => !n.trashed);
  const byEdited = (a, b) => (b.updated || 0) - (a.updated || 0);

  let sortBy = "edited";

  // Last edited, the note's own date, or title
  function bySort(a, b) {
    if (sortBy === "title") {
      const ta = a.title.trim().toLowerCase();
      const tb = b.title.trim().toLowerCase();
      if (!ta !== !tb) return ta ? -1 : 1;
      return ta.localeCompare(tb) || byEdited(a, b);
    }
    if (sortBy === "date") {
      return b.date.localeCompare(a.date) || byEdited(a, b);
    }
    return byEdited(a, b);
  }

  function folderNotes(id) {
    return live().filter(n => n.folder === id && !n.pinned).sort(bySort);
  }

  // Notes in a folder and every folder inside it
  function folderCount(id) {
    return folderNotes(id).length
      + subfolders(id).reduce((sum, f) => sum + folderCount(f.id), 0);
  }

  function setOrder(list) {
    list.forEach((f, i) => { f.order = i; });
  }

  // ---- Routing ----

  function route() {
    const id = decodeURIComponent(location.hash.slice(1));
    hideMenus();
    closeTrash();
    if (id === "new") return createNote(null);
    const note = notes.find(n => n.id === id);
    if (note) openNote(note);
    else if (id.startsWith("folder=")) showFolder(id.slice(7));
    else showGallery();
    ToolkitSidebar.refresh();
  }

  // Open a folder and every folder above it, and bring it into view
  function showFolder(id) {
    for (let f = byFolder(id); f; f = byFolder(f.parent)) {
      subfolders(f.parent).forEach(x => openFolders.delete(x.id));
      openFolders.add(f.id);
    }
    query = searchEl.value = "";
    tagFilter = "";
    showGallery(true);
    const card = galBody.querySelector(
      '.folder-card[data-folder="' + id + '"]');
    if (card) card.scrollIntoView({ block: "center" });
  }

  function showGallery(keepScroll) {
    current = null;
    clearSelection();
    fmt.classList.remove("show");
    noteEl.classList.add("gone");
    gallery.classList.remove("gone");
    trashFab.classList.remove("gone");
    ToolkitSidebar.title("notes");
    renderGallery();
    replay(gallery);
    if (!keepScroll) restoreScroll("_gallery");
    if (location.hash) history.replaceState(null, "", location.pathname);
  }

  function openNote(note) {
    const changed = current !== note;
    current = note;
    if (changed) {
      undoStack = [];
      redoStack = [];
      lastKind = null;

      // Every toggle starts closed
      (note.blocks || []).forEach(b => {
        if (b.type === "toggle") b.open = false;
      });
    }
    gallery.classList.add("gone");
    trashFab.classList.add("gone");
    noteEl.classList.remove("gone");
    renderNote();
    if (changed) {
      replay(noteEl);
      restoreScroll(note.id);
    }
  }

  // ---- Remember scroll ----

  function scrollMap() {
    try { return JSON.parse(localStorage.getItem(SCROLL_KEY)) || {}; }
    catch { return {}; }
  }

  function restoreScroll(key) {
    const top = scrollMap()[key] || 0;
    content.scrollTop = top;
    requestAnimationFrame(() => { content.scrollTop = top; });
  }

  let scrollTimer = 0;
  content.addEventListener("scroll", () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      if (gallery.classList.contains("gone") && !current) return;
      const map = scrollMap();
      const key = current ? current.id : "_gallery";
      delete map[key];
      map[key] = Math.round(content.scrollTop);

      // Keep the 60 most recent
      const keys = Object.keys(map);
      keys.slice(0, Math.max(0, keys.length - 60)).forEach(k => delete map[k]);
      try { localStorage.setItem(SCROLL_KEY, JSON.stringify(map)); } catch {}
    }, 150);
  });

  function replay(el) {
    el.classList.remove("view-in");
    void el.offsetWidth;
    el.classList.add("view-in");
  }

  // ---- Gallery ----

  function previewLine(b, number) {
    const line = document.createElement("div");
    line.className = "pv-line";
    line.style.paddingLeft = (b.indent * 14) + "px";
    if (b.type === "divider") {
      line.appendChild(document.createElement("hr"));
      return line;
    }
    if (b.type === "code") {
      line.classList.add("pv-code");
      line.textContent = codeText(b).split("\n")[0];
      return line;
    }
    if (b.type === "table") {
      line.textContent = "▦ " + b.rows[0].map(c => plain(c)).join(" · ");
      return line;
    }
    const prefix = {
      bullet: "• ", callout: "💡 ", number: number + ". ", quote: "│ ",
      todo: b.checked ? "☑ " : "☐ ", toggle: "▾ "
    }[b.type] || "";
    line.textContent = prefix + plain(b.html);
    if (/^h[123]$/.test(b.type)) line.classList.add("pv-head");
    if (b.type === "toggle") line.classList.add("pv-toggle");
    if (b.type === "todo" && b.checked) line.classList.add("pv-done");
    return line;
  }

  function moreButton(onClick) {
    const more = document.createElement("button");
    more.className = "more-btn";
    more.type = "button";
    more.innerHTML = "&#8943;";
    more.setAttribute("aria-label", "menu");
    more.draggable = false;
    more.addEventListener("click", e => {
      e.stopPropagation();
      onClick(more);
    });
    return more;
  }

  function noteCard(n) {
    const card = document.createElement("div");
    card.className = "card note-card" + (n.tint ? " tint-" + n.tint : "")
      + (n.trashed ? " trashed" : "");
    card.dataset.id = n.id;
    card.draggable = true;

    const head = document.createElement("div");
    head.className = "card-title";
    const name = document.createElement("div");
    name.className = "card-name";
    if (!n.title.trim()) name.classList.add("untitled");
    name.innerHTML = n.pinned ? PIN_ICON : "";
    name.appendChild(document.createTextNode(n.title.trim() || "untitled"));
    const date = document.createElement("div");
    date.className = "card-date";
    date.textContent = "@" + fmtLong(fromIso(n.date));
    head.append(name, date);
    if (n.tags.length) {
      const tags = document.createElement("div");
      tags.className = "card-tags";
      n.tags.forEach(t => {
        const chip = document.createElement("span");
        chip.className = "tag-chip";
        chip.textContent = "#" + t;
        chip.title = "show notes tagged #" + t;
        chip.addEventListener("click", e => {
          e.stopPropagation();
          tagFilter = t;
          renderGallery();
          content.scrollTop = 0;
        });
        tags.appendChild(chip);
      });
      head.appendChild(tags);
    }

    const pv = document.createElement("div");
    pv.className = "card-preview";
    let count = 0;
    n.blocks.slice(0, 12).forEach(b => {
      count = b.type === "number" ? count + 1 : 0;
      if (b.type !== "text" || b.html) pv.appendChild(previewLine(b, count));
    });

    card.append(head, pv, moreButton(btn => cardMenu(btn, n)));
    card.addEventListener("click", () => { location.hash = n.id; });
    dragSource(card, "note", n.id);
    return card;
  }

  function newNoteCard(folder) {
    const add = document.createElement("div");
    add.className = "card new-card";
    add.textContent = "+ new note";
    add.addEventListener("click", () => createNote(folder));
    return add;
  }

  function folderCard(f) {
    const card = document.createElement("div");
    const open = openFolders.has(f.id);
    card.className = "card folder-card" + (open ? " open" : "");
    card.dataset.folder = f.id;
    card.draggable = true;
    const n = folderCount(f.id);
    card.innerHTML = '<span class="folder-icon">'
      + ToolkitSidebar.folderIcon(f.icon) + '</span><div class="folder-text">'
      + '<div class="folder-name"></div><div class="folder-count">'
      + n + (n === 1 ? " note" : " notes") + '</div></div>';
    card.querySelector(".folder-name").textContent = f.name;
    card.appendChild(moreButton(btn => folderMenu(btn, f, card)));
    card.addEventListener("click", e => {
      if (e.target.isContentEditable) return;
      toggleFolder(f.id);
    });
    dragSource(card, "folder", f.id);
    return card;
  }

  // Add a folder (inside parent, if given) and start naming it
  function addFolder(parent) {
    const sibs = subfolders(parent);
    const f = { icon: "folder", id: uid(), name: "new folder",
      order: sibs.length, parent };
    folders.push(f);
    if (parent) openFolders.add(parent);
    persist();
    renderGallery();
    const card = galBody.querySelector('[data-folder="' + f.id + '"]');
    if (card) {
      card.scrollIntoView({ block: "nearest" });
      renameFolder(f, card);
    }
  }

  function newFolderCard() {
    const add = document.createElement("div");
    add.className = "card new-card folder-card";
    add.textContent = "+ new folder";
    add.addEventListener("click", () => addFolder(null));
    return add;
  }

  function renderTrashFab() {
    const n = notes.filter(x => x.trashed).length;
    trashFab.innerHTML = TRASH_ICON + (n ? '<span class="badge">' + n
      + "</span>" : "");
    trashFab.setAttribute("aria-label", "trash, " + n
      + (n === 1 ? " note" : " notes"));
  }

  let trashPop = null;

  function openTrash() {
    closeTrash();
    trashPop = trashPanel();
    trashPop.id = "trash-pop";
    trashPop.classList.remove("panel");
    gallery.appendChild(trashPop);
    trashFab.classList.add("open");
  }

  function closeTrash() {
    if (trashPop) trashPop.remove();
    trashPop = null;
    trashFab.classList.remove("open");
  }

  trashFab.addEventListener("click", () => {
    if (trashPop) closeTrash();
    else openTrash();
  });
  document.addEventListener("pointerdown", e => {
    if (trashPop && !e.target.closest("#trash-pop, #trash-fab, .menu")) {
      closeTrash();
    }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && trashPop && !document.querySelector(".menu")) {
      closeTrash();
    }
  });

  // Drop a note on the button to trash it
  trashFab.addEventListener("dragover", e => {
    if (!gDrag || gDrag.kind !== "note") return;
    e.preventDefault();
    trashFab.classList.add("drop-into");
  });
  trashFab.addEventListener("dragleave", () => {
    trashFab.classList.remove("drop-into");
  });
  trashFab.addEventListener("drop", e => {
    trashFab.classList.remove("drop-into");
    if (!gDrag || gDrag.kind !== "note") return;
    e.preventDefault();
    applyDrop({ trash: true });
  });

  // One open folder per level: opening one slides its open sibling
  // closed first; clicking an open folder slides it closed
  let animateOpen = null, folderBusy = false;

  function slideClosed(ids) {
    const els = ids.map(id => galBody.querySelector(
      '.panel[data-for="' + id + '"]')).filter(Boolean);
    if (!els.length) return Promise.resolve();
    els.forEach(el => el.classList.remove("settled", "shown"));
    return new Promise(done => setTimeout(done, 260));
  }

  async function toggleFolder(id) {
    if (folderBusy) return;
    folderBusy = true;
    try {
      if (openFolders.has(id)) {
        await slideClosed([id]);
        openFolders.delete(id);
      } else {
        const f = byFolder(id);
        const others = subfolders(f ? f.parent : null)
          .map(x => x.id).filter(x => x !== id && openFolders.has(x));
        await slideClosed(others);
        others.forEach(x => openFolders.delete(x));
        openFolders.add(id);
        animateOpen = id;
      }
      renderGallery();
    } finally {
      folderBusy = false;
    }
  }

  // After a render, slide open the folder just chosen
  function playOpen() {
    const id = animateOpen;
    animateOpen = null;
    if (!id) return;
    const el = galBody.querySelector('.panel[data-for="' + id + '"]');
    if (!el) return;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.classList.add("shown");
      setTimeout(() => {
        if (el.classList.contains("shown")) el.classList.add("settled");
      }, 260);
    }));
  }

  // A grid of folder cards, each open folder followed by its panel
  function folderGrid(parent) {
    const grid = document.createElement("div");
    grid.className = "grid folders";
    grid.dataset.parent = parent || "";
    subfolders(parent).forEach(f => {
      grid.appendChild(folderCard(f));
      if (openFolders.has(f.id)) grid.appendChild(folderPanel(f));
    });
    if (!parent) grid.appendChild(newFolderCard());
    return grid;
  }

  // An open folder: its subfolders, then its notes
  function folderPanel(f) {
    const outer = document.createElement("div");
    outer.className = "panel" + (animateOpen === f.id ? "" : " shown settled");
    outer.dataset.for = f.id;
    const panel = document.createElement("div");
    panel.className = "panel-inner";
    outer.appendChild(panel);
    if (subfolders(f.id).length) panel.appendChild(folderGrid(f.id));
    const grid = document.createElement("div");
    grid.className = "grid notes-grid";
    grid.dataset.folder = f.id;
    if (!folderNotes(f.id).length && !subfolders(f.id).length) {
      const msg = document.createElement("div");
      msg.className = "empty-msg";
      msg.textContent = "no notes here yet";
      panel.appendChild(msg);
    }
    folderNotes(f.id).forEach(n => grid.appendChild(noteCard(n)));
    grid.appendChild(newNoteCard(f.id));
    panel.appendChild(grid);
    return outer;
  }

  function trashPanel() {
    const panel = document.createElement("div");
    panel.className = "panel";
    panel.dataset.for = "_trash";
    const head = document.createElement("div");
    head.className = "panel-head";
    head.textContent = "trash";
    panel.appendChild(head);
    const list = notes.filter(n => n.trashed)
      .sort((a, b) => b.trashed - a.trashed);
    if (!list.length) {
      const msg = document.createElement("div");
      msg.className = "empty-msg";
      msg.textContent = "trash is empty";
      panel.appendChild(msg);
      return panel;
    }
    const grid = document.createElement("div");
    grid.className = "grid";
    list.forEach(n => grid.appendChild(noteCard(n)));
    panel.appendChild(grid);
    const actions = document.createElement("div");
    actions.className = "panel-actions";
    const empty = document.createElement("button");
    empty.className = "text-btn";
    empty.type = "button";
    empty.textContent = "empty trash";
    empty.addEventListener("click", () => {
      if (!empty.classList.contains("armed")) {
        empty.classList.add("armed");
        empty.textContent = "click again to empty trash";
        return;
      }
      withUndo("trash emptied", () => {
        notes = notes.filter(n => !n.trashed);
      });
    });
    actions.appendChild(empty);
    panel.appendChild(actions);
    return panel;
  }

  function rule() {
    const hr = document.createElement("hr");
    hr.className = "rule";
    return hr;
  }

  function matches(n, q) {
    const text = (n.title + " " + n.tags.map(t => "#" + t).join(" ") + " "
      + n.blocks.map(blockText).join(" ")).toLowerCase();
    return q.split(/\s+/).every(w => text.includes(w));
  }

  // "Showing #tag" with a button to clear the filter
  function filterBar() {
    const bar = document.createElement("div");
    bar.className = "filter-bar";
    bar.appendChild(document.createTextNode("showing"));
    const chip = document.createElement("span");
    chip.className = "tag-chip";
    chip.textContent = "#" + tagFilter;
    const x = document.createElement("button");
    x.type = "button";
    x.textContent = "×";
    x.title = "show all notes";
    x.addEventListener("click", () => {
      tagFilter = "";
      renderGallery();
    });
    chip.appendChild(x);
    bar.appendChild(chip);
    return bar;
  }

  function sortBar() {
    const bar = document.createElement("div");
    bar.className = "sort-bar";
    bar.appendChild(document.createTextNode("sort:"));
    [["edited", "last edited"], ["date", "date"], ["title", "title"]]
      .forEach(([key, label]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        b.classList.toggle("on", sortBy === key);
        b.addEventListener("click", () => {
          sortBy = key;
          localStorage.setItem(SORT_KEY, key);
          renderGallery();
        });
        bar.appendChild(b);
      });
    return bar;
  }

  function renderGallery() {
    renderTrashFab();
    if (trashPop) openTrash();
    gallery.classList.remove("cards-s", "cards-m", "cards-l");
    gallery.classList.add("cards-" + cardSize);
    galBody.innerHTML = "";
    const q = query.trim().toLowerCase();

    // Search and tags show one flat list of matching notes
    if (tagFilter) galBody.appendChild(filterBar());
    if (q || tagFilter) {
      const found = live().filter(n => (!q || matches(n, q))
        && (!tagFilter || n.tags.includes(tagFilter))).sort(bySort);
      if (!found.length) {
        const msg = document.createElement("div");
        msg.className = "empty-msg";
        msg.textContent = "no notes match";
        galBody.appendChild(msg);
        return;
      }
      const grid = document.createElement("div");
      grid.className = "grid";
      found.forEach(n => grid.appendChild(noteCard(n)));
      galBody.appendChild(grid);
      return;
    }

    const pinned = live().filter(n => n.pinned).sort(byEdited);
    if (pinned.length) {
      const grid = document.createElement("div");
      grid.className = "grid pinned";
      pinned.forEach(n => grid.appendChild(noteCard(n)));
      galBody.append(grid, rule());
    }
    galBody.appendChild(folderGrid(null));
    galBody.appendChild(rule());
    galBody.appendChild(sortBar());
    const grid = document.createElement("div");
    grid.className = "grid notes-grid unsorted";
    grid.dataset.folder = "";
    folderNotes(null).forEach(n => grid.appendChild(noteCard(n)));
    grid.appendChild(newNoteCard(null));
    galBody.appendChild(grid);
    arrangePanels();
    playOpen();
  }

  // Put each open folder's panel straight after the row holding its card
  function arrangePanels() {
    galBody.querySelectorAll(".grid.folders").forEach(grid => {
      const cols = getComputedStyle(grid).gridTemplateColumns
        .split(" ").filter(Boolean).length || 1;
      const kids = [...grid.children];
      const items = kids.filter(k => !k.classList.contains("panel"));
      const panels = {};
      kids.filter(k => k.classList.contains("panel"))
        .forEach(p => { panels[p.dataset.for] = p; });
      const order = [];
      let row = [];
      items.forEach((item, i) => {
        order.push(item);
        row.push(item);
        if ((i + 1) % cols === 0 || i === items.length - 1) {
          row.forEach(r => {
            if (panels[r.dataset.folder]) order.push(panels[r.dataset.folder]);
          });
          row = [];
        }
      });
      order.forEach(el => grid.appendChild(el));
    });
  }

  function createNote(folder = null) {
    const n = { blocks: [newBlock()], created: Date.now(),
      date: isoDay(new Date()), folder, id: uid(), pinned: false, tags: [],
      tint: null, title: "", trashed: null, updated: Date.now() };
    notes.push(n);
    persist();
    location.hash = n.id;
    setTimeout(() => titleEl.focus(), 30);
  }

  function duplicateNote(n) {
    const copy = JSON.parse(JSON.stringify(n));
    copy.id = uid();
    copy.title = (n.title || "untitled") + " (copy)";
    copy.created = copy.updated = Date.now();
    copy.pinned = false;
    copy.tags = [...n.tags];
    copy.blocks.forEach(b => { b.id = uid(); });
    notes.push(copy);
    persist();
  }

  // ---- Markdown ----

  function inlineToMd(html) {
    const t = document.createElement("template");
    t.innerHTML = html;
    const walk = node => [...node.childNodes].map(n => {
      if (n.nodeType === 3) return n.data;
      if (n.nodeType !== 1) return "";
      const inner = walk(n);
      switch (n.tagName) {
        case "B": return "**" + inner + "**";
        case "I": return "*" + inner + "*";
        case "S": return "~~" + inner + "~~";
        case "CODE": return "`" + inner + "`";
        case "MARK": return "==" + inner + "==";
        case "A": return "[" + inner + "](" + n.getAttribute("href") + ")";
        case "BR": return "  \n";
        default: return inner;
      }
    }).join("");
    return walk(t.content);
  }

  function blocksToMd(list) {
    const base = list.length ? Math.min(...list.map(b => b.indent)) : 0;
    const counts = [];
    let out = "", prevList = false;
    list.forEach((b, k) => {
      const pad = "  ".repeat(b.indent - base);
      counts.length = b.indent + 1;
      counts[b.indent] = b.type === "number" ? (counts[b.indent] || 0) + 1 : 0;
      const isList = LIST_TYPES.includes(b.type);
      let line;
      if (b.type === "code") {
        line = pad + "```r\n" + codeText(b).split("\n")
          .map(l => pad + l).join("\n") + "\n" + pad + "```";
      } else if (b.type === "table") {
        const cell = c => inlineToMd(c).replace(/\|/g, "\\|")
          .replace(/\n/g, " ");
        const rowMd = r => pad + "| " + r.map(cell).join(" | ") + " |";
        line = [rowMd(b.rows[0]),
          pad + "|" + b.rows[0].map(() => " --- ").join("|") + "|",
          ...b.rows.slice(1).map(rowMd)].join("\n");
      } else if (b.type === "divider") {
        line = pad + "---";
      } else {
        const pre = { bullet: "- ", callout: "> 💡 ", h1: "# ", h2: "## ",
          h3: "### ", number: counts[b.indent] + ". ", quote: "> ",
          todo: b.checked ? "- [x] " : "- [ ] ", toggle: "- " }[b.type] || "";
        line = pad + pre + inlineToMd(b.html);
      }
      if (k) out += isList && prevList ? "\n" : "\n\n";
      out += line;
      prevList = isList;
    });
    return out;
  }

  function noteToMd(n) {
    const tags = n.tags.length ? " " + n.tags.map(t => "#" + t).join(" ") : "";
    return "# " + (n.title.trim() || "untitled") + "\n\n@"
      + fmtLong(fromIso(n.date)) + tags + "\n\n" + blocksToMd(n.blocks)
      + "\n";
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text)
        .catch(() => fallbackCopy(text));
    }
    fallbackCopy(text);
    return Promise.resolve();
  }

  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
