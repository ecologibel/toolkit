    document.execCommand("copy");
    ta.remove();
  }

  function downloadMd(n) {
    const blob = new Blob([noteToMd(n)], { type: "text/markdown" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (n.title.trim() || "untitled").replace(/[\\/:*?"<>|]+/g, "-")
      + ".md";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // Make a change to notes or folders, offering to undo it
  function withUndo(message, change) {
    const before = JSON.stringify({ folders, notes });
    change();
    persist();
    renderGallery();
    ToolkitSidebar.toast(message, () => {
      localStorage.setItem(DATA_KEY, before);
      load();
      renderGallery();
    });
  }

  // ---- Gallery menus ----

  function cardMenu(anchor, n) {
    if (n.trashed) {
      showMenu(anchor, [
        { label: "restore", run: () => {
          n.trashed = null;
          persist();
          renderGallery();
        } },
        { confirm: "click again to delete", danger: true,
          label: "delete permanently", run: () => {
            withUndo("note deleted", () => {
              notes = notes.filter(x => x !== n);
            });
          } }
      ]);
      return;
    }
    showMenu(anchor, [
      { label: n.pinned ? "unpin" : "pin", run: () => {
        n.pinned = !n.pinned;
        persist();
        renderGallery();
      } },
      { heading: "colour" },
      { active: n.tint, swatches: true, pick: col => {
        n.tint = col;
        persist();
        renderGallery();
      } },
      { rule: true },
      { label: "duplicate", run: () => {
        duplicateNote(n);
        renderGallery();
      } },
      { label: "copy as markdown", run: () => copyText(noteToMd(n)) },
      { label: "download as .md", run: () => downloadMd(n) },
      { rule: true },
      { danger: true, label: "move to trash", run: () => {
        withUndo("moved to trash", () => { n.trashed = Date.now(); });
      } }
    ]);
  }

  function folderMenu(anchor, f, card) {
    showMenu(anchor, [
      { label: "rename", run: () => renameFolder(f, card) },
      { label: "+ subfolder", run: () => addFolder(f.id) },
      { heading: "icon" },
      { active: f.icon || "folder", icons: true, pick: name => {
        f.icon = name;
        persist();
        renderGallery();
      } },
      { rule: true },
      { confirm: "click again to delete", danger: true,
        label: "delete folder", run: () => {

          // Its notes and folders move up a level
          withUndo("folder deleted", () => {
            notes.forEach(n => {
              if (n.folder === f.id) n.folder = f.parent;
            });
            const moved = subfolders(f.id);
            folders = folders.filter(x => x !== f);
            moved.forEach(x => { x.parent = f.parent; });
            setOrder(subfolders(f.parent));
          });
        } }
    ]);
  }

  function renameFolder(f, card) {
    const name = card.querySelector(".folder-name");
    card.draggable = false;
    name.contentEditable = "true";
    name.focus();
    const r = document.createRange();
    r.selectNodeContents(name);
    getSelection().removeAllRanges();
    getSelection().addRange(r);
    let done = false;
    const finish = keep => {
      if (done) return;
      done = true;
      const text = name.textContent.replace(/\s+/g, " ").trim();
      if (keep && text) f.name = text;
      persist();
      renderGallery();
    };
    name.addEventListener("keydown", e => {
      e.stopPropagation();
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      if (e.key === "Escape") { e.preventDefault(); finish(false); }
    });
    name.addEventListener("blur", () => finish(true));
  }

  // ---- Gallery drag and drop ----

  let gDrag = null, dropEl = null, dropCls = "";

  function dragSource(card, kind, id) {
    card.addEventListener("dragstart", e => {
      if (e.target !== card) return;
      gDrag = { id, kind };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", id);
      hideMenus();
      setTimeout(() => card.classList.add("dragging"), 0);
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      gDrag = null;
      clearDrop();
    });
  }

  function clearDrop() {
    if (dropEl) dropEl.classList.remove(dropCls);
    dropEl = null;
    dropCls = "";
  }

  // What dropping here would do, and which element to highlight
  function dropAction(e) {
    if (!gDrag) return null;
    const note = gDrag.kind === "note";
    const t = e.target;
    const fCard = t.closest(".folder-card[data-folder]");
    if (fCard) {
      const fid = fCard.dataset.folder;
      if (note) return { cls: "drop-into", el: fCard, into: fid };
      if (fid === gDrag.id || isWithin(fid, gDrag.id)) return null;
      const r = fCard.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      if (x < 0.25) return { before: fid, cls: "drop-before", el: fCard };
      if (x > 0.75) return { after: fid, cls: "drop-after", el: fCard };
      return { cls: "drop-into", el: fCard, into: fid };
    }
    const panel = t.closest(".panel");
    if (panel) {
      const fid = panel.dataset.for;
      if (fid === "_trash") {
        return note ? { cls: "drop-into", el: panel, trash: true } : null;
      }
      if (!note && (fid === gDrag.id || isWithin(fid, gDrag.id))) return null;
      return { cls: "drop-into", el: panel, into: fid };
    }
    const grid = t.closest(".grid");
    if (!grid) return null;
    if (grid.classList.contains("pinned")) {
      return note ? { cls: "drop-into", el: grid, pin: true } : null;
    }
    if (grid.classList.contains("unsorted")) {
      return note ? { cls: "drop-into", el: grid, into: null } : null;
    }
    if (grid.classList.contains("folders") && !grid.dataset.parent) {
      return note ? null : { cls: "drop-into", el: grid, into: null };
    }
    return null;
  }

  galBody.addEventListener("dragover", e => {
    const act = dropAction(e);
    if (!act) {
      clearDrop();
      return;
    }
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    if (dropEl !== act.el || dropCls !== act.cls) {
      clearDrop();
      dropEl = act.el;
      dropCls = act.cls;
      dropEl.classList.add(dropCls);
    }
  });
  galBody.addEventListener("dragleave", e => {
    if (dropEl && !dropEl.contains(e.relatedTarget)) clearDrop();
  });
  galBody.addEventListener("drop", e => {
    const act = dropAction(e);
    clearDrop();
    if (!act) return;
    e.preventDefault();
    applyDrop(act);
  });

  function applyDrop(act) {
    if (gDrag.kind === "note") {
      const n = notes.find(x => x.id === gDrag.id);
      if (!n) return;
      if (act.trash) {
        gDrag = null;
        withUndo("moved to trash", () => { n.trashed = Date.now(); });
        return;
      } else if (act.pin) {
        n.pinned = true;
        n.trashed = null;
      } else {
        n.folder = act.into;
        n.pinned = false;
        n.trashed = null;
      }
    } else {
      const f = byFolder(gDrag.id);
      if (!f) return;
      const target = byFolder(act.before || act.after);
      if (target) {
        const sibs = subfolders(target.parent).filter(x => x !== f);
        f.parent = target.parent;
        sibs.splice(sibs.indexOf(target) + (act.after ? 1 : 0), 0, f);
        setOrder(sibs);
      } else {
        const sibs = subfolders(act.into).filter(x => x !== f);
        f.parent = act.into;
        sibs.push(f);
        setOrder(sibs);
        if (act.into) openFolders.add(act.into);
      }
    }
    gDrag = null;
    persist();
    renderGallery();
  }

  searchEl.addEventListener("input", () => {
    query = searchEl.value;
    renderGallery();
  });
  searchEl.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      searchEl.value = query = "";
      renderGallery();
    }
  });

  // ---- Note ----

  function renderNote(force) {
    if (force || document.activeElement !== titleEl) {
      titleEl.textContent = current.title;
    }
    renderDate();
    renderTags();
    renderPin();
    renderEdited();
    renderBlocks();
    renderWords();
    renderCrumbs();
    noteTitle();
  }

  function noteTitle() {
    ToolkitSidebar.title(current.title.trim() || "untitled");
  }

  // notes / folder / subfolder, each a way back
  function renderCrumbs() {
    crumbsEl.innerHTML = "";
    const add = (text, href) => {
      if (crumbsEl.childNodes.length) {
        const sep = document.createElement("span");
        sep.className = "sep";
        sep.textContent = "/";
        crumbsEl.appendChild(sep);
      }
      const a = document.createElement("a");
      a.href = href;
      a.textContent = text;
      crumbsEl.appendChild(a);
    };
    add("notes", "#");
    const trail = [];
    for (let f = byFolder(current.folder); f; f = byFolder(f.parent)) {
      trail.unshift(f);
    }
    trail.forEach(f => add(f.name, "#folder=" + encodeURIComponent(f.id)));
    placeBack();
  }

  // The trail sits left of the panel when there's room, else above it
  function placeBack() {
    if (!current) return;
    noteEl.classList.remove("back-above");
    const room = noteEl.getBoundingClientRect().left
      - content.getBoundingClientRect().left;
    noteEl.classList.toggle("back-above", room < crumbsEl.offsetWidth + 40);
  }

  function renderPin() {
    pinBtn.classList.toggle("on", !!current.pinned);
    pinBtn.innerHTML = PIN_ICON + (current.pinned ? "pinned" : "pin");
    pinBtn.title = current.pinned ? "unpin this note" : "pin this note";
  }

  pinBtn.addEventListener("click", () => {
    current.pinned = !current.pinned;
    save(false);
    renderPin();
  });

  // edited just now, 5 min ago, 2 h ago, yesterday, 3 days ago
  function agoText(ts) {
    if (!ts) return "";
    const mins = Math.floor((Date.now() - ts) / 60000);
    if (mins < 1) return "edited just now";
    if (mins < 60) return "edited " + mins + " min ago";
    const hours = Math.floor(mins / 60);
    if (hours < 24) return "edited " + hours + " h ago";
    const days = Math.floor(hours / 24);
    if (days === 1) return "edited yesterday";
    if (days < 30) return "edited " + days + " days ago";
    return "edited " + fmtLong(new Date(ts)).slice(4);
  }

  function renderEdited() {
    editedEl.textContent = current ? agoText(current.updated) : "";
  }
  setInterval(() => { if (current) renderEdited(); }, 60000);

  function renderWords() {
    const text = current.blocks.map(blockText).join(" ");
    const n = (text.match(/[^\s]+/g) || []).length;
    wordsEl.textContent = n + (n === 1 ? " word" : " words");
  }

  function renderTags() {
    tagsEl.innerHTML = "";
    current.tags.forEach(t => {
      const chip = document.createElement("span");
      chip.className = "tag-chip";
      chip.textContent = "#" + t;
      const x = document.createElement("button");
      x.type = "button";
      x.textContent = "×";
      x.title = "remove #" + t;
      x.addEventListener("click", () => {
        checkpoint();
        current.tags = current.tags.filter(y => y !== t);
        save();
        renderTags();
      });
      chip.appendChild(x);
      tagsEl.appendChild(chip);
    });
  }

  // "+ tag" turns into a box for typing a tag
  const addTagBtn = noteEl.querySelector(".add-tag");
  addTagBtn.addEventListener("click", () => {
    const input = document.createElement("input");
    input.className = "tag-input";
    input.placeholder = "tag name";
    addTagBtn.classList.add("gone");
    addTagBtn.before(input);
    input.focus();
    let done = false;
    const finish = keep => {
      if (done) return;
      done = true;
      const t = cleanTag(input.value);
      input.remove();
      addTagBtn.classList.remove("gone");
      if (keep && t && !current.tags.includes(t)) {
        checkpoint();
        current.tags.push(t);
        save();
        renderTags();
      }
    };
    input.addEventListener("keydown", e => {
      e.stopPropagation();
      if (e.key === "Enter") {
        e.preventDefault();
        finish(true);
        addTagBtn.click();
      } else if (e.key === "Escape") {
        e.preventDefault();
        finish(false);
      }
    });
    input.addEventListener("blur", () => finish(true));
  });

  function renderDate() {
    if (dateEl.isContentEditable) return;
    dateEl.textContent = "@" + fmtLong(fromIso(current.date));
  }

  function renderBlocks() {
    const hidden = hiddenIds();
    const counts = [], lastType = [];
    blocksEl.querySelectorAll(".block").forEach(el => el.remove());

    current.blocks.forEach(b => {
      // Numbers restart after any other block at the same level
      counts.length = lastType.length = b.indent + 1;
      counts[b.indent] = b.type === "number"
        ? (lastType[b.indent] === "number" ? counts[b.indent] + 1 : 1) : 0;
      lastType[b.indent] = b.type;
      blocksEl.appendChild(blockEl(b, hidden.has(b.id), counts[b.indent]));
    });
    markEmptyToggles();
  }

  function numberLabel(n, depth) {
    if (depth % 3 === 1) {
      let s = "";
      for (; n > 0; n = Math.floor((n - 1) / 26)) {
        s = String.fromCharCode(97 + (n - 1) % 26) + s;
      }
      return s;
    }
    if (depth % 3 === 2) {
      const R = [[10, "x"], [9, "ix"], [5, "v"], [4, "iv"], [1, "i"]];
      let s = "";
      R.forEach(([v, r]) => { while (n >= v) { s += r; n -= v; } });
      return s;
    }
    return String(n);
  }

  function blockEl(b, hidden, number) {
    const el = document.createElement("div");
    el.className = "block type-" + b.type;
    el.dataset.id = b.id;
    el.style.setProperty("--indent", b.indent);
    if (hidden) el.classList.add("hidden");
    if (b.color) el.classList.add("c-" + b.color);
    if (b.type === "todo" && b.checked) el.classList.add("checked");
    if (b.type === "toggle" && b.open) el.classList.add("open");
    if (selected.has(b.id)) el.classList.add("selected");

    const handle = document.createElement("div");
    handle.className = "handle";
    handle.innerHTML = GRIP;
    handle.title = "drag to move, click for options";
    el.appendChild(handle);

    if (b.type === "divider") {
      el.appendChild(document.createElement("hr"));
      return el;
    }
    if (b.type === "table") {
      el.appendChild(tableEl(b));
      return el;
    }

    if (LIST_TYPES.includes(b.type) || b.type === "callout") {
      const m = document.createElement("div");
      m.className = "marker";
      if (b.type === "bullet") {
        const dot = document.createElement("span");
        dot.className = "bullet";
        dot.textContent = ["•", "◦", "▪"][b.indent % 3];
        m.appendChild(dot);
      } else if (b.type === "number") {
        m.textContent = numberLabel(number, b.indent) + ".";
      } else if (b.type === "todo") {
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = b.checked;
        m.appendChild(box);
      } else if (b.type === "callout") {
        m.textContent = "💡";
      } else {
        const t = document.createElement("span");
        t.className = "toggle-arrow";
        t.textContent = "▼";
        t.setAttribute("role", "button");
        t.setAttribute("aria-label", b.open ? "collapse" : "expand");
        m.appendChild(t);
      }
      el.appendChild(m);
    }

    const c = document.createElement("div");
    c.className = "content";
    c.dataset.ph = PLACEHOLDER[b.type];
    if (b.type === "code") {
      c.contentEditable = "plaintext-only";
      c.spellcheck = false;
      c.innerHTML = highlightR(codeText(b));
    } else {
      c.contentEditable = "true";
      c.spellcheck = true;
      c.innerHTML = decorate(b.html);
    }
    el.appendChild(c);

    // To dos can open in focus mode
    if (b.type === "todo" && window.ToolkitFocus) {
      const f = document.createElement("button");
      f.className = "focus-btn";
      f.type = "button";
      f.title = "focus on this";
      f.setAttribute("aria-label", "focus on this");
      f.contentEditable = "false";
      f.innerHTML = ToolkitSidebar.icon("focus");
      f.addEventListener("mousedown", e => e.preventDefault());
      f.addEventListener("click", e => {
        e.stopPropagation();
        save();
        ToolkitFocus.go({ blockId: b.id, kind: "note", noteId: current.id },
          blockText(b).trim());
      });
      el.appendChild(f);
    }
    return el;
  }

  const contentOf = id => {
    const el = blocksEl.querySelector('.block[data-id="' + id + '"]');
    return el && el.querySelector(".content");
  };

  // Re-render after a change to the block list, then place the caret
  function commit(focusId, caret) {
    normalise(blocks());
    save();
    renderBlocks();
    if (focusId) {
      const c = contentOf(focusId) || cellAt(focusId, 0, 0);
      if (c) setCaret(c, caret === undefined ? "end" : caret);
    }
  }

  // ---- Undo ----

  let undoStack = [], redoStack = [], lastKind = null, lastAt = 0;

  function focusInfo() {
    const a = document.activeElement;
    if (a === titleEl) return { offset: (textBefore(titleEl) || "").length,
      title: true };
    const c = a && a.closest && a.closest("#blocks .content");
    if (c) {
      return { id: c.closest(".block").dataset.id,
        offset: (textBefore(c) || "").length };
    }
    return null;
  }

  function snapshot() {
    return { blocks: JSON.stringify(current.blocks), date: current.date,
      focus: focusInfo(), tags: JSON.stringify(current.tags),
      title: current.title };
  }

  // Save the state before a change; typing within a second is one step
  function checkpoint(typing) {
    if (!current) return;
    const now = Date.now();
    if (typing && lastKind === "type" && now - lastAt < 1000) {
      lastAt = now;
      return;
    }
    const s = snapshot();
    const top = undoStack[undoStack.length - 1];
    if (top && top.blocks === s.blocks && top.title === s.title
      && top.date === s.date && top.tags === s.tags) {
      lastKind = typing ? "type" : "op";
      lastAt = now;
      return;
    }
    undoStack.push(s);
    if (undoStack.length > 200) undoStack.shift();
    redoStack = [];
    lastKind = typing ? "type" : "op";
    lastAt = now;
  }

  function restore(s) {
    current.blocks = JSON.parse(s.blocks);
    current.title = s.title;
    current.date = s.date;
    current.tags = JSON.parse(s.tags || "[]");
    selected = new Set();
    save();
    renderNote(true);
    const f = s.focus;
    if (f && f.title) setCaret(titleEl, f.offset);
    else if (f && contentOf(f.id)) setCaret(contentOf(f.id), f.offset);
    lastKind = null;
  }

  function undo() {
    if (!undoStack.length) return;
    const now = snapshot();
    const s = undoStack.pop();
    redoStack.push(Object.assign(now, { focus: s.focus || now.focus }));
    restore(s);
  }

  function redo() {
    if (!redoStack.length) return;
    undoStack.push(snapshot());
    restore(redoStack.pop());
  }

  noteEl.addEventListener("beforeinput", e => {
    if (!e.target.closest
      || !e.target.closest("#title, #blocks .content, #blocks .cell")) {
      return;
    }
    if (e.inputType === "historyUndo" || e.inputType === "historyRedo") {
      e.preventDefault();
      return;
    }
    checkpoint(/^(insertText|deleteContentBackward|deleteContentForward)$/
      .test(e.inputType));
  });

  // ---- Caret ----

  function selRange() {
    const s = getSelection();
    return s.rangeCount ? s.getRangeAt(0) : null;
  }

  function textBefore(el) {
    const r = selRange();
    if (!r || !el.contains(r.startContainer)) return null;
    const pre = document.createRange();
    pre.selectNodeContents(el);
    pre.setEnd(r.startContainer, r.startOffset);
    return pre.toString().replace(/​/g, "");
  }

  function textAfter(el) {
    const r = selRange();
    if (!r || !el.contains(r.endContainer)) return null;
    const post = document.createRange();
    post.selectNodeContents(el);
    post.setStart(r.endContainer, r.endOffset);
    return post.toString().replace(/​/g, "");
  }

  // Remove and return everything after the caret
  function extractAfter(el) {
    const r = selRange();
    if (!r.collapsed) r.deleteContents();
    const tail = document.createRange();
    tail.selectNodeContents(el);
    tail.setStart(r.endContainer, r.endOffset);
    const div = document.createElement("div");
    div.appendChild(tail.extractContents());
    return clean(div.innerHTML);
  }

  // A range over characters a to z of an element's text
  function rangeAt(el, a, z) {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const r = document.createRange();
    let pos = 0, startSet = false;
    r.selectNodeContents(el);
    while (walker.nextNode()) {
      const n = walker.currentNode, len = n.length;
      if (!startSet && a <= pos + len) {
        r.setStart(n, a - pos);
        startSet = true;
      }
      if (startSet && z <= pos + len) {
        r.setEnd(n, z - pos);
        return r;
      }
      pos += len;
    }
    return r;
  }

  function setCaret(el, pos) {
    el.focus();
    const r = document.createRange();
    if (pos === "end" || pos === undefined) {
      r.selectNodeContents(el);
      r.collapse(false);
    } else {
      // At a boundary, prefer the start of the next piece of text
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      let left = pos, placed = false;
      for (let k = 0; k < nodes.length; k++) {
        const len = nodes[k].length;
        if (left < len || (left === len && k === nodes.length - 1)) {
          r.setStart(nodes[k], left);
          placed = true;
          break;
        }
        left -= len;
      }
      if (!placed) {
        r.selectNodeContents(el);
        r.collapse(pos > 0 ? false : true);
      }
      r.collapse(true);
    }
    const s = getSelection();
    s.removeAllRanges();
    s.addRange(r);
  }

  // Put the caret in a block at a screen x position
  function caretAtX(el, x, y) {
    el.focus();
    let r = null;
    if (document.caretRangeFromPoint) r = document.caretRangeFromPoint(x, y);
    else if (document.caretPositionFromPoint) {
      const p = document.caretPositionFromPoint(x, y);
      if (p) {
        r = document.createRange();
        r.setStart(p.offsetNode, p.offset);
      }
    }
    if (r && el.contains(r.startContainer)) {
      r.collapse(true);
      const s = getSelection();
      s.removeAllRanges();
      s.addRange(r);
    } else {
      setCaret(el, y > el.getBoundingClientRect().top + 4 ? "end" : 0);
    }
  }

  function caretRect() {
    const r = selRange();
    if (!r) return null;
    const rects = r.getClientRects();
    if (rects.length) return rects[0];

    // An empty line has no caret box; use its container instead
    const node = r.startContainer;
    return (node.nodeType === 1 ? node : node.parentElement)
      .getBoundingClientRect();
  }

  // ---- Block operations ----

  function visibleIndex(i, step) {
    const hidden = hiddenIds(), list = blocks();
    for (let j = i + step; j >= 0 && j < list.length; j += step) {
      if (!hidden.has(list[j].id)) return j;
    }
    return -1;
  }

  function editableIndex(i, step) {
    let j = visibleIndex(i, step);
    while (j !== -1 && blocks()[j].type === "divider") {
      j = visibleIndex(j, step);
    }
    return j;
  }

  function shiftSubtree(i, by) {
    const end = subtreeEnd(i);
    for (let j = i; j < end; j++) {
      blocks()[j].indent = Math.max(0, blocks()[j].indent + by);
    }
  }

  // Indent a block (and its children) under the visible block above
  function indentAt(i) {
    const p = visibleIndex(i, -1);
    if (p === -1) return false;
    const prev = blocks()[p], b = blocks()[i];
    if (b.indent > prev.indent) return false;
    if (prev.type === "toggle" && !prev.open && b.indent === prev.indent) {
      prev.open = true;
    }
    shiftSubtree(i, 1);
    return true;
  }

  function setType(b, type) {
    if (type === "code" && b.type !== "code") {
      b.html = escapeHtml(plain(b.html));
    } else if (b.type === "code" && type !== "code") {
      b.html = escapeHtml(codeText(b)).replace(/\n/g, "<br>");
    }
    if (type === "table" && b.type !== "table") {
      const first = b.html;
      Object.assign(b, normTable({}));
      b.rows[0][0] = first;
      b.html = "";
    } else if (b.type === "table" && type !== "table") {
      b.html = b.rows.map(r => r.filter(Boolean).join(" ")).filter(Boolean)
        .join("<br>");
      ["cellColors", "colColors", "headCol", "headRow", "rowColors", "rows",
        "widths"].forEach(k => delete b[k]);
    }
    b.type = type;
    if (type === "divider") b.html = "";
    if (type === "toggle") b.open = true;
    if (type !== "todo") b.checked = false;
  }

  function duplicateRange(start, end) {
    const copies = blocks().slice(start, end)
      .map(b => Object.assign(JSON.parse(JSON.stringify(b)), { id: uid() }));
    blocks().splice(end, 0, ...copies);
    return copies;
  }

  // Start-of-line shortcuts, typed before a space
  const SPACE_SHORTCUTS = {
    "#": "h1", "##": "h2", "###": "h3", "*": "bullet", "-": "bullet",
    "+": "bullet", "/to": "todo", "[]": "todo", ">": "toggle",
    "/tog": "toggle", "/tab": "table", "\"": "quote", "“": "quote"
  };

  let swallowSpace = false;

  function convertPrefix(c, b, type) {
    checkpoint();
    closeSlash();
    const rest = extractAfter(c);
    const i = indexOf(b.id);
    if (type === "table") b.html = rest;
    setType(b, type);
    if (type === "divider") {
      const nb = newBlock("text", rest, b.indent);
      blocks().splice(i + 1, 0, nb);
      commit(nb.id, 0);
      swallowSpace = true;
      return;
    }
    if (type !== "table") {
      b.html = type === "code" ? escapeHtml(plain(rest)) : rest;
    }
    commit(b.id, 0);
  }

  function onEnter(c, b) {
    checkpoint();
    const i = indexOf(b.id);
    const before = textBefore(c), empty = !plain(b.html) && !c.textContent;

    if (empty && b.type !== "text") {
      setType(b, "text");
      return commit(b.id, 0);
    }
    if (empty && b.indent > 0) {
      shiftSubtree(i, -1);
      return commit(b.id, 0);
    }

    // Caret at the start: open a new line above
    if (before === "" && c.textContent && selRange().collapsed) {
      const t = LIST_TYPES.includes(b.type) ? b.type : "text";
      blocks().splice(i, 0, newBlock(t, "", b.indent));
      return commit(b.id, 0);
    }

    const rest = extractAfter(c);
    b.html = clean(c.innerHTML);
    let type = LIST_TYPES.includes(b.type) ? b.type : "text";
    let indent = b.indent, at = i + 1;
    const hasChildren = at < blocks().length && blocks()[at].indent > b.indent;
    if (b.type === "toggle" && b.open) {
      type = "text";
      indent++;
    } else if (b.type === "toggle") {
      at = subtreeEnd(i);
    } else if (hasChildren) {
      indent++;
    }
    const nb = newBlock(type, rest, indent);
    blocks().splice(at, 0, nb);
    commit(nb.id, 0);
  }

  function onBackspace(c, b) {
    checkpoint();
    const i = indexOf(b.id);
    if (b.type !== "text") {
      if (b.type !== "code") b.html = clean(c.innerHTML);
      setType(b, "text");
      return commit(b.id, 0);
    }
    const p = visibleIndex(i, -1);
    if (p === -1) {
      if (!c.textContent && blocks().length > 1) {
        blocks().splice(i, 1);
        commit();
      }
      setCaret(titleEl, "end");
      return;
    }
    const prev = blocks()[p];
    if (prev.type === "divider") {
      blocks().splice(p, 1);
      return commit(b.id, 0);
    }
    const html = clean(c.innerHTML);
    if (prev.type === "code") {
      const offset = codeText(prev).length;
      prev.html = escapeHtml(codeText(prev) + plain(html));
      blocks().splice(i, 1);
      return commit(prev.id, offset);
    }
    const offset = textLen(prev.html);
    prev.html = prev.html + html;
    blocks().splice(i, 1);
    commit(prev.id, offset);
  }

  function onDelete(c, b) {
    const i = indexOf(b.id);
    const n = visibleIndex(i, 1);
    if (n === -1) return;
    checkpoint();
    const next = blocks()[n];
    b.html = clean(c.innerHTML);
    const offset = textLen(b.html);
    if (next.type === "code") b.html += escapeHtml(codeText(next));
    else if (next.type !== "divider") b.html += next.html;
    blocks().splice(n, 1);
    commit(b.id, offset);
  }

  // Wrap the selection in a tag, or unwrap it if already inside one
  function toggleWrap(c, tag) {
    const r = selRange();
    if (!r || r.collapsed || !c.contains(r.commonAncestorContainer)) return;
    checkpoint();
    const node = r.commonAncestorContainer;
    const inTag = (node.nodeType === 1 ? node : node.parentElement)
      .closest(tag);
    const s = getSelection();
    const sel = document.createRange();
    if (inTag && c.contains(inTag)) {
      const first = inTag.firstChild, last = inTag.lastChild;
      inTag.replaceWith(...inTag.childNodes);
      sel.setStartBefore(first);
      sel.setEndAfter(last);
    } else {
      const el = document.createElement(tag);
      el.appendChild(r.extractContents());
      el.querySelectorAll(tag).forEach(x => x.replaceWith(...x.childNodes));
      r.insertNode(el);
      sel.selectNodeContents(el);
    }
    s.removeAllRanges();
    s.addRange(sel);
    syncBlock(c);
    updateFmt();
  }

  function execFormat(c, cmd) {
    checkpoint();
    document.execCommand(cmd);
    syncBlock(c);
    updateFmt();
  }

  // **bold**, *italic*, ~~strike~~ and `code` as you type the closing mark
  function inlineShortcut(c) {
    const s = getSelection();
    if (!s.isCollapsed) return false;
    const node = s.anchorNode;
    if (!node || node.nodeType !== 3) return false;
    if (node.parentElement.closest("code")) return false;
    const off = s.anchorOffset, text = node.data.slice(0, off);
    let m, tag, start;
    if ((m = text.match(/`([^`]+)`$/))) {
      tag = "code";
      start = m.index;
    } else if ((m = text.match(/\*\*([^*]+)\*\*$/))) {
      tag = "b";
      start = m.index;
    } else if ((m = text.match(/~~([^~]+)~~$/))) {
      tag = "s";
      start = m.index;
    } else if ((m = text.match(/(?:^|[^*])\*([^*\s](?:[^*]*[^*\s])?)\*$/))) {
      tag = "i";
      start = m.index + (m[0][0] === "*" ? 0 : 1);
    } else {
      return false;
    }
    const after = node.data.slice(off);
    node.data = text.slice(0, start);
    const el = document.createElement(tag);
    el.textContent = m[1];
    const tail = document.createTextNode("​" + after);
    node.after(el, tail);
    const r = document.createRange();
    r.setStart(tail, 1);
    r.collapse(true);
    s.removeAllRanges();
    s.addRange(r);
    return true;
  }

  // Turn a web address into a link once a space follows it
  function autoLink() {
    const s = getSelection();
    const node = s.anchorNode;
    if (!s.isCollapsed || !node || node.nodeType !== 3) return false;
    if (node.parentElement.closest("a, code")) return false;
    const text = node.data.slice(0, s.anchorOffset);
    const m = text.match(
      /(?:^|\s)((?:https?:\/\/|www\.)[^\s]+?)([.,;:!?)]?)\s$/);
    if (!m) return false;
    const url = m[1];
    const start = text.length - 1 - m[2].length - url.length;
    const r = document.createRange();
    r.setStart(node, start);
    r.setEnd(node, start + url.length);
    const a = document.createElement("a");
    a.href = safeHref(url);
    a.appendChild(r.extractContents());
    r.insertNode(a);
    const caret = document.createRange();
    const after = a.nextSibling;
    if (after && after.nodeType === 3) caret.setStart(after, m[2].length + 1);
    else caret.setStartAfter(a);
    caret.collapse(true);
    s.removeAllRanges();
    s.addRange(caret);
    return true;
  }

  function stampAnchor(b) {
    const tok = firstToken(plain(b.html));
    if (tok !== (b.anchorTok || "") || !b.anchorAt) {
      b.anchorTok = tok;
      b.anchorAt = Date.now();
    }
  }

  function syncBlock(c) {
    if (c.classList.contains("cell")) return syncCell(c);
    const b = byId(c.closest(".block").dataset.id);
    if (!b) return;
    if (b.type === "code") {
      const html = escapeHtml(c.textContent);
      if (html !== b.html) {
        b.html = html;
        save();
      }
      return;
    }
    if (c.innerHTML === "<br>") c.innerHTML = "";
    const html = clean(c.innerHTML);
    if (html !== b.html) {
      b.html = html;
      if (b.type === "todo") stampAnchor(b);
      save();
    }
  }

  // Re-colour dates and tags, keeping the caret in place
  function redecorate(c) {
    const b = byId(c.closest(".block").dataset.id);
    if (!b || b.type === "code") return;
    if (!/[@#]/.test(b.html) && !c.querySelector(".date-token, .tag-token")) {
      return;
    }
    const want = decorate(b.html);
    if (c.innerHTML === want) return;
    const before = textBefore(c);
    if (before === null) return;
    c.innerHTML = want;
    setCaret(c, before.length);
  }

  function recode(c) {
    const before = textBefore(c);
    const text = c.textContent;
    c.innerHTML = highlightR(text);
    if (before !== null) setCaret(c, before.length);
  }

  function parseLine(line, baseIndent) {
    let indent = baseIndent;
    const lead = line.match(/^(\t| {2})*/)[0];
    indent += (lead.match(/\t| {2}/g) || []).length;
    let text = line.slice(lead.length), type = "text", checked = false;
    const rules = [
      [/^###\s+/, "h3"], [/^##\s+/, "h2"], [/^#\s+/, "h1"],
      [/^[-*+]\s+\[[xX]\]\s*/, "todo", true], [/^[-*+]\s+\[ ?\]\s*/, "todo"],
      [/^\[[xX]\]\s*/, "todo", true], [/^\[ ?\]\s*/, "todo"],
      [/^[-*+]\s+/, "bullet"], [/^\d+[.)]\s+/, "number"],
      [/^>\s*💡\s*/, "callout"], [/^>\s+/, "toggle"],
      [/^"\s+/, "quote"], [/^-{3,}\s*$/, "divider"]
    ];
    for (const [re, t, done] of rules) {
      if (re.test(text)) {
        type = t;
        checked = !!done;
        text = text.replace(re, "");
        break;
      }
    }
    const b = newBlock(type, type === "divider" ? "" : inlineMarkdown(text),
      indent);
    b.checked = checked;
    if (type === "todo") stampAnchor(b);
    return b;
  }

  // Lines of pasted text as blocks, with ``` fences as code blocks
  function parseLines(lines, baseIndent) {
    const out = [];
    for (let k = 0; k < lines.length; k++) {
      const fence = lines[k].match(/^(\s*)```/);
      if (fence) {
        const body = [];
        k++;
        while (k < lines.length && !/^\s*```\s*$/.test(lines[k])) {
          body.push(lines[k]);
          k++;
        }
        out.push(newBlock("code", escapeHtml(body.join("\n")), baseIndent));
        continue;
      }
      out.push(parseLine(lines[k], baseIndent));
    }
    return out;
  }

  function onPaste(e, c, b) {
    e.preventDefault();
    const text = (e.clipboardData.getData("text/plain") || "")
      .replace(/\r\n?/g, "\n");
    if (!text) return;
    checkpoint();
    if (b.type === "code") {
      codeInsert(c, text);
      return;
    }
    const lines = text.split("\n");
    if (lines.length === 1) {
      document.execCommand("insertText", false, text);
      return;
    }
    const rest = extractAfter(c);
    document.execCommand("insertText", false, lines[0]);
    b.html = clean(c.innerHTML);
    const added = parseLines(lines.slice(1), b.indent);
    if (!added.length) return commit(b.id, "end");
    const last = added[added.length - 1];
    let offset;
    if (last.type === "code") {
      const nb = newBlock("text", rest, b.indent);
      added.push(nb);
      blocks().splice(indexOf(b.id) + 1, 0, ...added);
      return commit(nb.id, 0);
    }
    offset = textLen(last.html);
    last.html += rest;
    blocks().splice(indexOf(b.id) + 1, 0, ...added);
    commit(last.id, offset);
  }

  // ---- Typing ----

  blocksEl.addEventListener("input", e => {
    const c = e.target.closest(".content");
    if (!c) return;
    const b = byId(c.closest(".block").dataset.id);
    if (!b) return;
    if (b.type === "code") {
      if (!e.isComposing) recode(c);
      syncBlock(c);
      return;
    }
    const typed = e.inputType === "insertText" ? e.data : null;
    const before = typed ? textBefore(c) : null;
    if (typed === "]" && before === "[]" && b.type !== "todo") {
      return convertPrefix(c, b, "todo");
    }
    if (typed === "-" && before === "---") {
      return convertPrefix(c, b, "divider");
    }
    if (typed === "`" && before === "```") {
      return convertPrefix(c, b, "code");
    }
    if (typed && /[*`~]$/.test(typed)) inlineShortcut(c);
    if (typed === " ") autoLink();
    syncBlock(c);
    if (!e.isComposing) redecorate(c);
    updateSlash(c, b, typed);
  });

  blocksEl.addEventListener("paste", e => {
    const c = e.target.closest(".content");
    if (c) onPaste(e, c, byId(c.closest(".block").dataset.id));
  });

  // Ctrl+click opens a link
  blocksEl.addEventListener("click", e => {
    const a = e.target.closest(".content a");
    if (a && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      window.open(a.href, "_blank", "noopener");
    }
  });
  blocksEl.addEventListener("mouseover", e => {
    const a = e.target.closest(".content a");
    if (a && !a.title) {
      a.title = a.getAttribute("href") + " (ctrl+click to open)";
    }
  });

  // Replace a code block's selection with text, then re-colour it
  function codeInsert(c, str) {
    checkpoint();
    const before = textBefore(c), after = textAfter(c);
    const text = before + str + after;
    c.innerHTML = highlightR(text);
    setCaret(c, before.length + str.length);
    syncBlock(c);
  }

  function codeKeys(e, c, b, i) {
    const before = textBefore(c), after = textAfter(c);
    if (e.key === "Enter" && !(e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      // Keep the line's indent, adding a level after an opening bracket
      const line = before.slice(before.lastIndexOf("\n") + 1);
      const more = /[{(\[]\s*$/.test(line) ? "  " : "";
      codeInsert(c, "\n" + line.match(/^[ \t]*/)[0] + more);
      return true;
    }
    if (e.key === "Tab" && !e.shiftKey) {
      e.preventDefault();
      codeInsert(c, "  ");
      return true;
    }
    if (e.key === "Backspace" && !c.textContent && selRange().collapsed) {
      e.preventDefault();
      onBackspace(c, b);
      return true;
    }
    if (e.key === "ArrowUp" && !before.includes("\n") && !e.shiftKey) {
      const p = editableIndex(i, -1);
      e.preventDefault();
      if (p === -1) setCaret(titleEl, "end");
      else setCaret(contentOf(blocks()[p].id), "end");
      return true;
    }
    if ((e.key === "ArrowDown" && !after.includes("\n") && !e.shiftKey)
      || (e.key === "Enter" && (e.ctrlKey || e.metaKey))) {
      e.preventDefault();
      let n = editableIndex(i, 1);
      if (n === -1) {
        checkpoint();
        const nb = newBlock("text", "", b.indent);
        blocks().splice(subtreeEnd(i), 0, nb);
        commit(nb.id, 0);
        return true;
      }
      setCaret(contentOf(blocks()[n].id), 0);
      return true;
    }
    return false;
  }

  blocksEl.addEventListener("keydown", e => {
    const c = e.target.closest(".content");
    if (!c || e.isComposing) return;
    const b = byId(c.closest(".block").dataset.id);
    if (!b) return;
    const i = indexOf(b.id);
    const mod = e.ctrlKey || e.metaKey;
    const r = selRange();
    const collapsed = r && r.collapsed;
    const key = e.key.toLowerCase();

    if (slash && slashKeys(e)) return;

    if (e.key === "Escape") {
      e.preventDefault();
      c.blur();
      getSelection().removeAllRanges();
      select([b.id], b.id);
      return;
    }
    if (b.type === "code" && codeKeys(e, c, b, i)) return;
    if (b.type === "code") return;

    if (e.key === " " && swallowSpace) {
      swallowSpace = false;
      if (!c.textContent) {
        e.preventDefault();
        return;
      }
    }
    swallowSpace = false;

    if (e.key === " " && collapsed && !mod) {
      const before = textBefore(c);
      let type = SPACE_SHORTCUTS[before];
      if (!type && /^\d+\.$/.test(before)) type = "number";
      if (type && type !== b.type) {
        e.preventDefault();
        convertPrefix(c, b, type);
      }
      return;
    }
    if (e.key === "Enter" && !e.shiftKey && !mod) {
      e.preventDefault();
      onEnter(c, b);
      return;
    }
    if (e.key === "Backspace" && collapsed && textBefore(c) === ""
      && !mod) {
      e.preventDefault();
      onBackspace(c, b);
      return;
    }
    if (e.key === "Delete" && collapsed && textAfter(c) === "") {
      e.preventDefault();
      onDelete(c, b);
      return;
    }
    if (e.key === "Tab") {
      e.preventDefault();
      const offset = textBefore(c).length;
      b.html = clean(c.innerHTML);
      checkpoint();
      if (e.shiftKey ? b.indent > 0 && (shiftSubtree(i, -1), true)
        : indentAt(i)) {
        commit(b.id, offset);
      }
      return;
    }
    if (mod && !e.shiftKey && key === "e") {
      e.preventDefault();
      toggleWrap(c, "code");
      return;
    }
    if (mod && e.shiftKey && key === "s") {
      e.preventDefault();
      toggleWrap(c, "s");
      return;
    }
    if (mod && e.shiftKey && key === "h") {
      e.preventDefault();
      toggleWrap(c, "mark");
      return;
    }
    if (mod && !e.shiftKey && key === "k") {
      e.preventDefault();
      linkBox(c);
      return;
    }
    if (mod && !e.shiftKey && (key === "b" || key === "i")) {
      checkpoint();
      return;
    }

    // Arrow keys move between blocks at the first or last line
    if (!collapsed || e.shiftKey || mod || e.altKey) return;
    const box = c.getBoundingClientRect(), cr = caretRect();
    if (!cr) return;
    const row = parseFloat(getComputedStyle(c).lineHeight) || 24;
    const goTo = (j, atEnd, x, y) => {
      const t = contentOf(blocks()[j].id);
      if (blocks()[j].type === "code") setCaret(t, atEnd ? "end" : 0);
      else caretAtX(t, x, y(t.getBoundingClientRect()));
    };
    if (e.key === "ArrowUp" && cr.top - box.top < row * 0.6) {
      const p = editableIndex(i, -1);
      e.preventDefault();
      if (p === -1) setCaret(titleEl, "end");
      else goTo(p, true, cr.left, pb => pb.bottom - 4);
    } else if (e.key === "ArrowDown" && box.bottom - cr.bottom < row * 0.6) {
      const n = editableIndex(i, 1);
      if (n === -1) return;
      e.preventDefault();
      goTo(n, false, cr.left, nb => nb.top + 4);
    } else if (e.key === "ArrowLeft" && textBefore(c) === "") {
      const p = editableIndex(i, -1);
      if (p === -1) return;
      e.preventDefault();
      setCaret(contentOf(blocks()[p].id), "end");
    } else if (e.key === "ArrowRight" && textAfter(c) === "") {
      const n = editableIndex(i, 1);
      if (n === -1) return;
      e.preventDefault();
      setCaret(contentOf(blocks()[n].id), 0);
    }
  });

  // ---- Tables ----

  const DOTS_V = '<svg width="4" height="12" viewBox="0 0 4 12">'
    + '<circle cx="2" cy="2" r="1.3"/><circle cx="2" cy="6" r="1.3"/>'
    + '<circle cx="2" cy="10" r="1.3"/></svg>';
  const DOTS_H = '<svg width="12" height="4" viewBox="0 0 12 4">'
    + '<circle cx="2" cy="2" r="1.3"/><circle cx="6" cy="2" r="1.3"/>'
    + '<circle cx="10" cy="2" r="1.3"/></svg>';

  function tableEl(b) {
    const wrap = document.createElement("div");
    wrap.className = "tbl-wrap";
    const area = document.createElement("div");
    area.className = "tbl-area";
    const table = document.createElement("table");
    table.className = "ntable" + (b.headRow ? " head-row" : "")
      + (b.headCol ? " head-col" : "");
    const group = document.createElement("colgroup");
    b.widths.forEach(w => {
      const col = document.createElement("col");
      col.style.width = w + "px";
      group.appendChild(col);
    });
    table.appendChild(group);
    b.rows.forEach((row, r) => {
      const tr = document.createElement("tr");
      if (b.rowColors[r]) tr.className = "bg-" + b.rowColors[r];
      row.forEach((html, c) => {
        const td = document.createElement("td");
        const colour = b.cellColors[r + "," + c] || b.colColors[c];
        if (colour && !(b.rowColors[r] && !b.cellColors[r + "," + c])) {
          td.className = "bg-" + colour;
        }
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.contentEditable = "true";
        cell.spellcheck = true;
        cell.dataset.r = r;
        cell.dataset.c = c;
        cell.innerHTML = decorate(html);
        td.appendChild(cell);
        if (c === 0) td.appendChild(grip("row-grip", DOTS_V, r));
        if (r === 0) {
          td.appendChild(grip("col-grip", DOTS_H, c));
          const rz = document.createElement("div");
          rz.className = "col-resize tbl-ui";
          rz.dataset.c = c;
          rz.title = "drag to resize";
          td.appendChild(rz);
        }
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
    const addRow = document.createElement("button");
    addRow.className = "add-row-bar tbl-ui";
    addRow.type = "button";
    addRow.textContent = "+";
    addRow.title = "add a row";
    const addCol = document.createElement("button");
    addCol.className = "add-col-bar tbl-ui";
    addCol.type = "button";
    addCol.textContent = "+";
    addCol.title = "add a column";
    area.append(table, addRow, addCol);
    wrap.appendChild(area);
    return wrap;
  }

  function grip(cls, icon, index) {
    const g = document.createElement("button");
    g.className = cls + " tbl-ui";
    g.type = "button";
    g.innerHTML = icon;
    g.dataset.i = index;
    g.title = cls === "row-grip" ? "row options" : "column options";
    return g;
  }

  const cellAt = (id, r, c) => blocksEl.querySelector('.block[data-id="'
    + id + '"] .cell[data-r="' + r + '"][data-c="' + c + '"]');

  function focusCell(id, r, c, pos) {
    const el = cellAt(id, r, c);
    if (el) setCaret(el, pos === undefined ? "end" : pos);
  }

  function syncCell(cell) {
    const b = byId(cell.closest(".block").dataset.id);
    if (!b || b.type !== "table") return;
    if (cell.innerHTML === "<br>") cell.innerHTML = "";
    const html = clean(cell.innerHTML);
    const r = +cell.dataset.r, c = +cell.dataset.c;
    if (b.rows[r] && b.rows[r][c] !== html) {
      b.rows[r][c] = html;
      save();
    }
  }

  // Structural changes: rows and columns
  function addRowAt(b, at) {
    b.rows.splice(at, 0, b.rows[0].map(() => ""));
    b.rowColors.splice(at, 0, null);
    shiftCellColors(b, "r", at, 1);
  }

  function addColAt(b, at) {
    b.rows.forEach(r => r.splice(at, 0, ""));
    b.widths.splice(at, 0, 160);
    b.colColors.splice(at, 0, null);
    shiftCellColors(b, "c", at, 1);
  }

  function removeRow(b, at) {
    if (b.rows.length < 2) return false;
    b.rows.splice(at, 1);
    b.rowColors.splice(at, 1);
    shiftCellColors(b, "r", at, -1);
    return true;
  }

  function removeCol(b, at) {
    if (b.rows[0].length < 2) return false;
    b.rows.forEach(r => r.splice(at, 1));
    b.widths.splice(at, 1);
    b.colColors.splice(at, 1);
    shiftCellColors(b, "c", at, -1);
    return true;
  }

  // Keep cell colours with their cells as rows or columns move
  function shiftCellColors(b, axis, at, by) {
    const next = {};
    Object.entries(b.cellColors).forEach(([k, v]) => {
      let [r, c] = k.split(",").map(Number);
      const i = axis === "r" ? r : c;
      if (by < 0 && i === at) return;
      const moved = i >= at ? i + by : i;
      if (axis === "r") r = moved; else c = moved;
      next[r + "," + c] = v;
    });
    b.cellColors = next;
  }

  function swapRows(b, a, z) {
    [b.rows[a], b.rows[z]] = [b.rows[z], b.rows[a]];
    [b.rowColors[a], b.rowColors[z]] = [b.rowColors[z], b.rowColors[a]];
    swapColors(b, "r", a, z);
  }

  function swapCols(b, a, z) {
    b.rows.forEach(r => { [r[a], r[z]] = [r[z], r[a]]; });
    [b.widths[a], b.widths[z]] = [b.widths[z], b.widths[a]];
    [b.colColors[a], b.colColors[z]] = [b.colColors[z], b.colColors[a]];
    swapColors(b, "c", a, z);
  }

  function swapColors(b, axis, a, z) {
    const next = {};
    Object.entries(b.cellColors).forEach(([k, v]) => {
      let [r, c] = k.split(",").map(Number);
      if (axis === "r") r = r === a ? z : r === z ? a : r;
      else c = c === a ? z : c === z ? a : c;
      next[r + "," + c] = v;
    });
    b.cellColors = next;
  }

  function tableChange(b, fn, focus) {
    checkpoint();
    fn();
    save();
    renderBlocks();
    if (focus) focusCell(b.id, focus[0], focus[1], focus[2]);
  }

  function rowMenu(anchor, b, r) {
    const n = b.rows.length;
    showMenu(anchor, [
      { label: "insert above", run: () => tableChange(b,
        () => addRowAt(b, r), [r, 0]) },
      { label: "insert below", run: () => tableChange(b,
        () => addRowAt(b, r + 1), [r + 1, 0]) },
      { label: "duplicate", run: () => tableChange(b, () => {
        addRowAt(b, r + 1);
        b.rows[r + 1] = [...b.rows[r]];
        b.rowColors[r + 1] = b.rowColors[r];
      }) },
      { label: "move up", run: () => r > 0
        && tableChange(b, () => swapRows(b, r, r - 1)) },
      { label: "move down", run: () => r < n - 1
        && tableChange(b, () => swapRows(b, r, r + 1)) },
      { heading: "row colour" },
      { active: b.rowColors[r], pick: col => tableChange(b, () => {
        b.rowColors[r] = col;
      }), swatches: true },
      { rule: true },
      { danger: true, label: "delete row", run: () => tableChange(b,
        () => removeRow(b, r)) }
    ]);
  }

  function colMenu(anchor, b, c) {
    const n = b.rows[0].length;
    showMenu(anchor, [
      { label: "insert left", run: () => tableChange(b,
        () => addColAt(b, c), [0, c]) },
      { label: "insert right", run: () => tableChange(b,
        () => addColAt(b, c + 1), [0, c + 1]) },
      { label: "duplicate", run: () => tableChange(b, () => {
        addColAt(b, c + 1);
        b.rows.forEach(row => { row[c + 1] = row[c]; });
        b.widths[c + 1] = b.widths[c];
        b.colColors[c + 1] = b.colColors[c];
      }) },
      { label: "move left", run: () => c > 0
        && tableChange(b, () => swapCols(b, c, c - 1)) },
      { label: "move right", run: () => c < n - 1
        && tableChange(b, () => swapCols(b, c, c + 1)) },
      { heading: "column colour" },
      { active: b.colColors[c], pick: col => tableChange(b, () => {
        b.colColors[c] = col;
      }), swatches: true },
      { rule: true },
      { danger: true, label: "delete column", run: () => tableChange(b,
        () => removeCol(b, c)) }
    ]);
  }

  // Right-click a cell to colour just that cell
  function cellMenu(e, cell) {
    const b = byId(cell.closest(".block").dataset.id);
    const key = cell.dataset.r + "," + cell.dataset.c;
    e.preventDefault();
    showMenu({ getBoundingClientRect: () => ({ bottom: e.clientY,
      left: e.clientX, top: e.clientY }) }, [
      { heading: "cell colour" },
      { active: b.cellColors[key] || null, pick: col => tableChange(b, () => {
        if (col) b.cellColors[key] = col;
        else delete b.cellColors[key];
      }), swatches: true }
    ]);
  }

  blocksEl.addEventListener("contextmenu", e => {
    const cell = e.target.closest(".cell");
    if (cell) cellMenu(e, cell);
  });

  blocksEl.addEventListener("click", e => {
    const ui = e.target.closest(".tbl-ui");
    if (!ui || ui.classList.contains("col-resize")) return;
    const b = byId(ui.closest(".block").dataset.id);
    if (!b) return;
    if (ui.classList.contains("add-row-bar")) {
      tableChange(b, () => addRowAt(b, b.rows.length), [b.rows.length, 0]);
    } else if (ui.classList.contains("add-col-bar")) {
      tableChange(b, () => addColAt(b, b.rows[0].length),
        [0, b.rows[0].length]);
    } else if (ui.classList.contains("row-grip")) {
      rowMenu(ui, b, +ui.dataset.i);
    } else if (ui.classList.contains("col-grip")) {
      colMenu(ui, b, +ui.dataset.i);
    }
  });

  // Show a column's grip while the pointer is in that column
  blocksEl.addEventListener("mouseover", e => {
    const cell = e.target.closest(".ntable td");
    const table = e.target.closest(".ntable");
    blocksEl.querySelectorAll(".col-grip.show").forEach(g => {
      if (!table || !table.contains(g)
        || g.dataset.i !== String(cell && cell.cellIndex)) {
        g.classList.remove("show");
      }
    });
    if (!cell) return;
    const g = table.querySelector('.col-grip[data-i="' + cell.cellIndex + '"]');
    if (g) g.classList.add("show");
  });

  // Drag a column's edge to change its width
  blocksEl.addEventListener("pointerdown", e => {
    const rz = e.target.closest(".col-resize");
    if (!rz || e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    const b = byId(rz.closest(".block").dataset.id);
    const c = +rz.dataset.c;
    const col = rz.closest("table").querySelectorAll("col")[c];
    const x0 = e.clientX, w0 = b.widths[c];
    rz.classList.add("on");
    let w = w0;
    const move = ev => {
      w = Math.max(60, Math.min(900, Math.round(w0 + ev.clientX - x0)));
      col.style.width = w + "px";
    };
    const up = () => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      rz.classList.remove("on");
      if (w !== w0) {
        checkpoint();
        b.widths[c] = w;
        save();
      }
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  }, true);

  // Typing and moving between cells
  blocksEl.addEventListener("keydown", e => {
    const cell = e.target.closest(".cell");
    if (!cell || e.isComposing) return;
    const b = byId(cell.closest(".block").dataset.id);
    if (!b) return;
    const r = +cell.dataset.r, c = +cell.dataset.c;
    const rows = b.rows.length, cols = b.rows[0].length;
    const mod = e.ctrlKey || e.metaKey, key = e.key.toLowerCase();
    const sel = selRange(), collapsed = sel && sel.collapsed;
    const go = (rr, cc, pos) => {
      e.preventDefault();
      focusCell(b.id, rr, cc, pos);
    };

    if (e.key === "Tab") {
      e.preventDefault();
      if (e.shiftKey) {
        if (c > 0) go(r, c - 1);
        else if (r > 0) go(r - 1, cols - 1);
      } else if (c < cols - 1) {
        go(r, c + 1);
      } else if (r < rows - 1) {
        go(r + 1, 0);
      } else {
        tableChange(b, () => addRowAt(b, rows), [rows, 0]);
      }
      return;
    }
    if (e.key === "Enter" && !e.shiftKey && !mod) {
      e.preventDefault();
      if (r < rows - 1) go(r + 1, c);
      else tableChange(b, () => addRowAt(b, rows), [rows, c]);
      return;
    }
    if (e.key === "Escape") {
      e.preventDefault();
      cell.blur();
      getSelection().removeAllRanges();
      select([b.id], b.id);
      return;
    }
    if (mod && !e.shiftKey && key === "e") {
      e.preventDefault();
      toggleWrap(cell, "code");
      return;
    }
    if (mod && e.shiftKey && key === "s") {
      e.preventDefault();
      toggleWrap(cell, "s");
      return;
    }
    if (mod && e.shiftKey && key === "h") {
      e.preventDefault();
      toggleWrap(cell, "mark");
      return;
    }
    if (mod && !e.shiftKey && key === "k") {
      e.preventDefault();
      linkBox(cell);
      return;
    }
    if (mod && !e.shiftKey && (key === "b" || key === "i")) {
      checkpoint();
      return;
    }
    if (!collapsed || e.shiftKey || mod || e.altKey) return;
    const before = textBefore(cell), after = textAfter(cell);
    if (e.key === "ArrowLeft" && before === "" && (c > 0 || r > 0)) {
      go(c > 0 ? r : r - 1, c > 0 ? c - 1 : cols - 1, "end");
    } else if (e.key === "ArrowRight" && after === ""
      && (c < cols - 1 || r < rows - 1)) {
      go(c < cols - 1 ? r : r + 1, c < cols - 1 ? c + 1 : 0, 0);
    } else if (e.key === "ArrowUp" && !before.includes("\n")) {
      if (r > 0) go(r - 1, c);
      else {
        const p = editableIndex(indexOf(b.id), -1);
        if (p !== -1 && contentOf(blocks()[p].id)) {
          e.preventDefault();
          setCaret(contentOf(blocks()[p].id), "end");
        }
      }
    } else if (e.key === "ArrowDown" && !after.includes("\n")) {
      if (r < rows - 1) go(r + 1, c);
      else {
        e.preventDefault();
        const i = indexOf(b.id);
        const n = editableIndex(i, 1);
        if (n !== -1 && contentOf(blocks()[n].id)) {
          setCaret(contentOf(blocks()[n].id), 0);
        } else {
          checkpoint();
          const nb = newBlock("text", "", b.indent);
          blocks().splice(subtreeEnd(i), 0, nb);
          commit(nb.id, 0);
        }
      }
    }
  });

  blocksEl.addEventListener("input", e => {
    const cell = e.target.closest(".cell");
    if (!cell) return;
    const typed = e.inputType === "insertText" ? e.data : null;
    if (typed && /[*`~]$/.test(typed)) inlineShortcut(cell);
    if (typed === " ") autoLink();
    syncCell(cell);
  });

  // Pasted text goes in as plain text
  blocksEl.addEventListener("paste", e => {
    const cell = e.target.closest(".cell");
    if (!cell) return;
    e.preventDefault();
    checkpoint();
    document.execCommand("insertText", false,
      (e.clipboardData.getData("text/plain") || "").replace(/\r\n?/g, "\n"));
  }, true);

  // Checkboxes and toggle arrows
  blocksEl.addEventListener("click", e => {
    const el = e.target.closest(".block");
    if (!el) return;
    const b = byId(el.dataset.id);
    if (e.target.matches('input[type="checkbox"]')) {
      checkpoint();
      b.checked = e.target.checked;
      if (b.checked) b.doneAt = Date.now();
      else delete b.doneAt;
      el.classList.toggle("checked", b.checked);
      save();
    } else if (e.target.closest(".toggle-arrow")) {
      checkpoint();
      b.open = !b.open;
      el.classList.toggle("open", b.open);
      const arrow = el.querySelector(".toggle-arrow");
      arrow.setAttribute("aria-label", b.open ? "collapse" : "expand");
      save();
      showToggle(b);
    }
  });

  // Show or hide a toggle's contents in place, so the arrow turns and
  // the blocks slide rather than the note being redrawn
  function applyHidden() {
    const hidden = hiddenIds();
    blocksEl.querySelectorAll(".block").forEach(x => {
      x.classList.toggle("hidden", hidden.has(x.dataset.id));
    });
  }

  function showToggle(b) {
    const i = indexOf(b.id);
    const els = blocks().slice(i + 1, subtreeEnd(i))
      .map(x => blocksEl.querySelector('.block[data-id="' + x.id + '"]'))
      .filter(Boolean);
    const play = (x, cls) => {
      x.classList.remove("reveal", "conceal");
      void x.offsetWidth;
      x.classList.add(cls);
      x.addEventListener("animationend", () => x.classList.remove(cls),
        { once: true });
    };
    if (b.open) {
      applyHidden();
      els.filter(x => !x.classList.contains("hidden"))
        .forEach(x => play(x, "reveal"));
    } else {
      const shown = els.filter(x => !x.classList.contains("hidden"));
      shown.forEach(x => play(x, "conceal"));
      setTimeout(applyHidden, 150);
    }
  }

  // A toggle's arrow dims when nothing is in it but empty lines
  function markEmptyToggles() {
    if (!current) return;
    const list = blocks();
    list.forEach((b, i) => {
      if (b.type !== "toggle") return;
      const has = list.slice(i + 1, subtreeEnd(i)).some(x =>
        ["divider", "table"].includes(x.type) || blockText(x).trim());
      const el = blocksEl.querySelector('.block[data-id="' + b.id + '"]');
      if (el) el.classList.toggle("empty", !has);
    });
  }

  // ---- Title and date ----

  titleEl.addEventListener("input", () => {
    if (titleEl.innerHTML === "<br>") titleEl.innerHTML = "";
    current.title = titleEl.textContent;
    save();
    noteTitle();
  });
  titleEl.addEventListener("paste", e => {
    e.preventDefault();
    checkpoint();
    const text = e.clipboardData.getData("text/plain").replace(/\s+/g, " ");
    document.execCommand("insertText", false, text);
  });
  titleEl.addEventListener("keydown", e => {
    const first = () => {
      const k = editableIndex(-1, 1);
      if (k !== -1) return contentOf(blocks()[k].id);
      blocks().unshift(newBlock());
      commit();
      return contentOf(blocks()[0].id);
    };
    if (e.key === "Enter") {
      e.preventDefault();
      setCaret(first(), 0);
    } else if (e.key === "ArrowDown" || (e.key === "ArrowRight"
      && textAfter(titleEl) === "")) {
      const cr = caretRect(), box = titleEl.getBoundingClientRect();
      if (e.key === "ArrowDown" && cr && box.bottom - cr.bottom > 20) return;
      e.preventDefault();
      setCaret(first(), 0);
    }
  });

  // Click the date to type a new one
  dateEl.addEventListener("click", () => {
    if (dateEl.isContentEditable) return;
    dateEl.contentEditable = "true";
    dateEl.focus();
    const r = document.createRange();
    r.selectNodeContents(dateEl);
    getSelection().removeAllRanges();
    getSelection().addRange(r);
  });
  function finishDate(keep) {
    if (!dateEl.isContentEditable) return;
    const d = keep && parseDay(dateEl.textContent, dayStart(new Date()));
    if (keep && !d) {
      dateEl.classList.add("invalid");
      dateEl.title = "try today, friday, 2/11 or 2 nov 2026";
      setTimeout(() => {
        dateEl.classList.remove("invalid");
        dateEl.title = "click to change the date";
      }, 1500);
    }
    dateEl.contentEditable = "false";
    if (d && isoDay(d) !== current.date) {
      checkpoint();
      current.date = isoDay(d);
      save();
    }
    renderDate();
  }
  dateEl.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      finishDate(true);
      dateEl.blur();
    } else if (e.key === "Escape") {
      e.preventDefault();
      finishDate(false);
      dateEl.blur();
    }
  });
  dateEl.addEventListener("blur", () => finishDate(true));
  dateEl.addEventListener("paste", e => {
    e.preventDefault();
    document.execCommand("insertText", false,
      e.clipboardData.getData("text/plain").replace(/\s+/g, " "));
  });

  // ---- Floating format menu ----

  function selectionHost() {
    const r = selRange();
    if (!r) return null;
    const node = r.commonAncestorContainer;
    return (node.nodeType === 1 ? node : node.parentElement)
      .closest("#blocks .content, #blocks .cell");
  }

  function updateFmt() {
    const r = selRange();
    const host = selectionHost();
    if (!r || r.collapsed || !host || host.closest(".type-code")) {
      fmt.classList.remove("show");
      return;
    }
    fmt.classList.add("show");
    const rect = r.getBoundingClientRect();
    const w = fmt.offsetWidth, h = fmt.offsetHeight;
    let left = rect.left + rect.width / 2 - w / 2;
    left = Math.max(8, Math.min(left, innerWidth - w - 8));
    const top = rect.top - h - 8 > 4 ? rect.top - h - 8 : rect.bottom + 8;
    fmt.style.left = left + "px";
    fmt.style.top = top + "px";
    const node = r.commonAncestorContainer;
    const el = node.nodeType === 1 ? node : node.parentElement;
    const inside = tag => !!el.closest(tag);
    fmt.querySelector('[data-cmd="bold"]').classList
      .toggle("on", document.queryCommandState("bold"));
    fmt.querySelector('[data-cmd="italic"]').classList
      .toggle("on", document.queryCommandState("italic"));
    [["s", "s"], ["code", "code"], ["mark", "mark"], ["link", "a"]]
      .forEach(([cmd, tag]) => {
        fmt.querySelector('[data-cmd="' + cmd + '"]').classList
          .toggle("on", inside(tag));
      });
  }

  document.addEventListener("selectionchange", updateFmt);
  content.addEventListener("scroll", updateFmt);
  fmt.addEventListener("mousedown", e => e.preventDefault());
  fmt.addEventListener("click", e => {
    const btn = e.target.closest("button");
    const c = selectionHost();
    if (!btn || !c) return;
    const cmd = btn.dataset.cmd;
    if (cmd === "bold" || cmd === "italic") execFormat(c, cmd);
    else if (cmd === "link") linkBox(c);
    else if (cmd === "markc") markColours(c, btn);
    else toggleWrap(c, cmd);
  });

  // Highlight colours: teal by default, or a block colour
  function markColours(c, btn) {
    const r = selRange();
    if (!r || r.collapsed || !c.contains(r.commonAncestorContainer)) return;
    const saved = r.cloneRange();
    hideMenus();
    const menu = document.createElement("div");
    menu.className = "menu";
    menu.addEventListener("mousedown", e => e.preventDefault());
    const lab = document.createElement("div");
    lab.className = "menu-label";
    lab.textContent = "highlight";
    menu.appendChild(lab);
    menu.appendChild(swatches(undefined, col => {
      const s = getSelection();
      s.removeAllRanges();
      s.addRange(saved);
      checkpoint();
      const node = saved.commonAncestorContainer;
      let m = (node.nodeType === 1 ? node : node.parentElement).closest("mark");
      if (!m || !c.contains(m)) {
        m = document.createElement("mark");
        m.appendChild(saved.extractContents());
        m.querySelectorAll("mark").forEach(x => x.replaceWith(...x.childNodes));
        saved.insertNode(m);
      }
      if (col) m.dataset.c = col;
      else delete m.dataset.c;
      syncBlock(c);
      updateFmt();
    }, true));
    menu.querySelectorAll(".swatch").forEach(s => {
      if (s.title === "default") {
        s.title = "teal";
        s.style.background = "color-mix(in srgb, var(--accent) 30%, var(--bg))";
      }
    });
    placeMenu(menu, btn);
  }

  // A small box for a link's address
  function linkBox(c) {
    const r = selRange();
    if (!r || !c.contains(r.commonAncestorContainer)) return;
    const saved = r.cloneRange();
    const node = r.commonAncestorContainer;
    const existing = (node.nodeType === 1 ? node : node.parentElement)
      .closest("a");
    hideMenus();
    fmt.classList.remove("show");
    const box = document.createElement("div");
    box.className = "menu linkbox";
    const input = document.createElement("input");
    input.placeholder = existing ? "edit the address, or clear it to unlink"
      : "paste a link and press enter";
    input.value = existing ? existing.getAttribute("href") : "";
    box.appendChild(input);
    const rect = r.getBoundingClientRect();
    app.appendChild(box);
    box.style.left = Math.max(8, Math.min(rect.left,
      innerWidth - box.offsetWidth - 8)) + "px";
    box.style.top = (rect.bottom + 8) + "px";
    input.focus();
    input.select();

    const back = () => {
      c.focus();
      const s = getSelection();
      s.removeAllRanges();
      s.addRange(saved);
    };
    input.addEventListener("keydown", e => {
      e.stopPropagation();
      if (e.key === "Escape") {
        e.preventDefault();
        box.remove();
        back();
      }
      if (e.key !== "Enter") return;
      e.preventDefault();
      const href = safeHref(input.value) || (input.value.trim()
        ? safeHref("https://" + input.value.trim()) : "");
      box.remove();
      back();
      checkpoint();
      if (existing && c.contains(existing)) {
        if (href) existing.setAttribute("href", href);
        else existing.replaceWith(...existing.childNodes);
      } else if (href) {
        const sel = getSelection().getRangeAt(0);
        const a = document.createElement("a");
        a.href = href;
        if (sel.collapsed) a.textContent = input.value.trim();
        else a.appendChild(sel.extractContents());
        sel.insertNode(a);
        const after = document.createRange();
        after.setStartAfter(a);
        after.collapse(true);
        getSelection().removeAllRanges();
        getSelection().addRange(after);
      }
      syncBlock(c);
    });
  }

  // ---- The / menu ----

  let slash = null;

  // Matching types; an exact shortcut (/to for to do) comes first
  function slashItems(q) {
    const w = q.toLowerCase();
    const rank = t => ALIASES[t].includes(w) ? 0 : TYPES[t].startsWith(w)
      ? 1 : 2;
    return Object.keys(TYPES).filter(t => !w || TYPES[t].includes(w)
      || ALIASES[t].some(a => a.startsWith(w)))
      .sort((x, y) => rank(x) - rank(y));
  }

  function updateSlash(c, b, typed) {
    if (b.type === "code") return closeSlash();
    const before = textBefore(c);
    if (before === null) return closeSlash();
    if (!slash && typed === "/") {
      const k = before.length - 1;
      if (k === 0 || /\s/.test(before[k - 1])) {
        slash = { at: k, blockId: b.id, index: 0 };
      }
    }
    if (!slash) return;
    if (slash.blockId !== b.id || before.length <= slash.at
      || before[slash.at] !== "/") return closeSlash();
    const q = before.slice(slash.at + 1);
    if (/\s/.test(q)) return closeSlash();
    const list = slashItems(q);
    if (!list.length) return closeSlash();
    slash.list = list;
    slash.index = Math.min(slash.index, list.length - 1);
    drawSlash(c);
  }

  function drawSlash(c) {
    if (slash.menu) slash.menu.remove();
    hideMenus(true);
    const menu = document.createElement("div");
    menu.className = "menu slash-menu";
    const head = document.createElement("div");
    head.className = "menu-label";
    head.textContent = "turn into";
    menu.appendChild(head);
    slash.list.forEach((t, k) => {
      const btn = document.createElement("button");
      btn.className = "menu-item sym" + (k === slash.index ? " hl" : "");
      btn.type = "button";
      btn.innerHTML = '<span class="m-sym">' + TYPE_SYMS[t] + "</span>"
        + '<span class="m-name"></span><span class="m-hint">'
        + TYPE_HINTS[t] + "</span>";
      btn.querySelector(".m-name").textContent = TYPES[t];
      btn.addEventListener("mousedown", e => e.preventDefault());
      btn.addEventListener("click", () => applySlash(c, t));
      menu.appendChild(btn);
    });
    app.appendChild(menu);
    slash.menu = menu;
    const cr = caretRect() || c.getBoundingClientRect();
    let top = cr.bottom + 6;
    if (top + menu.offsetHeight > innerHeight - 8) {
      top = Math.max(8, cr.top - menu.offsetHeight - 6);
    }
    menu.style.left = Math.min(cr.left, innerWidth - menu.offsetWidth - 8)
      + "px";
    menu.style.top = top + "px";
    const hl = menu.querySelector(".hl");
    if (hl) hl.scrollIntoView({ block: "nearest" });
  }

  function closeSlash() {
    if (slash && slash.menu) slash.menu.remove();
    slash = null;
  }

  function slashKeys(e) {
    const c = contentOf(slash.blockId);
    if (!c || !slash.list) return false;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const n = slash.list.length;
      slash.index = (slash.index + (e.key === "ArrowDown" ? 1 : n - 1)) % n;
      drawSlash(c);
      return true;
    }
    if (e.key === "Enter" || e.key === "Tab") {
      e.preventDefault();
      applySlash(c, slash.list[slash.index]);
      return true;
    }
    if (e.key === "Escape") {
      e.preventDefault();
      closeSlash();
      return true;
    }
    return false;
  }

  function applySlash(c, type) {
    const b = byId(slash.blockId);
    const before = textBefore(c) || "";
    const at = slash.at;
    closeSlash();
    if (!b) return;
    checkpoint();
    const r = rangeAt(c, at, before.length);
    r.deleteContents();
    syncBlock(c);
    const i = indexOf(b.id);
    if (!plain(b.html).trim()) {
      setType(b, type);
      b.html = "";
      if (type === "divider") {
        const nb = newBlock("text", "", b.indent);
        blocks().splice(i + 1, 0, nb);
        return commit(nb.id, 0);
      }
      return commit(b.id, 0);
    }
    const nb = newBlock(type, "", b.indent);
    blocks().splice(subtreeEnd(i), 0, nb);
    if (type === "divider") {
      const tb = newBlock("text", "", b.indent);
      blocks().splice(subtreeEnd(i) + 1, 0, tb);
      return commit(tb.id, 0);
    }
    commit(nb.id, 0);
  }

  // ---- Block selection ----

  function select(ids, anchor) {
    selected = new Set(ids);
    if (anchor !== undefined) selAnchor = anchor;
    blocksEl.querySelectorAll(".block").forEach(el => {
      el.classList.toggle("selected", selected.has(el.dataset.id));
    });
  }

  function clearSelection() {
    if (selected.size) select([]);
    selAnchor = null;
  }

  function rangeIds(aId, bId) {
    const hidden = hiddenIds();
    let a = indexOf(aId), z = indexOf(bId);
    if (a > z) [a, z] = [z, a];
    return blocks().slice(a, z + 1).filter(b => !hidden.has(b.id))
      .map(b => b.id);
  }

  // Selected blocks plus everything indented under them, in order
  function selectedSpan() {
    const list = blocks();
    const idx = list.map((b, i) => selected.has(b.id) ? i : -1)
      .filter(i => i !== -1);
    if (!idx.length) return null;
    const start = idx[0];
    const end = Math.max(...idx.map(i => subtreeEnd(i)));
    return [start, end];
  }

  // Ctrl+A in a block first selects its text, as usual; pressed again
  // (or outside the text) it selects every block, ready to copy
  document.addEventListener("keydown", e => {
    if (!current || !(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey
      || e.key.toLowerCase() !== "a") return;
    const a = document.activeElement;
    if (a === titleEl || (a && a.matches && a.matches("input, textarea"))) {
      return;
    }
    const c = a && a.closest && a.closest("#blocks .content, #blocks .cell");
    if (c) {
      if (textBefore(c) !== "" || textAfter(c) !== "") return;
    } else if (a && a.isContentEditable) {
      return;
    }
    e.preventDefault();
    e.stopPropagation();
    if (a && a.blur) a.blur();
    getSelection().removeAllRanges();
    const ids = visibleBlockEls().map(x => x.dataset.id);
    select(ids, ids[0]);
  }, true);

  document.addEventListener("copy", e => {
    if (!current || !selected.size) return;
    if (document.activeElement.isContentEditable) return;
    const span = selectedSpan();
    e.preventDefault();
    e.clipboardData.setData("text/plain",
      blocksToMd(blocks().slice(span[0], span[1])));
  });

  // Undo and redo anywhere in an open note
  document.addEventListener("keydown", e => {
    if (!current || !(e.ctrlKey || e.metaKey)) return;
    const a = document.activeElement;
    if (a && a.closest && a.closest(".linkbox, #search")) return;
    if (a === dateEl && dateEl.isContentEditable) return;
    const key = e.key.toLowerCase();
    if (key === "z" && !e.shiftKey) {
      e.preventDefault();
      e.stopPropagation();
      closeSlash();
      undo();
    } else if (key === "y" || (key === "z" && e.shiftKey)) {
      e.preventDefault();
      e.stopPropagation();
      closeSlash();
      redo();
    }
  }, true);

  document.addEventListener("keydown", e => {
    if (e.defaultPrevented || !current || !selected.size) return;
    if (document.activeElement && document.activeElement.isContentEditable) {
      return;
    }
    if (document.querySelector(".menu")) return;
    const span = selectedSpan();
    if (!span) return;
    const ids = [...selected];

    if (e.key === "Escape") {
      clearSelection();
    } else if (e.key === "Tab") {
      e.preventDefault();
      checkpoint();
      if (e.shiftKey) {
        for (let j = span[0]; j < span[1]; j++) {
          if (blocks()[j].indent > 0) blocks()[j].indent--;
        }
      } else {
        const p = visibleIndex(span[0], -1);
        if (p === -1 || blocks()[span[0]].indent > blocks()[p].indent) return;
        for (let j = span[0]; j < span[1]; j++) blocks()[j].indent++;
      }
      commit();
    } else if (e.key === "Backspace" || e.key === "Delete") {
      e.preventDefault();
      checkpoint();
      blocks().splice(span[0], span[1] - span[0]);
      if (!blocks().length) blocks().push(newBlock());
      selected = new Set();
      const k = Math.min(span[0], blocks().length - 1);
      commit();
      const target = blocks()[k];
      if (target.type !== "divider") setCaret(contentOf(target.id), "end");
    } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      e.preventDefault();
      const step = e.key === "ArrowUp" ? -1 : 1;
      const edgeId = ids.reduce((a, id) => (step < 0
        ? indexOf(id) < indexOf(a) : indexOf(id) > indexOf(a)) ? id : a);
      const j = visibleIndex(indexOf(edgeId), step);
      if (j === -1) return;
      const id = blocks()[j].id;
      if (e.shiftKey) select(rangeIds(selAnchor || id, id));
      else select([id], id);
    } else if (e.key === "Enter") {
      e.preventDefault();
      const last = blocks()[span[1] - 1];
      const target = last.type === "divider" ? null : contentOf(last.id);
      clearSelection();
      if (target) setCaret(target, "end");
    }
  });

  // ---- Pointer: block selection, clicks on the page, and dragging ----

  function visibleBlockEls() {
    return [...blocksEl.querySelectorAll(".block:not(.hidden)")];
  }

  function blockAtY(y) {
    const els = visibleBlockEls();
    for (const el of els) {
      if (el.getBoundingClientRect().bottom > y) return el;
    }
    return els[els.length - 1];
  }

  noteEl.addEventListener("pointerdown", e => {
    if (e.button !== 0 || !current) return;
    if (e.target.closest(".handle")) return startHandle(e);
    if (e.target.closest(".tbl-ui")) return;
    if (e.target.closest(".note-head, .marker")) {
      if (!e.target.closest(".marker")) clearSelection();
      return;
    }
    const startEl = blockAtY(e.clientY);
    if (!startEl) return;
    const inContent = e.target.closest(".content, .cell");

    // Ctrl+click adds a block to the selection, or takes it out
    if ((e.ctrlKey || e.metaKey) && !e.target.closest(".content a")) {
      e.preventDefault();
      if (document.activeElement.isContentEditable) {
        document.activeElement.blur();
      }
      getSelection().removeAllRanges();
      const id = startEl.dataset.id;
      const next = new Set(selected);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      select([...next], id);
      return;
    }

    // Shift-click selects a run of blocks
    if (e.shiftKey) {
      const active = document.activeElement.closest
        && document.activeElement.closest(".block");
      const anchor = selAnchor || (active && active.dataset.id);
      if (anchor) {
        e.preventDefault();
        document.activeElement.blur();
        getSelection().removeAllRanges();
        select(rangeIds(anchor, startEl.dataset.id), anchor);
        return;
      }
    }

    clearSelection();
    if (!inContent) e.preventDefault();
    const x0 = e.clientX, y0 = e.clientY;
    let selecting = false;

    const move = ev => {
      const el = blockAtY(ev.clientY);
      if (!selecting && (el !== startEl
        || (!inContent && Math.abs(ev.clientY - y0) > 4))) {
        selecting = true;
        if (document.activeElement.isContentEditable) {
          document.activeElement.blur();
        }
      }
      if (selecting) {
        getSelection().removeAllRanges();
        select(rangeIds(startEl.dataset.id, el.dataset.id),
          startEl.dataset.id);
      }
    };
    const up = ev => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      if (selecting || inContent) return;
      if (Math.abs(ev.clientX - x0) > 4 || Math.abs(ev.clientY - y0) > 4) {
        return;
      }
      clickPage(ev);
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  });

  // A click beside a block edits it; below the last block adds a line
  function clickPage(e) {
    const els = visibleBlockEls();
    const last = els[els.length - 1];
    if (!last || e.clientY > last.getBoundingClientRect().bottom) {
      const lb = blocks()[blocks().length - 1];
