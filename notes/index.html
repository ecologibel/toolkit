      if (lb && lb.type === "text" && !lb.html && lb.indent === 0) {
        setCaret(contentOf(lb.id), 0);
        return;
      }
      checkpoint();
      const nb = newBlock();
      blocks().push(nb);
      commit(nb.id, 0);
      return;
    }
    const el = blockAtY(e.clientY);
    const c = el.querySelector(".content");
    if (!c) {
      select([el.dataset.id], el.dataset.id);
      return;
    }
    const box = c.getBoundingClientRect();
    caretAtX(c, Math.max(box.left + 1, Math.min(e.clientX, box.right - 1)),
      Math.max(box.top + 2, Math.min(e.clientY, box.bottom - 2)));
  }

  document.addEventListener("pointerdown", e => {
    if (!e.target.closest("#note, .menu")) clearSelection();
  });

  // A click beside the note (not on it, a menu or the sidebar) goes back
  // to the notes; a drag that starts in the note doesn't count
  let downOutside = false;
  const OUTSIDE_SKIP = "#note, .menu, #tk-sidebar, #tk-toast, #tk-tip, "
    + "#tk-switch, #tk-focus-chip, #tk-focus-banner, #fmt, .fmt";
  document.addEventListener("pointerdown", e => {
    downOutside = !!current && e.button === 0
      && !!e.target.closest("#content") && !e.target.closest(OUTSIDE_SKIP);
  });
  document.addEventListener("click", e => {
    if (!downOutside || !current || e.target.closest(OUTSIDE_SKIP)) return;
    downOutside = false;
    if (!getSelection().isCollapsed) return;
    location.hash = "";
  });

  function startHandle(e) {
    e.preventDefault();
    const handle = e.target.closest(".handle");
    const el = handle.closest(".block");
    const i = indexOf(el.dataset.id);
    const x0 = e.clientX, y0 = e.clientY;
    const from = byId(el.dataset.id).indent;
    let dragging = false, target = null;

    // A selected block brings the rest of the selection with it
    let ids = blocks().slice(i, subtreeEnd(i)).map(b => b.id);
    if (selected.has(el.dataset.id) && selected.size > 1) {
      const all = new Set();
      blocks().forEach((b, j) => {
        if (selected.has(b.id)) {
          blocks().slice(j, subtreeEnd(j)).forEach(x => all.add(x.id));
        }
      });
      ids = blocks().filter(b => all.has(b.id)).map(b => b.id);
    } else {
      clearSelection();
    }

    const move = ev => {
      if (!dragging && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 4) {
        return;
      }
      if (!dragging) {
        dragging = true;
        hideMenus();
        document.body.classList.add("dragging-block");
        if (document.activeElement.isContentEditable) {
          document.activeElement.blur();
        }
        ids.forEach(id => {
          const b = blocksEl.querySelector('.block[data-id="' + id + '"]');
          if (b) b.classList.add("dragging");
        });
      }
      target = dropTarget(ev, ids, from, x0);
      showDropLine(target);
      autoScroll(ev.clientY);
    };
    const up = () => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      document.body.classList.remove("dragging-block");
      dropLine.style.display = "none";
      blocksEl.querySelectorAll(".into-toggle")
        .forEach(x => x.classList.remove("into-toggle"));
      if (!dragging) {
        blockMenu(handle, el.dataset.id);
        return;
      }
      if (target) moveBlocks(ids, target);
      else renderBlocks();
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  }

  function autoScroll(y) {
    const box = content.getBoundingClientRect();
    if (y < box.top + 40) content.scrollTop -= 12;
    else if (y > box.bottom - 40) content.scrollTop += 12;
  }

  // Where a dragged block would land: before which block, at what depth
  function dropTarget(ev, ids, from, x0) {
    const els = visibleBlockEls().filter(el => !ids.includes(el.dataset.id));

    // Over the middle of a toggle: drop inside it, at the bottom
    const over = els.find(el => {
      const r = el.getBoundingClientRect();
      return ev.clientY > r.top + r.height * 0.25
        && ev.clientY < r.bottom - r.height * 0.25;
    });
    const ob = over && byId(over.dataset.id);
    if (ob && ob.type === "toggle") return { into: ob.id, intoEl: over };

    let beforeEl = null;
    for (const el of els) {
      const r = el.getBoundingClientRect();
      if (ev.clientY < r.top + r.height / 2) {
        beforeEl = el;
        break;
      }
    }
    const k = beforeEl ? els.indexOf(beforeEl) : els.length;
    const aboveEl = k > 0 ? els[k - 1] : null;
    const above = aboveEl && byId(aboveEl.dataset.id);
    const below = beforeEl && byId(beforeEl.dataset.id);
    let max = 0;
    if (above) {
      max = above.type === "toggle" && !above.open ? above.indent
        : above.indent + 1;
    }
    const min = below ? Math.min(below.indent, max) : 0;
    const unit = parseFloat(getComputedStyle(blocksEl).fontSize) * 1.625;
    const want = from + Math.round((ev.clientX - x0) / unit);
    const indent = Math.max(min, Math.min(max, want));
    return { aboveEl, beforeId: below ? below.id : null, beforeEl, indent,
      unit };
  }

  function showDropLine(t) {
    blocksEl.querySelectorAll(".into-toggle")
      .forEach(x => x.classList.toggle("into-toggle", x === t.intoEl));
    if (t.into) {
      t.intoEl.classList.add("into-toggle");
      dropLine.style.display = "none";
      return;
    }
    const host = blocksEl.getBoundingClientRect();
    let y;
    if (t.beforeEl) y = t.beforeEl.getBoundingClientRect().top;
    else if (t.aboveEl) y = t.aboveEl.getBoundingClientRect().bottom;
    else y = host.top;
    dropLine.style.display = "block";
    dropLine.style.left = (t.indent * t.unit) + "px";
    dropLine.style.top = (y - host.top - 1.5) + "px";
  }

  // Move blocks (one run, or a scattered selection) before a block or
  // into a toggle, keeping their depths relative to the first
  function moveBlocks(ids, t) {
    checkpoint();
    const set = new Set(ids);
    const list = blocks();
    const moving = list.filter(b => set.has(b.id));
    const rest = list.filter(b => !set.has(b.id));
    let at, indent;
    if (t.into) {
      const k = rest.findIndex(b => b.id === t.into);
      const tog = rest[k];
      at = k + 1;
      while (at < rest.length && rest[at].indent > tog.indent) at++;
      indent = tog.indent + 1;
    } else {
      at = t.beforeId ? rest.findIndex(b => b.id === t.beforeId)
        : rest.length;
      if (at === -1) at = rest.length;
      indent = t.indent;
    }
    const shift = indent - moving[0].indent;
    moving.forEach(b => { b.indent = Math.max(0, b.indent + shift); });
    rest.splice(at, 0, ...moving);
    list.length = 0;
    list.push(...rest);
    select([]);
    commit();
  }

  // ---- Menus ----

  function hideMenus(keepSlash) {
    document.querySelectorAll(".menu").forEach(m => {
      if (keepSlash === true && m === (slash && slash.menu)) return;
      m.remove();
    });
    if (keepSlash !== true) slash = null;
  }

  function placeMenu(menu, anchor) {
    app.appendChild(menu);
    const a = anchor.getBoundingClientRect();
    const w = menu.offsetWidth, h = menu.offsetHeight;
    let left = a.left, top = a.bottom + 4;
    if (left + w > innerWidth - 8) left = innerWidth - w - 8;
    if (top + h > innerHeight - 8) top = Math.max(8, a.top - h - 4);
    menu.style.left = Math.max(8, left) + "px";
    menu.style.top = top + "px";
  }

  function menuItem(item) {
    const btn = document.createElement("button");
    btn.className = "menu-item" + (item.danger ? " danger" : "")
      + (item.active ? " active" : "")
      + (item.sym !== undefined ? " sym" : "");
    btn.type = "button";
    if (item.sym !== undefined) {
      btn.innerHTML = '<span class="m-sym">' + item.sym + "</span>"
        + '<span class="m-name"></span><span class="m-hint">'
        + (item.hint || "") + "</span>";
      btn.querySelector(".m-name").textContent = item.label;
    } else {
      btn.textContent = item.label;
    }
    btn.addEventListener("click", e => {
      e.stopPropagation();
      if (item.confirm && !btn.dataset.armed) {
        btn.dataset.armed = "1";
        btn.textContent = item.confirm;
        return;
      }
      hideMenus();
      item.run();
    });
    return btn;
  }

  // Swatches for no colour and each named colour
  function swatches(active, pick, tint) {
    const sw = document.createElement("div");
    sw.className = "swatches";
    [null, ...COLOURS].forEach(col => {
      const s = document.createElement("button");
      s.className = "swatch" + (active === col ? " active" : "");
      s.type = "button";
      s.title = col || "default";
      if (tint) {
        s.style.background = col
          ? "color-mix(in srgb, var(--c-" + col + ") 30%, var(--bg))"
          : "var(--past-bg)";
      } else {
        s.textContent = "A";
        s.style.color = col ? "var(--c-" + col + ")" : "var(--fg)";
      }
      s.addEventListener("click", e => {
        e.stopPropagation();
        hideMenus();
        pick(col);
      });
      sw.appendChild(s);
    });
    return sw;
  }

  function showMenu(anchor, items) {
    hideMenus();
    const menu = document.createElement("div");
    menu.className = "menu";
    items.forEach(it => {
      if (it.rule) {
        const d = document.createElement("div");
        d.className = "menu-rule";
        menu.appendChild(d);
      } else if (it.heading) {
        const d = document.createElement("div");
        d.className = "menu-label";
        d.textContent = it.heading;
        menu.appendChild(d);
      } else if (it.swatches) {
        menu.appendChild(swatches(it.active, it.pick, true));
      } else if (it.icons) {
        const grid = document.createElement("div");
        grid.className = "icon-grid";
        ToolkitSidebar.folderIcons.forEach(name => {
          const b = document.createElement("button");
          b.type = "button";
          b.title = name;
          b.className = name === it.active ? "active" : "";
          b.innerHTML = ToolkitSidebar.folderIcon(name);
          b.addEventListener("click", e => {
            e.stopPropagation();
            hideMenus();
            it.pick(name);
          });
          grid.appendChild(b);
        });
        menu.appendChild(grid);
      } else {
        menu.appendChild(menuItem(it));
      }
    });
    placeMenu(menu, anchor);
  }

  // Turn into, colour, duplicate and delete for a block (or selection)
  function blockMenu(handle, id) {
    hideMenus();
    const b = byId(id);
    if (!b) return;
    const targets = selected.has(id) ? [...selected] : [id];
    if (!selected.has(id)) select([id], id);
    const menu = document.createElement("div");
    menu.className = "menu";

    const label = text => {
      const d = document.createElement("div");
      d.className = "menu-label";
      d.textContent = text;
      menu.appendChild(d);
    };
    const rule = () => {
      const d = document.createElement("div");
      d.className = "menu-rule";
      menu.appendChild(d);
    };

    // Actions first: duplicate, copy, move and delete
    const span = () => selectedSpan()
      || [indexOf(id), subtreeEnd(indexOf(id))];
    menu.appendChild(menuItem({ label: "duplicate", sym: "+", run: () => {
      checkpoint();
      const sp = span();
      duplicateRange(sp[0], sp[1]);
      select([]);
      commit();
    } }));
    menu.appendChild(menuItem({ label: "copy as markdown", sym: "⧉",
      run: () => {
        const sp = span();
        const md = blocksToMd(blocks().slice(sp[0], sp[1]));
        if (navigator.clipboard) navigator.clipboard.writeText(md);
        select([]);
        ToolkitSidebar.toast("copied as markdown");
      } }));
    menu.appendChild(menuItem({ label: "move to another note", sym: "→",
      run: () => moveToNote(handle, span()) }));
    menu.appendChild(menuItem({ label: "delete", sym: "−", run: () => {
      checkpoint();
      const sp = span();
      blocks().splice(sp[0], sp[1] - sp[0]);
      if (!blocks().length) blocks().push(newBlock());
      select([]);
      commit();
    } }));
    rule();

    Object.entries(TYPES).forEach(([type, name]) => {
      menu.appendChild(menuItem({ active: b.type === type, label: name,
        hint: TYPE_HINTS[type], sym: TYPE_SYMS[type],
        run: () => {
          checkpoint();
          targets.forEach(t => {
            const x = byId(t);
            if (x) setType(x, type);
          });
          select([]);
          const keep = type === "divider" ? undefined : id;
          commit(keep, keep ? "end" : undefined);
        } }));
    });

    if (b.type === "table") {
      rule();
      label("table");
      [["headRow", "header row"], ["headCol", "header column"]]
        .forEach(([key, name]) => {
          menu.appendChild(menuItem({ active: b[key], label: name
            + (b[key] ? ": on" : ": off"), run: () => {
              checkpoint();
              b[key] = !b[key];
              select([]);
              commit();
            } }));
        });
    }

    if (b.type !== "divider" && b.type !== "table") {
      rule();
      label("colour");
      menu.appendChild(swatches(b.color, col => {
        checkpoint();
        targets.forEach(t => {
          const x = byId(t);
          if (x) x.color = col;
        });
        select([]);
        commit();
      }));
    }

    placeMenu(menu, handle);
    menuKeys(menu);
  }

  // Arrow keys move through a menu's items, Enter chooses one
  function menuKeys(menu) {
    menu.tabIndex = -1;
    menu.focus({ preventScroll: true });
    menu.addEventListener("keydown", e => {
      const items = [...menu.querySelectorAll(".menu-item")];
      if (!items.length) return;
      let k = items.findIndex(x => x.classList.contains("hl"));
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        e.stopPropagation();
        const n = items.length;
        k = k === -1 ? (e.key === "ArrowDown" ? 0 : n - 1)
          : (k + (e.key === "ArrowDown" ? 1 : n - 1)) % n;
        items.forEach((x, j) => x.classList.toggle("hl", j === k));
        items[k].scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter" && k !== -1) {
        e.preventDefault();
        e.stopPropagation();
        items[k].click();
      } else if (e.key === "Escape") {
        e.preventDefault();
        hideMenus();
      }
    });
  }

  // Move blocks to the end of another note, picked from a list
  function moveToNote(anchor, sp) {
    const others = notes.filter(n => !n.trashed && n !== current)
      .sort((a, b) => (b.updated || 0) - (a.updated || 0));
    const menu = document.createElement("div");
    menu.className = "menu";
    const pick = document.createElement("div");
    pick.className = "note-pick";
    const input = document.createElement("input");
    input.placeholder = "move to which note?";
    pick.appendChild(input);
    menu.appendChild(pick);
    const list = document.createElement("div");
    menu.appendChild(list);
    const draw = () => {
      const q = input.value.trim().toLowerCase();
      list.innerHTML = "";
      others.filter(n => !q || (n.title || "untitled").toLowerCase()
        .includes(q)).slice(0, 12).forEach(n => {
        list.appendChild(menuItem({ label: (n.title || "").trim()
          || "untitled", sym: ToolkitSidebar.icon("notes"), run: () => {
          const before = localStorage.getItem(DATA_KEY);
          const moving = blocks().splice(sp[0], sp[1] - sp[0]);
          if (!blocks().length) blocks().push(newBlock());
          const base = Math.min(...moving.map(x => x.indent));
          moving.forEach(x => { x.indent -= base; });
          n.blocks = (n.blocks || []).filter(x => x.type !== "text"
            || x.html || n.blocks.length > 1).concat(moving);
          n.updated = Date.now();
          select([]);
          commit();
          ToolkitSidebar.toast("moved to " + ((n.title || "").trim()
            || "untitled"), () => {
            localStorage.setItem(DATA_KEY, before);
            location.reload();
          });
        } }));
      });
      if (!list.children.length) {
        const e = document.createElement("div");
        e.className = "menu-label";
        e.textContent = "no other notes";
        list.appendChild(e);
      }
    };
    input.addEventListener("input", draw);
    input.addEventListener("keydown", e => {
      e.stopPropagation();
      const first = list.querySelector(".menu-item");
      if (e.key === "Enter" && first) {
        e.preventDefault();
        first.click();
      } else if (e.key === "Escape") {
        hideMenus();
      }
    });
    draw();
    placeMenu(menu, anchor);
    input.focus();
  }

  document.addEventListener("pointerdown", e => {
    if (!e.target.closest(".menu, .handle, .more-btn")) hideMenus();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape"
      && document.querySelector(".menu:not(.slash-menu)")) {
      hideMenus();
    }
  });

  crumbsEl.addEventListener("click", e => {
    const a = e.target.closest("a");
    if (!a) return;
    e.preventDefault();
    const href = a.getAttribute("href");
    if (href === "#") location.hash = "";
    else location.hash = href.slice(1);
  });

  // ---- Size, width and mode ----

  let size = "m", width = "normal", cardSize = "l";
  try {
    const s = localStorage.getItem(SIZE_KEY);
    const w = localStorage.getItem(WIDTH_KEY);
    const k = localStorage.getItem(CARD_KEY);
    if (["s", "m", "l"].includes(s)) size = s;
    if (["normal", "wide", "full"].includes(w)) width = w;
    if (["s", "m", "l"].includes(k)) cardSize = k;
    const so = localStorage.getItem(SORT_KEY);
    if (["edited", "date", "title"].includes(so)) sortBy = so;
  } catch {}

  function applyClasses() {
    app.classList.remove("size-s", "size-m", "size-l", "width-normal",
      "width-wide", "width-full");
    app.classList.add("size-" + size, "width-" + width);
  }
  applyClasses();

  function animate(cls, ms) {
    app.classList.add(cls);
    setTimeout(() => app.classList.remove(cls), ms);
  }

  load();

  // Folders start closed on each visit; drop what older versions kept
  localStorage.removeItem(OPEN_KEY);
  window.addEventListener("hashchange", route);
  let arrangeFrame = 0;
  window.addEventListener("resize", () => {
    cancelAnimationFrame(arrangeFrame);
    arrangeFrame = requestAnimationFrame(() => {
      if (current) placeBack();
      else arrangePanels();
    });
  });

  // Follow changes made in another tab, such as ticks in the to-dos
  window.addEventListener("storage", e => {
    if (e.key !== DATA_KEY) return;
    const a = document.activeElement;
    if (a && a.isContentEditable) return;
    const openId = current && current.id;
    load();
    current = notes.find(n => n.id === openId) || null;
    if (current) renderNote();
    else if (!openId) renderGallery();
  });

  ToolkitSidebar.init({
    active: "notes",
    mode: {
      apply: (m, anim) => {
        if (anim) animate("theme-anim", 300);
        app.classList.toggle("t-dark", m !== "light");
        app.classList.toggle("t-light", m === "light");
      },
      initial: "dark"
    },
    onView: id => {
      if (id !== "notes") return false;
      if (location.hash) location.hash = "";
      else route();
      return true;
    },
    page: "notes/index.html",

    // Size sets both the gallery's panels and a note's text
    size: {
      get: () => size,
      set: v => {
        size = cardSize = v;
        localStorage.setItem(SIZE_KEY, v);
        localStorage.setItem(CARD_KEY, v);
        applyClasses();
        if (!current) renderGallery();
      }
    },
    width: {
      get: () => width,
      set: v => {
        width = v;
        localStorage.setItem(WIDTH_KEY, v);
        applyClasses();
        setTimeout(() => {
          if (current) placeBack();
          else arrangePanels();
        }, 270);
      }
    }
  });

  route();

  // Sync notes via Google Drive
  ToolSync.init({
    file:     "notes.json",
    keys:     [DATA_KEY],
    onRemote: () => {
      const openId = current && current.id;
      const active = document.activeElement;
      const c = active && active.closest && active.closest("#blocks .content");
      const caretId = c && c.closest(".block").dataset.id;
      const offset = c ? textBefore(c) : null;
      load();
      current = notes.find(n => n.id === openId) || null;
      if (openId && !current) {
        location.hash = "";
        route();
        return;
      }
      if (!current) return renderGallery();
      renderNote();
      if (caretId && contentOf(caretId)) {
        setCaret(contentOf(caretId), offset ? offset.length : 0);
      }
    }
  });
</script>
</body>
</html>
