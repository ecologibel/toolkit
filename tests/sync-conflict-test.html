<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sync conflict test</title>
<h1>Sync conflict test</h1>
<p>This test uses a fake Drive response and temporary localStorage keys. It does
not contact Google Drive or change toolkit records.</p>
<label for="resolution">Test scenario</label>
<select id="resolution">
  <option value="detect">Detect conflict only</option>
  <option value="LOCAL">Keep this device's copy</option>
  <option value="DRIVE">Use Drive's copy</option>
</select>
<button id="run" type="button">Run test</button>
<pre id="result" role="status" aria-live="polite">Ready.</pre>
<script>
  window.__syncTestNativeSet = Storage.prototype.setItem;
  window.__syncTestNativeRemove = Storage.prototype.removeItem;
  window.setInterval = () => 0;
  const appendHead = HTMLHeadElement.prototype.appendChild;
  HTMLHeadElement.prototype.appendChild = function (node) {
    if (node.tagName === "SCRIPT"
        && node.src.includes("accounts.google.com/gsi/client")) return node;
    return appendHead.call(this, node);
  };
</script>
<script src="../sync.js"></script>
<script src="sync-conflict-test.js"></script>
